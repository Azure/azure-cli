        and records proof of the Screen Capture(s) using blockchain technology to
        ensure that the record is secure. Trademark Keeper also allows You to identify
        up to three (3) individual trademarks to help You catalog Your brand assets
        in Your dashboard. Trademark Keeper stores the Screen Capture(s) on servers
        provisioned by Azure but does not analyze, modify or edit the Screen Capture(s).
        Trademark Keeper stores a digital signature of the Screen Captures on a blockchain
        proving the Screen Captures\u2019 existence at a certain time, but does not

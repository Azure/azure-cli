        Name\",\"Thumbprint\"]},\"benchmarkReferences\":[{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1230\",\"name\":\"VA1230\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1230\",\"status\":\"NonFinding\",\"isTrimmed\":false,\"queryResults\":[[\"False\"]],\"remediation\":{\"description\":\"1.

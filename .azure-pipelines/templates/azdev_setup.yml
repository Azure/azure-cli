parameters:
  - name: CLIRepoPath
    type: string
    default: '.'
  - name: CLIExtensionRepoPath
    type: string
    default: ''
  - name: EnableCompactAAZ
    type: boolean
    default: false
  # Temporary immutable candidates until the validated packages are released.
  # Keep both requirements on the same commit; overrides may also be wheel paths.
  - name: AzdevPackage
    type: string
    default: 'azdev @ git+https://github.com/aryasadeghi1/azure-cli-dev-tools.git@c429216bfdae9b196dcfa6689f4d3f15a7b7054e'
  - name: DiffToolPackage
    type: string
    default: 'azure-cli-diff-tool @ git+https://github.com/aryasadeghi1/azure-cli-dev-tools.git@c429216bfdae9b196dcfa6689f4d3f15a7b7054e#subdirectory=azure-cli-diff-tool'
steps:
  - bash: |
      set -ev

      python -m venv env
      chmod +x env/bin/activate
      . env/bin/activate

      python -m pip install -U pip "setuptools>=78.1.1"
      packages=("$AZDEV_PACKAGE")
      if [ -n "$DIFF_TOOL_PACKAGE" ]; then
        packages+=("$DIFF_TOOL_PACKAGE")
      fi
      python -m pip install --upgrade "${packages[@]}"
      azdev --version

      if [ -z "$CLI_EXT_REPO_PATH" ]; then
        azdev setup -c $CLI_REPO_PATH --debug
      else
        azdev setup -c $CLI_REPO_PATH -r $CLI_EXT_REPO_PATH --debug
      fi
      # This helps detect issues in CI if a used SDK API version is deleted by the below script.
      python $CLI_REPO_PATH/scripts/trim_sdk.py
      # This helps detect issues in CI if aaz compacted
      echo EnableCompactAAZ: ${{ parameters.EnableCompactAAZ }}
      if [ "${{ parameters.EnableCompactAAZ }}" == 'True' ]; then
        python $CLI_REPO_PATH/scripts/compact_aaz.py
      fi

      # Verify installation and build command index
      az --version
    displayName: 'azdev setup'
    env:
      AZDEV_PACKAGE: ${{ parameters.AzdevPackage }}
      DIFF_TOOL_PACKAGE: ${{ parameters.DiffToolPackage }}
      CLI_REPO_PATH: ${{ parameters.CLIRepoPath }}
      CLI_EXT_REPO_PATH: ${{ parameters.CLIExtensionRepoPath }}

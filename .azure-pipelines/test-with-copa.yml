variables:
- template: ${{ variables.Pipeline.Workspace }}/.azure-pipelines/templates/variables.yml
- name: Codeql.Enabled
  value: false
- name: ComponentDetection.ForceScan
  value: eq(variables['Build.SourceBranch'], 'refs/heads/release')
- name: CopaVersion
  value: 0.12.0-rc.1

parameters:
- name: architectures
  type: object
  default:
  - name: AMD64
    value: amd64
    pool: pool-ubuntu-latest-multi-core
  - name: ARM64
    value: arm64
    pool: pool-ubuntu-latest-arm64
- name: ShouldTest
  displayName: Test?
  type: boolean
  default: false
- name: PatchLevel
  displayName: library-patch-level?
  default: "patch"
  values:
    - patch
    - minor
    - major

stages:
- stage: PrepareInfo
  displayName: Prepare Build Info
  jobs:
  - job: PrepareAzCliVersion
    displayName: Prepare Build Info
    pool:
      name: ${{ variables.ubuntu_pool }}
    steps:
    - checkout: none
    - task: Bash@3
      name: PrepareAzCliVersionTask
      displayName: Prepare Build Info
      inputs:
        targetType: 'inline'
        script: |
          curl -o __main__.py https://raw.githubusercontent.com/$BUILD_REPOSITORY_NAME/$BUILD_SOURCEBRANCH/src/azure-cli/azure/cli/__main__.py
          AzCLI_VERSION=`cat __main__.py | grep __version__ | sed s/' '//g | sed s/'__version__='// |  sed s/\"//g`
          
          AzCLI_IMAGE_NAME="clibuild_$BUILD_BUILDNUMBER"
          AzCLI_IMAGE_TAG="latest"
          AzCLI_IMAGE_PATCHED_TAG="latest-patched"
        
          echo "Azure CLI version: $AzCLI_VERSION"
          echo "Azure CLI Image Name: $AzCLI_IMAGE_NAME"
          echo "Azure CLI Image Tag: $AzCLI_IMAGE_TAG"
          echo "Azure CLI Image Patched Tag: $AzCLI_IMAGE_PATCHED_TAG"

          echo "##vso[task.setvariable variable=AzCliVersion]$AzCLI_VERSION"

          echo "##vso[task.setvariable variable=AzCliVersion;isOutput=true]$AzCLI_VERSION"
          echo "##vso[task.setvariable variable=AzCliImageName;isOutput=true]$AzCLI_IMAGE_NAME"
          echo "##vso[task.setvariable variable=AzCliImageTag;isOutput=true]$AzCLI_IMAGE_TAG"
          echo "##vso[task.setvariable variable=AzCliImagePatchedTag;isOutput=true]$AzCLI_IMAGE_PATCHED_TAG"

    - task: PowerShell@2
      displayName: Set Build name
      inputs:
        targetType: inline
        pwsh: true
        script: |
          # build name has 2 limitations
          # - The maximum length of a build name is 255 characters.
          # - Characters which are not allowed include '"', '/', ':', '<', '>', '\', '|', '?', '@', and '*'.
          
          $originalBuildName = "$(Build.BuildNumber)"
          $newBuildName = "$originalBuildName - Azure CLI Docker Build $(AzCliVersion)"

          if("${{parameters.ShouldTest}}" -eq "true") {
            $newBuildName = "$newBuildName with Test"
          } else {
            $newBuildName = "$newBuildName without Test"
          }

          $notAllowedChars = @('"', '/', ':', '<', '>', '\', '|', '?', '@', '*')
          $notAllowedChars | ForEach-Object {$newBuildName = $newBuildName.Replace($_, '_')}
          if ( $newBuildName.Length -gt 200 ) {
            $newBuildName = $newBuildName.Substring(0, 200)
          }
          Write-Host "##vso[build.updatebuildnumber]$newBuildName"

    - task: AzureCLI@2
      name: PrepareServiceConnectionInfoTask
      displayName: Get Azure Service Connection Info
      inputs:
        azureSubscription: '$(TestAzureSubscription)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az account show
          
          # Get user, subscription and tenant info
          AzUserId=$(az account show --query user.name -o tsv)
          AzSubscription=$(az account show --query id -o tsv)
          AzTenant=$(az account show --query tenantId -o tsv)
          
          echo "Azure User ID: $AzUserId"
          echo "Azure Subscription: $AzSubscription"
          echo "Azure Tenant: $AzTenant"
          echo "Azure Service Connection Id: $AZURESUBSCRIPTION_SERVICE_CONNECTION_ID"
          
          # Set pipeline variables as secrets
          echo "##vso[task.setvariable variable=AzUserId;issecret=true;isOutput=true]$AzUserId"
          echo "##vso[task.setvariable variable=AzSubscription;issecret=true;isOutput=true]$AzSubscription"
          echo "##vso[task.setvariable variable=AzTenant;issecret=true;isOutput=true]$AzTenant"
          echo "##vso[task.setvariable variable=ServiceConnectionId;isOutput=true]$AZURESUBSCRIPTION_SERVICE_CONNECTION_ID"

- stage: Build
  displayName: Build RPM and Docker Images
  dependsOn: 
  - PrepareInfo
  variables:
    AzCliVersion: $[ stageDependencies.PrepareInfo.PrepareAzCliVersion.outputs['PrepareAzCliVersionTask.AzCliVersion'] ]
    AzCliImageName: $[ stageDependencies.PrepareInfo.PrepareAzCliVersion.outputs['PrepareAzCliVersionTask.AzCliImageName'] ]
    AzCliImageTag: $[ stageDependencies.PrepareInfo.PrepareAzCliVersion.outputs['PrepareAzCliVersionTask.AzCliImageTag'] ]
  jobs:
  - job: BuildRpmPackagesAzureLinux
    displayName: Build Rpm
    strategy:
      matrix:
        ${{ each arch in parameters.architectures }}:
          ${{ arch.name }}:
            image: mcr.microsoft.com/azurelinux/base/core:3.0
            uploadArtifact: rpm-azurelinux3.0-${{ arch.value }}
            pool: ${{ arch.pool }}
    pool:
      name: $(pool)
    steps:
    - bash: ./scripts/ci/install_docker.sh
      displayName: Install Docker

    - task: PipAuthenticate@1
      condition: startsWith(variables['Build.SourceBranch'], 'refs/heads/release')
      displayName: 'Pip Authenticate'
      inputs:
        artifactFeeds: $(AZURE_ARTIFACTS_FEEDS)

    - task: Bash@3
      displayName: 'Build Rpm Package: Azure Linux'
      inputs:
        targetType: 'filePath'
        filePath: scripts/release/rpm/pipeline_azurelinux.sh

    - task: AzureArtifacts.manifest-generator-task.manifest-generator-task.ManifestGeneratorTask@0
      displayName: 'SBOM'
      condition: startsWith(variables['Build.SourceBranch'], 'refs/heads/release')
      inputs:
        BuildDropPath: $(Build.ArtifactStagingDirectory)

    - task: PublishPipelineArtifact@0
      displayName: 'Publish Artifact: rpm-azurelinux'
      inputs:
        TargetPath: $(Build.ArtifactStagingDirectory)
        ArtifactName: $(uploadArtifact)

  - job: BuildDockerImageAzureLinux
    displayName: Build Docker Image
    dependsOn: 
    - BuildRpmPackagesAzureLinux
    strategy:
      matrix:
        ${{ each arch in parameters.architectures }}:
          ${{ arch.name }}:
            pool: ${{ arch.pool }}
            downloadArtifactName: rpm-azurelinux3.0-${{ arch.value }}
            uploadArtifactName: docker-azurelinux3.0-${{ arch.value }}
            dockerfile: azure-linux.dockerfile
            image: mcr.microsoft.com/azurelinux/base/core:3.0
    pool:
      name: $(pool)
    steps:
      - bash: ./scripts/ci/install_docker.sh
        displayName: Install Docker

      - task: DownloadPipelineArtifact@1
        displayName: 'Download Build Artifacts'
        inputs:
          TargetPath: '$(Build.ArtifactStagingDirectory)/docker'
          artifactName: $(downloadArtifactName)

      - bash: |
          set -ex
          mkdir docker-temp
          mv $(Build.ArtifactStagingDirectory)/docker/*.rpm ./docker-temp/azure-cli.rpm
          
          docker build --no-cache \
            --build-arg IMAGE=$IMAGE \
            --tag $(AzCliImageName):$(AzCliImageTag) \
            --file $DOCKERFILE \
            $BUILD_SOURCESDIRECTORY

          docker save -o "$BUILD_STAGINGDIRECTORY/docker-azure-cli-$(AzCliVersion).tar" $(AzCliImageName):$(AzCliImageTag)
          
        displayName: 'Build Docker'

      - task: AzureArtifacts.manifest-generator-task.manifest-generator-task.ManifestGeneratorTask@0
        displayName: 'SBOM'
        condition: startsWith(variables['Build.SourceBranch'], 'refs/heads/release')
        inputs:
          BuildDropPath: $(Build.ArtifactStagingDirectory)
          DockerImagesToScan: $(AzCliDockerImageTag)

      - task: PublishPipelineArtifact@0
        inputs:
          TargetPath: $(Build.ArtifactStagingDirectory)
          ArtifactName: $(uploadArtifactName)

- stage: Test1
  displayName: 1st Test - for Original Image
  dependsOn: 
  - PrepareInfo
  - Build 
  variables:
    AzCliVersion: $[ stageDependencies.PrepareInfo.PrepareAzCliVersion.outputs['PrepareAzCliVersionTask.AzCliVersion'] ]
    AzCliImageName: $[ stageDependencies.PrepareInfo.PrepareAzCliVersion.outputs['PrepareAzCliVersionTask.AzCliImageName'] ]
    AzCliImageTag: $[ stageDependencies.PrepareInfo.PrepareAzCliVersion.outputs['PrepareAzCliVersionTask.AzCliImageTag'] ]
    TestAzUserId: $[ stageDependencies.PrepareInfo.PrepareAzCliVersion.outputs['PrepareServiceConnectionInfoTask.AzUserId'] ]
    TestAzSubscription: $[ stageDependencies.PrepareInfo.PrepareAzCliVersion.outputs['PrepareServiceConnectionInfoTask.AzSubscription'] ]
    TestAzTenant: $[ stageDependencies.PrepareInfo.PrepareAzCliVersion.outputs['PrepareServiceConnectionInfoTask.AzTenant'] ]
    TestServiceConnectionId: $[ stageDependencies.PrepareInfo.PrepareAzCliVersion.outputs['PrepareServiceConnectionInfoTask.ServiceConnectionId'] ]
  jobs:
  - job: TestRpmPackagesAzureLinux
    displayName: Test - Rpm Package
    timeoutInMinutes: 180
    condition: and(succeeded(), in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI', 'Manual', 'Schedule'), eq(${{parameters.ShouldTest}}, true))
    pool:
      name: $(pool)
    strategy:
      matrix:
        ${{ each arch in parameters.architectures }}:
          ${{ arch.name }}:
            image: mcr.microsoft.com/azurelinux/base/core:3.0
            downloadArtifactName: rpm-azurelinux3.0-${{ arch.value }}
            pool: ${{ arch.pool }}
    steps:
    - task: DownloadPipelineArtifact@1
      displayName: 'Download Build Artifacts'
      inputs:
        TargetPath: '$(Build.ArtifactStagingDirectory)/rpm'
        artifactName: $(downloadArtifactName)

    - bash: ./scripts/ci/install_docker.sh
      displayName: Install Docker

    - bash: |
        set -ex
        RPM_NAME=$(find $SYSTEM_ARTIFACTSDIRECTORY/rpm/ -type f -name "azure-cli-$(AzCliVersion)-1.*.rpm" -printf '%f\n')

        echo "== Test rpm package on ${IMAGE} =="
        docker pull $IMAGE
        docker run --rm -e RPM_NAME=$RPM_NAME -v $SYSTEM_ARTIFACTSDIRECTORY/rpm:/mnt/rpm -v $(pwd):/azure-cli $IMAGE /bin/bash /azure-cli/scripts/release/rpm/test_azurelinux_in_docker.sh
      displayName: 'Test Rpm Package Azure Linux'

  - template: templates/test-docker-image-smoke.yml
    parameters:
      architectures: ${{ parameters.architectures }}
      ShouldTest: ${{ parameters.ShouldTest }}
      timeoutInMinutes: 100
      AzCliVersion: $(AzCliVersion)
      AzCliImageName: $(AzCliImageName)
      AzCliImageTag: $(AzCliImageTag)
      TestAzUserId: $(TestAzUserId)
      TestAzSubscription: $(TestAzSubscription)
      TestAzTenant: $(TestAzTenant)
      TestServiceConnectionId: $(TestServiceConnectionId)

  - template: templates/test-docker-image-unit.yml
    parameters:
      architectures: ${{ parameters.architectures }}
      ShouldTest: ${{ parameters.ShouldTest }}
      timeoutInMinutes: 180
      AzCliVersion: $(AzCliVersion)
      AzCliImageName: $(AzCliImageName)
      AzCliImageTag: $(AzCliImageTag)

- stage: PatchWithCopa
  displayName: Patch with Copacetic
  dependsOn: 
  - PrepareInfo
  - Build
  variables:
    AzCliVersion: $[ stageDependencies.PrepareInfo.PrepareAzCliVersion.outputs['PrepareAzCliVersionTask.AzCliVersion'] ]
    AzCliImageName: $[ stageDependencies.PrepareInfo.PrepareAzCliVersion.outputs['PrepareAzCliVersionTask.AzCliImageName'] ]
    AzCliImageTag: $[ stageDependencies.PrepareInfo.PrepareAzCliVersion.outputs['PrepareAzCliVersionTask.AzCliImageTag'] ]
    AzCliImagePatchedTag: $[ stageDependencies.PrepareInfo.PrepareAzCliVersion.outputs['PrepareAzCliVersionTask.AzCliImagePatchedTag'] ]
  jobs:
  - job: BuildCopaPatchedDockerImage
    displayName: Build Copa Patched Docker Image
    timeoutInMinutes: 180
    strategy:
      matrix:
        ${{ each arch in parameters.architectures }}:
          ${{ arch.name }}:
            pool: ${{ arch.pool }}
            downloadArtifactName: docker-azurelinux3.0-${{ arch.value }}
            uploadArtifactName: docker-azurelinux3.0-${{ arch.value }}-patched
            architecture: ${{ arch.value }}
    pool:
      name: $(pool)

    steps:
      - task: DownloadPipelineArtifact@1
        displayName: 'Download Docker Image'
        inputs:
          TargetPath: '$(Build.ArtifactStagingDirectory)/docker'
          artifactName: $(downloadArtifactName)

      - bash: ./scripts/ci/install_docker.sh
        displayName: Install Docker
      
      - task: Bash@3
        displayName: Configure Docker Daemon
        inputs:
          targetType: 'inline'
          script: |
            if [ -f /etc/docker/daemon.json ]; then
              echo "Docker daemon.json exists, printing content:"
              cat /etc/docker/daemon.json
            else
              echo "Docker daemon.json does not exist, creating it..."
              sudo mkdir -p /etc/docker
              echo '{"features": { "containerd-snapshotter": true }}' | sudo tee /etc/docker/daemon.json
              echo "Created /etc/docker/daemon.json with containerd-snapshotter enabled"
            fi

      - task: Bash@3
        displayName: Restart Docker
        inputs:
          targetType: 'inline'
          script: |
            sudo systemctl restart docker

      - task: Bash@3
        displayName: Install Trivy
        inputs:
          targetType: 'inline'
          script: |
            set -eux
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/bin
            echo "----------------------------------"
            trivy --version

      - task: Bash@3
        displayName: Install copacetic
        inputs:
          targetType: 'inline'
          script: |
            CopaDownloadUrl="https://github.com/project-copacetic/copacetic/releases/download/v$(CopaVersion)/copa_$(CopaVersion)_linux_amd64.tar.gz"
            if [ "$(architecture)" = "arm64" ]; then
              CopaDownloadUrl="https://github.com/project-copacetic/copacetic/releases/download/v$(CopaVersion)/copa_$(CopaVersion)_linux_arm64.tar.gz"
            fi
            echo "Download copa from: $CopaDownloadUrl"
            curl -L -o /tmp/copa.tar.gz $CopaDownloadUrl
            sudo mkdir -p /opt/copacetic
            sudo tar zxf /tmp/copa.tar.gz -C /opt/copacetic
            sudo chmod +x /opt/copacetic/copa
            sudo ln -s /opt/copacetic/copa /usr/bin/copa

            echo "---------------- copa --version ------------------"
            copa --version
            echo "---------------- copa --help ------------------"
            copa --help
            echo "---------------- copa patch --help ------------------"
            copa patch --help
            echo "-----------------------------------------------------"

      - task: Bash@3
        displayName: Check Docker Image
        inputs:
          targetType: 'inline'
          script: |
              TAR_FILE="$SYSTEM_ARTIFACTSDIRECTORY/docker/docker-azure-cli-$(AzCliVersion).tar"
              docker load < $TAR_FILE
              
              echo "== Check Docker Images =="
              docker images
              
              echo "== docker container =="
              docker ps
              
              echo "== Run az self-test  =="
              docker run $(AzCliImageName):$(AzCliImageTag) /bin/bash -c "time az self-test && time az --version && tdnf list --installed"

      - task: Bash@3
        displayName: Scan with Trivy
        inputs:
          targetType: 'inline'
          script: |
            mkdir output
            export IMAGE=$(AzCliImageName):$(AzCliImageTag)
            OutputFile="trivy-scan-before.json"
            trivy image --pkg-types os,library --ignore-unfixed -f json -o $OutputFile $IMAGE
            cp $OutputFile ./output/

      - task: Bash@3
        displayName: Patch with Copacetic
        inputs:
          targetType: 'inline'
          script: |
            export COPA_EXPERIMENTAL=1
            export IMAGE=$(AzCliImageName):$(AzCliImageTag)
            copa patch -i $IMAGE -r trivy-scan-before.json --pkg-types os,library --library-patch-level ${{parameters.PatchLevel}} --tag $(AzCliImagePatchedTag)

      - task: Bash@3
        displayName: Check Docker Image
        inputs:
          targetType: 'inline'
          script: |
              echo "== Check Docker Images =="
              docker images

              echo "== Run az self-test  =="
              docker run $(AzCliImageName):$(AzCliImagePatchedTag) /bin/bash -c "time az self-test && time az --version && tdnf list --installed"

      - task: Bash@3
        displayName: Save Docker Image
        inputs:
          targetType: 'inline'
          script: |
            echo "== Check Docker Images =="
            docker images

            echo "== Save Docker Image to tar file  =="
            docker save -o "$BUILD_STAGINGDIRECTORY/docker-azure-cli-$(AzCliVersion).tar" $(AzCliImageName):$(AzCliImagePatchedTag)

      - task: AzureArtifacts.manifest-generator-task.manifest-generator-task.ManifestGeneratorTask@0
        displayName: 'SBOM'
        inputs:
          BuildDropPath: $(Build.ArtifactStagingDirectory)
          DockerImagesToScan: $(AzCliImagePatchedTag)

      - task: PublishPipelineArtifact@0
        displayName: Publish docker Artifact
        inputs:
          TargetPath: $(Build.ArtifactStagingDirectory)
          ArtifactName: $(uploadArtifactName)

      - task: Bash@3
        displayName: Scan with Trivy again
        continueOnError: true
        inputs:
          targetType: 'inline'
          script: |
            set -eux
            export IMAGE=$(AzCliImageName):$(AzCliImagePatchedTag)
            OutputFile="trivy-scan-after.json"
            trivy image --pkg-types os,library --ignore-unfixed -f json -o $OutputFile $IMAGE
            cp $OutputFile ./output/

      - publish: $(System.DefaultWorkingDirectory)/output
        artifact: $(AzCliVersion)-$(architecture)-trivy
        displayName: Publish trivy Artifact

- stage: Test2
  displayName: 2nd Test - for Copa Patched Image
  dependsOn: 
  - PrepareInfo
  - Build
  - PatchWithCopa
  variables:
    AzCliVersion: $[ stageDependencies.PrepareInfo.PrepareAzCliVersion.outputs['PrepareAzCliVersionTask.AzCliVersion'] ]
    AzCliImageName: $[ stageDependencies.PrepareInfo.PrepareAzCliVersion.outputs['PrepareAzCliVersionTask.AzCliImageName'] ]
    AzCliImageTag: $[ stageDependencies.PrepareInfo.PrepareAzCliVersion.outputs['PrepareAzCliVersionTask.AzCliImageTag'] ]
    AzCliImagePatchedTag: $[ stageDependencies.PrepareInfo.PrepareAzCliVersion.outputs['PrepareAzCliVersionTask.AzCliImagePatchedTag'] ]
    TestAzUserId: $[ stageDependencies.PrepareInfo.PrepareAzCliVersion.outputs['PrepareServiceConnectionInfoTask.AzUserId'] ]
    TestAzSubscription: $[ stageDependencies.PrepareInfo.PrepareAzCliVersion.outputs['PrepareServiceConnectionInfoTask.AzSubscription'] ]
    TestAzTenant: $[ stageDependencies.PrepareInfo.PrepareAzCliVersion.outputs['PrepareServiceConnectionInfoTask.AzTenant'] ]
    TestServiceConnectionId: $[ stageDependencies.PrepareInfo.PrepareAzCliVersion.outputs['PrepareServiceConnectionInfoTask.ServiceConnectionId'] ]
  jobs:
  - template: templates/test-docker-image-smoke.yml
    parameters:
      architectures: ${{ parameters.architectures }}
      ShouldTest: ${{ parameters.ShouldTest }}
      downloadArtifactNameSuffix: '-patched'
      timeoutInMinutes: 100
      AzCliVersion: $(AzCliVersion)
      AzCliImageName: $(AzCliImageName)
      AzCliImageTag: $(AzCliImagePatchedTag)
      TestAzUserId: $(TestAzUserId)
      TestAzSubscription: $(TestAzSubscription)
      TestAzTenant: $(TestAzTenant)
      TestServiceConnectionId: $(TestServiceConnectionId)

  - template: templates/test-docker-image-unit.yml
    parameters:
      architectures: ${{ parameters.architectures }}
      ShouldTest: ${{ parameters.ShouldTest }}
      downloadArtifactNameSuffix: '-patched'
      timeoutInMinutes: 180
      AzCliVersion: $(AzCliVersion)
      AzCliImageName: $(AzCliImageName)
      AzCliImageTag: $(AzCliImagePatchedTag)

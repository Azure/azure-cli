        be effective when the Services in question come up for renewal as further
        described below.   \\r</p>\\n<p>Unless otherwise specifically noted (for reasons
        such as those highlighted in Section 2(x) above), the renewal price for any
        domain name in any TLD will be the same as the list (non-sale) price shown
        when you search for and select a domain, and again in the cart prior to purchase.
        \ For example, if the list price is $9.99, and a different renewal price is

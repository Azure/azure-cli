[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-cli-core"
version = "2.91.0"
description = "Microsoft Azure Command-Line Tools Core Module"
readme = { file = "README.rst", content-type = "text/x-rst" }
requires-python = ">=3.10.0"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Microsoft Corporation", email = "azpycli@microsoft.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    'argcomplete~=3.5.2',
    'azure-cli-telemetry==1.1.0.*',
    'azure-core~=1.39.0',
    'azure-mgmt-core>=1.2.0,<2',
    'cryptography',
    # On Linux, the distribution (Ubuntu, Debian, etc) and version are logged in telemetry
    'distro; sys_platform == "linux"',
    'humanfriendly~=10.0',
    'jmespath',
    'knack~=0.14.0',
    'microsoft-security-utilities-secret-masker~=1.0.0b4',
    'msal-extensions==1.3.1',
    'msal[broker]==1.39.0; sys_platform == "win32" or sys_platform == "darwin"',
    'msal==1.39.0; sys_platform != "win32" and sys_platform != "darwin"',
    'packaging>=20.9',
    # pkginfo>=1.12.0 reads the spec-defined wheel METADATA / unpacked .dist-info
    # layout produced by modern wheel/setuptools (no metadata.json). Required so
    # WheelExtension.get_metadata works without the legacy wheel==0.30.0 artifact.
    'pkginfo>=1.12.0',
    # psutil can't install on cygwin: https://github.com/Azure/azure-cli/issues/9399
    'psutil>=5.9; sys_platform != "cygwin"',
    'PyJWT>=2.1.0',
    'pyopenssl>=17.1.0', # https://github.com/pyca/pyopenssl/pull/612
    'py-deviceid',
    'requests[socks]',
]

[project.urls]
Homepage = "https://github.com/Azure/azure-cli"

[tool.setuptools]
include-package-data = false
zip-safe = false

[tool.setuptools.packages.find]
namespaces = false
exclude = ["*.tests", "*.tests.*", "tests.*", "tests", "azure", "azure.cli"]

[tool.setuptools.package-data]
"azure.cli.core" = ["auth/landing_pages/*.html", "commandIndex.latest.json", "helpIndex.latest.json"]
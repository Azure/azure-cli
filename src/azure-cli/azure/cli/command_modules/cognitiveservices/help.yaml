version: 1
content:
  - command:
      name: cognitiveservices account costcontrol create
      examples:
        - summary: Create an account-owned monthly budget of 100 US dollars.
          command: >-
            az cognitiveservices account costcontrol create
            --resource-group MyResourceGroup --account-name MyAccount --cost-control-name accountBudget
            --category Cost --amount 100 --time-grain Monthly
            --time-period start-date=2027-01-01T00:00:00Z end-date=2028-01-01T00:00:00Z
  - command:
      name: cognitiveservices account costcontrol delete
      examples:
        - summary: Delete an account-owned cost control without confirmation.
          command: >-
            az cognitiveservices account costcontrol delete
            --resource-group MyResourceGroup --account-name MyAccount --cost-control-name accountBudget --yes
  - command:
      name: cognitiveservices account costcontrol head
      examples:
        - summary: Check whether an account-owned cost control exists without returning its body.
          command: >-
            az cognitiveservices account costcontrol head
            --resource-group MyResourceGroup --account-name MyAccount --cost-control-name accountBudget
  - command:
      name: cognitiveservices account costcontrol list
      examples:
        - summary: List the cost controls owned by an account.
          command: >-
            az cognitiveservices account costcontrol list
            --resource-group MyResourceGroup --account-name MyAccount
  - command:
      name: cognitiveservices account costcontrol show
      examples:
        - summary: Show an account-owned cost control.
          command: >-
            az cognitiveservices account costcontrol show
            --resource-group MyResourceGroup --account-name MyAccount --cost-control-name accountBudget
  - command:
      name: cognitiveservices account costcontrol update
      examples:
        - summary: Increase an account-owned cost budget to 150 US dollars.
          command: >-
            az cognitiveservices account costcontrol update
            --resource-group MyResourceGroup --account-name MyAccount --cost-control-name accountBudget --amount 150
  - command:
      name: cognitiveservices account project costcontrol create
      examples:
        - summary: Create a Foundry project-owned monthly budget of one million tokens.
          command: >-
            az cognitiveservices account project costcontrol create
            --resource-group MyResourceGroup --account-name MyAccount --project-name MyProject
            --cost-control-name projectBudget --category Tokens --amount 1000000 --time-grain Monthly
            --time-period start-date=2027-01-01T00:00:00Z end-date=2028-01-01T00:00:00Z
  - command:
      name: cognitiveservices account project costcontrol delete
      examples:
        - summary: Delete a Foundry project-owned cost control without confirmation.
          command: >-
            az cognitiveservices account project costcontrol delete
            --resource-group MyResourceGroup --account-name MyAccount --project-name MyProject
            --cost-control-name projectBudget --yes
  - command:
      name: cognitiveservices account project costcontrol head
      examples:
        - summary: Check whether a Foundry project-owned cost control exists without returning its body.
          command: >-
            az cognitiveservices account project costcontrol head
            --resource-group MyResourceGroup --account-name MyAccount --project-name MyProject
            --cost-control-name projectBudget
  - command:
      name: cognitiveservices account project costcontrol list
      examples:
        - summary: List the cost controls owned by a Foundry project.
          command: >-
            az cognitiveservices account project costcontrol list
            --resource-group MyResourceGroup --account-name MyAccount --project-name MyProject
  - command:
      name: cognitiveservices account project costcontrol show
      examples:
        - summary: Show a Foundry project-owned cost control.
          command: >-
            az cognitiveservices account project costcontrol show
            --resource-group MyResourceGroup --account-name MyAccount --project-name MyProject
            --cost-control-name projectBudget
  - command:
      name: cognitiveservices account project costcontrol update
      examples:
        - summary: Increase a Foundry project-owned token budget to one and a half million tokens.
          command: >-
            az cognitiveservices account project costcontrol update
            --resource-group MyResourceGroup --account-name MyAccount --project-name MyProject
            --cost-control-name projectBudget --amount 1500000

        \       <p><p><strong>Transfer Validation</strong> The transfer validation
        service is provided to help You keep Your domain name secure. By choosing
        to use the service, You are making an explicit and voluntary request to us
        to deny all attempts to transfer Your domain name to another registrar, or
        to move Your domain name to another account, unless You verify each request
        as described herein. You will provide us with a contact name, phone number
        and PIN for domain transfer validations. You will be contacted by us when
        a domain transfer is requested for a domain name in Your account. </p>\\n<p>When
        we receive a transfer request, we will call You to verify the transfer request.
        If we cannot reach You with seventy-two (72) hours of receipt of the transfer
        request, the transfer will be denied. If You do not provide the proper PIN,
        the transfer will be denied. When we receive a change of account request,
        we will call You to verify the change request. If we cannot reach You with
        seventy-two (72) hours of receipt of the change request, the change will be
        denied. If You do not provide the proper PIN, the change will be denied. Availability
        of Services are subject to the terms and conditions of this Agreement and
        each of our policies and procedures. We shall use commercially reasonable
        efforts to attempt to provide certain portions of the Services on a twenty-four
        (24) hours a day, seven (7) days a week basis throughout the term of this
        Agreement and other portions of the service, during normal business hours.
        </p>\\n<p>You acknowledge and agree that from time to time the Services may
        be inaccessible or inoperable for any reason, including, without limitation:
        (i) equipment malfunctions; (ii) periodic maintenance procedures or repairs
        that we may undertake from time to time; or (iii) causes beyond the reasonable
        control of us or that are not reasonably foreseeable by us, including, without
        limitation, interruption or failure of telecommunication or digital transmission
        links, hostile network attacks, network congestion or other failures. You
        acknowledge and agree that we has no control over the availability of the
        service on a continuous or uninterrupted basis.</p>\\n</p>\\n        <p><p><strong>Specific
        Terms for Premium DNS.</strong>  Premium DNS is a premium Domain Name System
        (\u201C<u>DNS</u>\u201D) service we provide that allows you to manage your
        DNS and keep your website and web-based applications available and performing
        reliably (&quot;Premium DNS Service&quot;). The service is provided \u201Cas
        is\u201D, \u201Cas available\u201D, and \u201Cwith all faults\u201D, and we
        assume no liability or responsibility regarding the same. Subject to the Exclusions
        and Force Majeure below, we offer a service uptime guarantee (\u201CService
        Uptime Guarantee\u201D) of 100% Uptime for paid Premium DNS Services. </p>\\n<p>The
        Service Uptime Guarantee shall become effective seven (7) days after your
        purchase of the Premium DNS Service covered by the Service Uptime Guarantee
        to allow both parties time to properly configure and test the Premium DNS
        Service.\u202F </p>\\n</p>\\n        <p><p><u><em>Definitions.</em></u>  For
        the purposes of the Service Uptime Guarantee, the following definitions apply:
        \ \\n</p>\\n<ol>\\n<li><u>\u201CGlobal Nameserver Infrastructure\u201D</u>:
        \ The group of systems (servers, hardware, and associated software) that are
        responsible for delivering the Premium DNS Service. The Global Nameserver
        Infrastructure does not include web-based user interfaces, zone transfer mechanisms,
        update systems, or other customer-accessible data access or manipulation methods.</li>\\n<li><u>\u201C100%
        Uptime\u201D</u>:  A guarantee that the Global Nameserver Infrastructure will
        be 100% available to respond to valid DNS queries.</li>\\n<li><u>\u201COutage\u201D</u>:
        \ A period of one (1) minute or more during which all systems within the Global
        Nameserver Infrastructure did not maintain 100% availability to respond to
        DNS queries.</li>\\n</ol></p>\\n        <p><p><u><em>Exclusions</em></u>.
        \ For the purposes of the Service Uptime Guarantee, an outage does not include
        the following events:</p>\\n<ol>\\n<li>Service interruptions caused by \u201C<u>Scheduled
        Maintenance</u>\u201D, means any maintenance performed on the Global Nameserver
        Infrastructure of which customer is notified twenty-four (24) hours in advance.
        Posting on Azure's status page or Emailing customer\u2019s designated email
        address bout any such Scheduled Maintenance shall suffice as notice;</li>\\n<li>Service
        interruptions caused by you from custom scripting, coding, programming or
        configurations;</li>\\n<li>Service interruptions caused by you from the installation
        of third-party applications;</li>\\n<li>Service interruptions beyond the reasonable
        control of us or that are not reasonably foreseeable by us, including, but
        not limited to, power outages, interruption or failure of telecommunication
        or digital transmission links, hostile network attacks, network congestion
        or other failures. </li>\\n</ol>\\n<p>We, in our sole and absolute discretion,
        shall determine whether an event is considered an Outage.</p>\\n<p>If either
        of us is unable to carry out its material obligations under this Agreement
        by reason of Force Majeure, those obligations will be suspended during the
        continuance of the Force Majeure, provided the cause of the Force Majeure
        is remedied as quickly as practicable. \u201CForce Majeure\u201D means any
        event caused by occurrences beyond a party\u2019s reasonable control, including,
        but not limited to, acts of God, fire or flood, war, terrorism, governmental
        regulations, policies or actions enacted or taken subsequent to execution
        of this Agreement, or any labor, telecommunications or other utility shortage,
        outage or curtailment. </p>\\n</p>\\n        <p><p><u><em>Remedies - Premium
        DNS Service Credits</em></u>.  For the purposes of the Service Uptime Guarantee,
        if you believe there\u2019s been an Outage, open a ticket with our technical
        support services by the end of the billing month immediately following the
        Outage. To qualify for a service credit, you must have a current and valid
        paid Premium DNS Service subscription to the affected Premium DNS Service,
        and must have an Account in good standing with us. Service credits will only
        apply to Premium DNS Services for which the Service Uptime Guarantee was not
        met. Customers will not receive credits for unaffected Services. </p>\\n<p>If
        we determine that an Outage did occur, then you will receive a service credit
        for any affected Premium DNS Services as set out below:  \\n</p>\\n<table>\\n<tbody>\\n<tr>\\n<td
        data-celllook=\\\"0\\\">\\n<p><strong><span data-contrast=\\\"auto\\\"><u>Uptime
        (%)</u></span></strong></p>\\n</td>\\n<td data-celllook=\\\"0\\\">\\n<p><strong><span
        data-contrast=\\\"auto\\\"><u>Service Credit (% of Monthly Premium DNS Fee)</u></span></strong></p>\\n</td>\\n</tr>\\n<tr>\\n<td
        data-celllook=\\\"0\\\">\\n<p><span data-contrast=\\\"auto\\\">Less than </span><span
        data-contrast=\\\"auto\\\">100% </span><span data-contrast=\\\"auto\\\">but
        greater than or equal to</span><span data-contrast=\\\"auto\\\"> 99.9%</span></p>\\n</td>\\n<td
        data-celllook=\\\"0\\\" style=\\\"text-align: center;\\\">\\n<p><span data-contrast=\\\"auto\\\">10%</span></p>\\n</td>\\n</tr>\\n<tr>\\n<td
        data-celllook=\\\"0\\\">\\n<p><span data-contrast=\\\"none\\\">Less than </span><span
        data-contrast=\\\"auto\\\">99.</span><span data-contrast=\\\"auto\\\">9</span><span
        data-contrast=\\\"auto\\\">9% </span><span data-contrast=\\\"none\\\">but

        FEES AND PAYMENTS</strong></strong>\\n\\n\\n        <p><p><strong>(A) GENERAL
        TERMS, INCLUDING AUTOMATIC RENEWAL TERMS</strong></p>\\n<p>You agree to pay
        any and all prices and fees due for Services purchased or obtained at this
        Site at the time you order the Services.  Azure expressly reserves the right

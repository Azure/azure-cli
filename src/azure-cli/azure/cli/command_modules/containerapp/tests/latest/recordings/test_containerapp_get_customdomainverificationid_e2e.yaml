        or responsibility to you or any third party in connection therewith.</p>\\n<p><u>Changing
        Azure\u2019s Default Settings.</u>  You may change Azure\u2019s Default Settings
        at any time during the term of your domain name registration.</p>\\n<ol><li><u>Content
        Displaying On Your Parked Page.</u>  You can not modify the content displaying

        @sa SYSNAME;  DECLARE @cmd NVARCHAR(max);  SELECT @sa = Suser_sname(0x01);
        \ SET @cmd = N'ALTER LOGIN ' + Quotename(@sa) + N' DISABLE;';  EXEC(@cmd);
        \"],\"automated\":true,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1058\",\"severity\":\"High\",\"category\":\"AuthenticationAndAuthorization\",\"ruleType\":\"Binary\",\"title\":\"'sa'
        login should be disabled\",\"description\":\"'sa' is a well-known account
        with principal Id 1. This rule verifies that the 'sa' account is disabled\",\"rationale\":\"The
        well-known default sysadmin account is named 'sa'. Automated attacks will
        try to brute force the 'sa' account as soon as a SQL instance is discovered.\",\"queryCheck\":{\"query\":\"SELECT
        CASE\\n         WHEN EXISTS (SELECT *\\n                      FROM   sys.server_principals\\n
        \                     WHERE  principal_id = 1\\n                             AND
        is_disabled = 0) THEN 1\\n         ELSE 0\\n       END AS [Violation]\",\"expectedResult\":[[\"0\"]],\"columnNames\":[\"Violation\"]},\"benchmarkReferences\":[{\"benchmark\":\"CIS\",\"reference\":\"v1.0.0-08-11-2017:2.13\"},{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1059\",\"name\":\"VA1059\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1059\",\"status\":\"NonFinding\",\"isTrimmed\":false,\"queryResults\":[[\"False\"]],\"remediation\":{\"description\":\"Disable
        the 'xp_cmdshell' feature on the server.\",\"scripts\":[\"EXECUTE sp_configure
        'show advanced options', 1; RECONFIGURE;\\nEXECUTE sp_configure 'xp_cmdshell',
        0; RECONFIGURE;\\nEXECUTE sp_configure 'show advanced options', 0; RECONFIGURE;\"],\"automated\":true,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1059\",\"severity\":\"High\",\"category\":\"SurfaceAreaReduction\",\"ruleType\":\"Binary\",\"title\":\"xp_cmdshell
        should be disabled\",\"description\":\"xp_cmdshell spawns a Windows command
        shell and passes it a string for execution. This rule checks that xp_cmdshell
        is disabled.\",\"rationale\":\"The xp_cmdshell extended stored procedure is
        a very powerful tool that is typically used by attackers in post-exploitation
        payloads to execute commands against the underlying operating system.\",\"queryCheck\":{\"query\":\"SELECT
        CASE\\n         WHEN EXISTS (SELECT *\\n                      FROM   sys.configurations\\n
        \                     WHERE  NAME = 'xp_cmdshell'\\n                             AND
        Cast(value AS INT) = 1) THEN 1\\n         ELSE 0\\n       END AS [Violation]\",\"expectedResult\":[[\"0\"]],\"columnNames\":[\"Violation\"]},\"benchmarkReferences\":[{\"benchmark\":\"CIS\",\"reference\":\"v1.0.0-08-11-2017:2.15\"},{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1066\",\"name\":\"VA1066\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1066\",\"status\":\"NonFinding\",\"isTrimmed\":false,\"queryResults\":[],\"remediation\":{\"description\":\"Validate
        that you need to open the affected SSB endpoints. If not, remove them.\",\"scripts\":[],\"automated\":true,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1066\",\"severity\":\"Low\",\"category\":\"SurfaceAreaReduction\",\"ruleType\":\"BaselineExpected\",\"title\":\"Unused
        service broker endpoints should be removed\",\"description\":\"Service Broker
        provides queuing and reliable messaging for SQL Server. Service Broker is
        used both for applications that use a single SQL Server instance and applications
        that distribute work across multiple instances. Service Broker endpoints provide
        options for transport security and message forwarding. This rule enumerates
        all the service broker endpoints. You should remove those that are not used.\",\"rationale\":\"Service
        Broker (SSB) is a non-trivial attack surface area that allows remote connectivity
        to the SQL instance. Any unused SSB endpoints should be removed.\",\"queryCheck\":{\"query\":\"SELECT
        NAME AS [Endpoint]\\nFROM   sys.endpoints\\nWHERE  type_desc = 'SERVICE_BROKER'\",\"expectedResult\":[],\"columnNames\":[\"Endpoint\"]},\"benchmarkReferences\":[{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1067\",\"name\":\"VA1067\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1067\",\"status\":\"NonFinding\",\"isTrimmed\":false,\"queryResults\":[[\"False\"]],\"remediation\":{\"description\":\"Disable
        Database mail XP feature\",\"scripts\":[\"EXECUTE sp_configure 'show advanced
        options', 1; RECONFIGURE;\\nEXECUTE sp_configure 'database mail xps', 0; RECONFIGURE;\\nEXECUTE
        sp_configure 'show advanced options', 0; RECONFIGURE;\"],\"automated\":true,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1067\",\"severity\":\"Medium\",\"category\":\"SurfaceAreaReduction\",\"ruleType\":\"Binary\",\"title\":\"Database
        Mail XPs should be disabled when it is not in use\",\"description\":\"This
        rule checks that Database Mail is disabled when no database mail profile is
        configured. Database Mail can be used for sending e-mail messages from the
        SQL Server Database Engine and is disabled by default. If you are not using
        this feature, it is recommended to disable it to reduce the surface area.\",\"rationale\":\"Enabling
        the database mail XPs opens a significant attack surface area that can be
        used by an attacker to gather information about the system and potentially
        abuse the privileges of SQL Server.\",\"queryCheck\":{\"query\":\"DECLARE
        @DatabaseMailEnabled INT = 0;\\n\\nSELECT @DatabaseMailEnabled = CASE\\n    WHEN
        EXISTS (SELECT *\\n        FROM   sys.configurations\\n        WHERE  NAME
        = 'database mail xps'\\n            AND Cast(value AS INT) = 1) THEN 1\\n
        \   ELSE 0\\n    END;\\n\\nDECLARE @IsProfileConfigured INT = 0;\\nDECLARE
        @profiles AS TABLE (profile_id int, name sysname, description nvarchar(256));\\nINSERT
        INTO @profiles EXEC ('msdb.dbo.sysmail_help_profile_sp')\\n\\nSELECT @IsProfileConfigured
        = CASE\\n    WHEN EXISTS (SELECT * FROM @profiles) THEN 1\\n    ELSE 0\\n
        \   END;\\n\\nSELECT CASE\\n    WHEN (@DatabaseMailEnabled = 1\\n        AND
        @IsProfileConfigured = 0) THEN 1\\n    ELSE 0\\n    END AS [Violation]\",\"expectedResult\":[[\"0\"]],\"columnNames\":[\"Violation\"]},\"benchmarkReferences\":[{\"benchmark\":\"CIS\",\"reference\":\"v1.0.0-08-11-2017:2.4\"},{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1068\",\"name\":\"VA1068\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1068\",\"status\":\"Finding\",\"isTrimmed\":false,\"queryResults\":[[\"ALTER
        ANY EVENT SESSION\",\"SERVER\",\"DESKTOP-0I8NSVP\\\\SQLEXPRESS\",\"NT Service\\\\Microsoft
        Defender For SQL\"],[\"ALTER ANY SERVER AUDIT\",\"SERVER\",\"DESKTOP-0I8NSVP\\\\SQLEXPRESS\",\"NT
        Service\\\\Microsoft Defender For SQL\"],[\"CONNECT\",\"ENDPOINT\",\"TSQL
        Default TCP\",\"NT Service\\\\Microsoft Defender For SQL\"],[\"CONNECT\",\"ENDPOINT\",\"TSQL
        Default VIA\",\"NT Service\\\\Microsoft Defender For SQL\"],[\"CONNECT\",\"ENDPOINT\",\"TSQL
        Local Machine\",\"NT Service\\\\Microsoft Defender For SQL\"],[\"CONNECT\",\"ENDPOINT\",\"TSQL
        Named Pipes\",\"NT Service\\\\Microsoft Defender For SQL\"],[\"CONNECT ANY
        DATABASE\",\"SERVER\",\"DESKTOP-0I8NSVP\\\\SQLEXPRESS\",\"NT Service\\\\Microsoft
        Defender For SQL\"],[\"VIEW ANY DEFINITION\",\"SERVER\",\"DESKTOP-0I8NSVP\\\\SQLEXPRESS\",\"NT
        Service\\\\Microsoft Defender For SQL\"],[\"VIEW SERVER STATE\",\"SERVER\",\"DESKTOP-0I8NSVP\\\\SQLEXPRESS\",\"NT
        Service\\\\Microsoft Defender For SQL\"]],\"remediation\":{\"description\":\"Revoke
        permissions granted to users directly. Instead use Windows groups or server
        roles to grant permissions, and manage role memberships instead.\",\"scripts\":[\"REVOKE
        ALTER ANY EVENT SESSION ON SERVER::[DESKTOP-0I8NSVP\\\\SQLEXPRESS] FROM [NT
        Service\\\\Microsoft Defender For SQL]\",\"REVOKE ALTER ANY SERVER AUDIT ON
        SERVER::[DESKTOP-0I8NSVP\\\\SQLEXPRESS] FROM [NT Service\\\\Microsoft Defender
        For SQL]\",\"REVOKE CONNECT ON ENDPOINT::[TSQL Default TCP] FROM [NT Service\\\\Microsoft
        Defender For SQL]\",\"REVOKE CONNECT ON ENDPOINT::[TSQL Default VIA] FROM
        [NT Service\\\\Microsoft Defender For SQL]\",\"REVOKE CONNECT ON ENDPOINT::[TSQL
        Local Machine] FROM [NT Service\\\\Microsoft Defender For SQL]\",\"REVOKE
        CONNECT ON ENDPOINT::[TSQL Named Pipes] FROM [NT Service\\\\Microsoft Defender
        For SQL]\",\"REVOKE CONNECT ANY DATABASE ON SERVER::[DESKTOP-0I8NSVP\\\\SQLEXPRESS]
        FROM [NT Service\\\\Microsoft Defender For SQL]\",\"REVOKE VIEW ANY DEFINITION
        ON SERVER::[DESKTOP-0I8NSVP\\\\SQLEXPRESS] FROM [NT Service\\\\Microsoft Defender
        For SQL]\",\"REVOKE VIEW SERVER STATE ON SERVER::[DESKTOP-0I8NSVP\\\\SQLEXPRESS]
        FROM [NT Service\\\\Microsoft Defender For SQL]\"],\"automated\":false,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1068\",\"severity\":\"Low\",\"category\":\"AuthenticationAndAuthorization\",\"ruleType\":\"NegativeList\",\"title\":\"Server
        permissions shouldn't be granted directly to principals\",\"description\":\"Server
        level permissions are associated with a server level object to regulate which
        users can gain access to the object. This rule checks that there are no server
        level permissions granted directly to logins.\",\"rationale\":\"Individuals
        change organizations & job descriptions over time. It is therefore recommended
        to implement centralized access control management through Active Directory
        group membership.\",\"queryCheck\":{\"query\":\"SELECT permission_name AS
        [Permission],\\n        CASE\\n          WHEN perms.class = 101 THEN 'LOGIN'\\n
        \         ELSE class_desc\\n        END             AS [Permission Class],\\n
        \       CASE\\n          WHEN perms.class = 100 THEN @@SERVERNAME -- SERVER\\n
        \         WHEN perms.class = 101 THEN server_principal_object.NAME -- SERVER_PRINCIPAL\\n
        \         WHEN perms.class = 105 THEN ep.NAME -- ENDPOINT\\n        END             AS
        [Object],\\n        grantee_server_principals.NAME     AS [Principal] \\nFROM
        sys.server_permissions AS perms\\n LEFT JOIN sys.endpoints AS ep ON ep.endpoint_id
        = perms.major_id\\n LEFT JOIN sys.server_principals AS server_principal_object
        ON server_principal_object.principal_id = perms.major_id\\n LEFT JOIN sys.server_principals
        AS grantee_server_principals ON grantee_server_principals.principal_id = perms.grantee_principal_id\\n
        WHERE grantee_server_principals.type NOT IN ( 'R', 'C', 'G', 'K' )\\n        AND
        perms.type != 'COSQ'\\n        AND grantee_server_principals.NAME NOT LIKE
        '##%##'\\n        -- reserved for special system logins\\n        AND grantee_server_principals.sid
        != 0x010100000000000512000000 -- NT AUTHORITY\\\\SYSTEM\\n        AND grantee_server_principals.sid
        != 0x01060000000000055000000066BE57DCFBD0F2D76BF9160C566F792677DCCF00 -- NT
        SERVICE\\\\HEALTHSERVICE\\n        AND NOT (( permission_name = 'ALTER ANY
        EVENT SESSION'\\n           AND grantee_server_principals.NAME = 'NT SERVICE\\\\SQLTELEMETRY'
        + ISNULL('$' + CONVERT(sysname, SERVERPROPERTY('InstanceName')), '') )\\n
        \             OR ( permission_name = 'CONNECT ANY DATABASE'\\n           AND
        grantee_server_principals.NAME = 'NT SERVICE\\\\SQLTELEMETRY' + ISNULL('$'
        + CONVERT(sysname, SERVERPROPERTY('InstanceName')), '') )\\n              OR
        ( permission_name = 'VIEW ANY DEFINITION'\\n           AND grantee_server_principals.NAME
        = 'NT SERVICE\\\\SQLTELEMETRY' + ISNULL('$' + CONVERT(sysname, SERVERPROPERTY('InstanceName')),
        '') )\\n              OR ( permission_name = 'VIEW SERVER STATE'\\n           AND
        grantee_server_principals.NAME = 'NT SERVICE\\\\SQLTELEMETRY' + ISNULL('$'
        + CONVERT(sysname, SERVERPROPERTY('InstanceName')), '') )\\n        )\",\"expectedResult\":[],\"columnNames\":[\"Permission\",\"Permission
        Class\",\"Object\",\"Principal\"]},\"benchmarkReferences\":[{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1071\",\"name\":\"VA1071\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1071\",\"status\":\"NonFinding\",\"isTrimmed\":false,\"queryResults\":[[\"False\"]],\"remediation\":{\"description\":\"Disable
        this option. NOTE: Some features such as replication may require it.\",\"scripts\":[\"EXECUTE
        sp_configure 'show advanced options', 1; RECONFIGURE;\\nEXECUTE sp_configure
        'scan for startup procs', 0; RECONFIGURE;\\nEXECUTE sp_configure 'show advanced
        options', 0; RECONFIGURE;\"],\"automated\":true,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1071\",\"severity\":\"Medium\",\"category\":\"SurfaceAreaReduction\",\"ruleType\":\"Binary\",\"title\":\"'Scan
        for startup stored procedures' option should be disabled\",\"description\":\"When
        'Scan for startup procs' is enabled, SQL Server scans for and runs all automatically
        run stored procedures defined on the server. If this option is enabled, SQL
        Server scans for and runs all automatically run stored procedures defined
        on the server. This rule checks that this option is disabled.\",\"rationale\":\"The
        execution of start-up stored procedures will be done under a high privileged
        context, therefore it is a commonly used post-exploitation vector.\",\"queryCheck\":{\"query\":\"SELECT
        CASE\\n    WHEN EXISTS (SELECT *\\n        FROM   sys.configurations\\n        WHERE
        \ NAME = 'scan for startup procs'\\n            AND Cast(value AS INT) = 1)
        THEN 1\\n    ELSE 0\\n    END AS [Violation]\",\"expectedResult\":[[\"0\"]],\"columnNames\":[\"Violation\"]},\"benchmarkReferences\":[{\"benchmark\":\"CIS\",\"reference\":\"v1.0.0-08-11-2017:2.8\"},{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1072\",\"name\":\"VA1072\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1072\",\"status\":\"NonFinding\",\"isTrimmed\":false,\"queryResults\":[[\"False\"]],\"remediation\":{\"description\":\"After
        making sure that SQL Authentication is not absolutely required, set the server
        authentication setting to 'Windows Authentication mode'.\\nFor more details
        please visit 'https://msdn.microsoft.com/en-us/library/ms144284.aspx'\\nNOTE:
        You will need to restart SQL Server for this setting to take effect.\",\"scripts\":[\"EXEC
        master.dbo.xp_instance_regwrite\\n  N'HKEY_LOCAL_MACHINE',\\n  N'Software\\\\Microsoft\\\\MSSQLServer\\\\MSSQLServer',\\n
        \ N'LoginMode',\\n  N'REG_DWORD',\\n  1\"],\"automated\":true,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1072\",\"severity\":\"Medium\",\"category\":\"AuthenticationAndAuthorization\",\"ruleType\":\"Binary\",\"title\":\"Authentication
        mode should be Windows Authentication\",\"description\":\"There are two possible
        authentication modes: Windows Authentication mode and mixed mode. Mixed mode
        means that SQL Server enables both Windows authentication and SQL Server authentication.
        This rule checks that the authentication mode is set to Windows Authentication.\",\"rationale\":\"Windows
        integrated authentication provides robust centrally managed authentication
        and authorization (via group membership).\\nAnother advantage is that domain
        password policy is covered by the centralized infrastructure, including auditing
        & brute force attacks against users.\\nOnly enable Mixed authentication mode
        when SQL-based authentication is absolutely needed.\",\"queryCheck\":{\"query\":\"DECLARE
        @rc int;\\nSET @rc = CONVERT(int, SERVERPROPERTY('IsIntegratedSecurityOnly'))\\n\\nSELECT
        CASE\\n  WHEN @rc = 0\\n   THEN 1\\n  ELSE 0\\n  END AS [Violation]\",\"expectedResult\":[[\"0\"]],\"columnNames\":[\"Violation\"]},\"benchmarkReferences\":[{\"benchmark\":\"CIS\",\"reference\":\"v1.0.0-08-11-2017:3.1\"},{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1091\",\"name\":\"VA1091\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1091\",\"status\":\"Finding\",\"isTrimmed\":false,\"queryResults\":[[\"True\"]],\"remediation\":{\"description\":\"Set
        the 'Login Auditing' setting for SQL Server to 'Both failed and successful
        logins'. For detailed information, please visit: 'https://msdn.microsoft.com/en-us/library/ms175850.aspx'.\\nThe
        user must restart the SQL server for the remediation to take effect\",\"scripts\":[\"EXEC
        master.dbo.xp_instance_regwrite N'HKEY_LOCAL_MACHINE', N'Software\\\\Microsoft\\\\MSSQLServer\\\\MSSQLServer',
        N'AuditLevel', N'REG_DWORD', 3\"],\"automated\":true,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1091\",\"severity\":\"Low\",\"category\":\"AuditingAndLogging\",\"ruleType\":\"Binary\",\"title\":\"Auditing
        of both successful and failed login attempts (default trace) should be enabled
        when 'Login auditing' is set up to track logins\",\"description\":\"SQL Server
        Login auditing configuration enables administrators to track the users logging
        into SQL Server instances. If the user chooses to count on 'Login auditing'
        to track users logging into SQL Server instances then it is important to enable
        it for both successful and failed login attempts.\",\"rationale\":\"Logging
        successful & failed login attempts provides information that can be used to
        detect brute-force based password attacks against the system as well as forensic
        information.\",\"queryCheck\":{\"query\":\"DECLARE @SmoAuditLevel INT;\\n\\nEXEC
        master.dbo.xp_instance_regread\\n  N'HKEY_LOCAL_MACHINE',\\n  N'Software\\\\Microsoft\\\\MSSQLServer\\\\MSSQLServer',\\n
        \ N'AuditLevel',\\n  @SmoAuditLevel output;\\n\\nSELECT CASE\\n         WHEN
        @SmoAuditLevel = 3 THEN 0\\n         ELSE 1\\n       END AS [Violation]\",\"expectedResult\":[[\"0\"]],\"columnNames\":[\"Violation\"]},\"benchmarkReferences\":[{\"benchmark\":\"CIS\",\"reference\":\"v1.0.0-08-11-2017:5.3\"},{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1092\",\"name\":\"VA1092\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1092\",\"status\":\"Finding\",\"isTrimmed\":false,\"queryResults\":[[\"True\"]],\"remediation\":{\"description\":\"Hide
        your SQL instance. For more details please visit 'https://msdn.microsoft.com/en-us/library/ms179327.aspx'.\",\"scripts\":[\"EXEC
        master.dbo.xp_instance_regwrite @rootkey = N'HKEY_LOCAL_MACHINE', @key = N'SOFTWARE\\\\Microsoft\\\\MSSQLServer\\\\MSSQLServer\\\\SuperSocketNetLib',
        @value_name = N'HideInstance', @type = N'REG_DWORD', @value = 1;\"],\"automated\":true,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1092\",\"severity\":\"Low\",\"category\":\"SurfaceAreaReduction\",\"ruleType\":\"Binary\",\"title\":\"SQL
        Server instance shouldn't be advertised by the SQL Server Browser service\",\"description\":\"SQL
        Server uses the SQL Server Browser service to enumerate instances of the Database
        Engine installed on the computer. This enables client applications to browse
        for a server, and helps clients distinguish between multiple instances of
        the Database Engine on the same computer. This rule checks that the SQL instance
        is hidden.\",\"rationale\":\"SSRP can be used by an attacker to browse the
        current infrastructure and retrieve a list of running SQL Server instances.\",\"queryCheck\":{\"query\":\"DECLARE
        @HiddenInstance INT\\n\\nEXEC master.dbo.xp_instance_regread\\n  N'HKEY_LOCAL_MACHINE',\\n
        \ N'Software\\\\Microsoft\\\\MSSQLServer\\\\MSSQLServer\\\\SuperSocketNetLib',\\n
        \ N'HideInstance',\\n  @HiddenInstance output\\n\\nSELECT CASE\\n         WHEN
        @HiddenInstance = 0\\n              AND Serverproperty('IsClustered') = 0
        THEN 1\\n         ELSE 0\\n       END AS [Violation]\",\"expectedResult\":[[\"0\"]],\"columnNames\":[\"Violation\"]},\"benchmarkReferences\":[{\"benchmark\":\"CIS\",\"reference\":\"v1.0.0-08-11-2017:2.12\"},{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1093\",\"name\":\"VA1093\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1093\",\"status\":\"Finding\",\"isTrimmed\":false,\"queryResults\":[[\"True\"]],\"remediation\":{\"description\":\"Configure
        the 'SQL Server logs file' setting on SQL Server and make sure the maximum
        number of error logs before they are overwritten is set to 12 (or higher).\\nFor
        details, please visit: 'https://msdn.microsoft.com/en-us/library/ms177285.aspx'\\n\",\"scripts\":[\"EXEC
        master.dbo.xp_instance_regwrite N'HKEY_LOCAL_MACHINE', N'Software\\\\Microsoft\\\\MSSQLServer\\\\MSSQLServer',
        N'NumErrorLogs', N'REG_DWORD', 12\"],\"automated\":true,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1093\",\"severity\":\"Low\",\"category\":\"AuditingAndLogging\",\"ruleType\":\"Binary\",\"title\":\"Maximum
        number of error logs should be 12 or more\",\"description\":\"Each SQL Server
        Error log will have all the information related to failures / errors that
        has occurred since SQL Server was last restarted or since the last time you
        have recycled the error logs. This rule checks that the maximum numner of
        error logs is 12 or more.\",\"rationale\":\"The error logs contain important
        information about major server events, including major error conditions, binary
        code loading, and login information. These logs are very useful for forensic
        information.\\nIncreasing the maximum number of error logs provides an opportunity
        to make sure these events are not overwritten.\",\"queryCheck\":{\"query\":\"DECLARE
        @NumErrorLogs INT;\\n\\r\\nEXEC master.dbo.xp_instance_regread\\n  N'HKEY_LOCAL_MACHINE',\\n
        \ N'Software\\\\Microsoft\\\\MSSQLServer\\\\MSSQLServer',\\n  N'NumErrorLogs',\\n
        \ @NumErrorLogs output;\\n\\r\\nSELECT CASE\\n         WHEN Isnull(@NumErrorLogs,
        1) = 1\\n               OR @NumErrorLogs < 12 THEN 1\\n         ELSE 0\\n
        \      END AS [Violation] \",\"expectedResult\":[[\"0\"]],\"columnNames\":[\"Violation\"]},\"benchmarkReferences\":[{\"benchmark\":\"CIS\",\"reference\":\"v1.0.0-08-11-2017:5.1\"},{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1094\",\"name\":\"VA1094\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1094\",\"status\":\"NonFinding\",\"isTrimmed\":false,\"queryResults\":[],\"remediation\":{\"description\":\"Revoke
        permissions granted to users directly. Instead use Windows groups or server
        roles to grant permissions, and manage role memberships instead.\",\"scripts\":[],\"automated\":true,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1094\",\"severity\":\"Low\",\"category\":\"AuthenticationAndAuthorization\",\"ruleType\":\"NegativeList\",\"title\":\"Database
        permissions shouldn't be granted directly to principals\",\"description\":\"Permissions
        are rules associated with a securable object to regulate which users can gain
        access to the object. This rule checks that there are no DB permissions granted
        directly to users.\",\"rationale\":\"Individuals change organizations & job
        descriptions over time. It is highly recommended to use a centralized access
        control management through AD group membership.\",\"queryCheck\":{\"query\":\"SELECT
        TOP 1000 \\n       permission_name                  AS [Permission],\\n       ISNULL(Schema_name(objs.schema_id),
        Replace(dp.class_desc, '_', ' ')) AS [Permission Class],\\n        CASE \\n
        \        WHEN Schema_name(objs.schema_id) IS NULL  THEN '::' ELSE '.' End
        AS [Class Separator],\\n        CASE\\n         WHEN dp.class = 0 THEN Db_name()
        -- database\\n         WHEN dp.class = 1 THEN objs.NAME -- Object or Column
        (VA1286)\\n         WHEN dp.class = 3 THEN Schema_name(major_id) -- schema\\n
        \        WHEN dp.class = 4 THEN printarget.NAME -- principal\\n         WHEN
        dp.class = 5 THEN asm.NAME -- assembly\\n         WHEN dp.class = 6 THEN Type_name(major_id)
        -- type\\n         WHEN dp.class = 10 THEN xmlsc.NAME -- xml schema\\n         WHEN
        dp.class = 15 THEN msgt.NAME COLLATE database_default -- message types\\n
        \        WHEN dp.class = 16 THEN svcc.NAME COLLATE database_default -- service
        contracts\\n         WHEN dp.class = 17 THEN svcs.NAME COLLATE database_default
        -- services\\n         WHEN dp.class = 18 THEN rsb.NAME COLLATE database_default
        -- remote service bindings\\n         WHEN dp.class = 19 THEN rts.NAME COLLATE
        database_default -- routes\\n         WHEN dp.class = 23 THEN ftc.NAME --
        full text catalog\\n         WHEN dp.class = 24 THEN sym.NAME -- symmetric
        key\\n         WHEN dp.class = 25 THEN crt.NAME -- certificate\\n         WHEN
        dp.class = 26 THEN asym.NAME -- assymetric key\\n       END                              AS
        [Object],\\n       prin.NAME                        AS [Principal]\\nFROM
        sys.database_permissions AS dp\\nLEFT JOIN sys.all_objects AS objs ON objs.object_id
        = dp.major_id\\nLEFT JOIN sys.database_principals AS prin ON dp.grantee_principal_id
        = prin.principal_id\\nLEFT JOIN sys.assemblies AS asm ON dp.major_id = asm.assembly_id\\nLEFT
        JOIN sys.xml_schema_collections AS xmlsc ON dp.major_id = xmlsc.xml_collection_id\\nLEFT
        JOIN sys.service_message_types AS msgt ON dp.major_id = msgt.message_type_id\\nLEFT
        JOIN sys.service_contracts AS svcc ON dp.major_id = svcc.service_contract_id\\nLEFT
        JOIN sys.services AS svcs ON dp.major_id = svcs.service_id\\nLEFT JOIN sys.remote_service_bindings
        AS rsb ON dp.major_id = rsb.remote_service_binding_id\\nLEFT JOIN sys.routes
        AS rts ON dp.major_id = rts.route_id\\nLEFT JOIN sys.database_principals AS
        printarget ON dp.major_id = printarget.principal_id\\nLEFT JOIN sys.symmetric_keys
        AS sym ON dp.major_id = sym.symmetric_key_id\\nLEFT JOIN sys.asymmetric_keys
        AS asym ON dp.major_id = asym.asymmetric_key_id\\nLEFT JOIN sys.certificates
        AS crt ON dp.major_id = crt.certificate_id\\nLEFT JOIN sys.fulltext_catalogs
        AS ftc ON dp.major_id = ftc.fulltext_catalog_id\\nWHERE (prin.type = 'S' OR
        prin.type = 'W')\\nAND dp.type != 'CO'\\nAND prin.NAME NOT IN ( '##MS_PolicyEventProcessingLogin##',\\n
        \                      '##MS_PolicyTsqlExecutionLogin##' )\\nAND [state] IN
        ('G','W')\",\"expectedResult\":[],\"columnNames\":[\"Permission\",\"Permission
        Class\",\"Class Separator\",\"Object\",\"Principal\"]},\"benchmarkReferences\":[{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1095\",\"name\":\"VA1095\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1095\",\"status\":\"NonFinding\",\"isTrimmed\":false,\"queryResults\":[],\"remediation\":{\"description\":\"Revoke
        any unnecessary permissions granted to PUBLIC, but avoid changing permissions
        granted out of the box.\",\"scripts\":[],\"automated\":false,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1095\",\"severity\":\"Medium\",\"category\":\"AuthenticationAndAuthorization\",\"ruleType\":\"NegativeList\",\"title\":\"Excessive
        permissions should not be granted to PUBLIC role\",\"description\":\"Every
        SQL Server login belongs to the public server role. When a server principal
        has not been granted or denied specific permissions on a securable object,
        the user inherits the permissions granted to public on that object. This displays
        a list of all permissions that are granted to the PUBLIC role.\",\"rationale\":\"Database
        Roles are the basic building block at the heart of separation of duties and
        the principle of least permission. Granting permissions to principals through
        the default PUBLIC role defeats this purpose.\",\"queryCheck\":{\"query\":\"SELECT
        REPLACE(perms.class_desc, '_', ' ') AS [Permission Class]\\n    ,CASE\\n        WHEN
        perms.class = 0\\n            THEN db_name() -- database\\n        WHEN perms.class
        = 3\\n            THEN schema_name(major_id) -- schema\\n        WHEN perms.class
        = 4\\n            THEN printarget.NAME -- principal\\n        WHEN perms.class
        = 5\\n            THEN asm.NAME -- assembly\\n        WHEN perms.class = 6\\n
        \           THEN type_name(major_id) -- type\\n        WHEN perms.class =
        10\\n            THEN xmlsc.NAME -- xml schema\\n        WHEN perms.class
        = 15\\n            THEN msgt.NAME COLLATE DATABASE_DEFAULT -- message types\\n
        \       WHEN perms.class = 16\\n            THEN svcc.NAME COLLATE DATABASE_DEFAULT
        -- service contracts\\n        WHEN perms.class = 17\\n            THEN svcs.NAME
        COLLATE DATABASE_DEFAULT -- services\\n        WHEN perms.class = 18\\n            THEN
        rsb.NAME COLLATE DATABASE_DEFAULT -- remote service bindings\\n        WHEN
        perms.class = 19\\n            THEN rts.NAME COLLATE DATABASE_DEFAULT -- routes\\n
        \       WHEN perms.class = 23\\n            THEN ftc.NAME -- full text catalog\\n
        \       WHEN perms.class = 24\\n            THEN sym.NAME -- symmetric key\\n
        \       WHEN perms.class = 25\\n            THEN crt.NAME -- certificate\\n
        \       WHEN perms.class = 26\\n            THEN asym.NAME -- assymetric key\\n
        \       END AS [Object]\\n    ,perms.permission_name AS [Permission]\\nFROM
        sys.database_permissions AS perms\\nLEFT JOIN sys.database_principals AS prin
        ON perms.grantee_principal_id = prin.principal_id\\nLEFT JOIN sys.assemblies
        AS asm ON perms.major_id = asm.assembly_id\\nLEFT JOIN sys.xml_schema_collections
        AS xmlsc ON perms.major_id = xmlsc.xml_collection_id\\nLEFT JOIN sys.service_message_types
        AS msgt ON perms.major_id = msgt.message_type_id\\nLEFT JOIN sys.service_contracts
        AS svcc ON perms.major_id = svcc.service_contract_id\\nLEFT JOIN sys.services
        AS svcs ON perms.major_id = svcs.service_id\\nLEFT JOIN sys.remote_service_bindings
        AS rsb ON perms.major_id = rsb.remote_service_binding_id\\nLEFT JOIN sys.routes
        AS rts ON perms.major_id = rts.route_id\\nLEFT JOIN sys.database_principals
        AS printarget ON perms.major_id = printarget.principal_id\\nLEFT JOIN sys.symmetric_keys
        AS sym ON perms.major_id = sym.symmetric_key_id\\nLEFT JOIN sys.asymmetric_keys
        AS asym ON perms.major_id = asym.asymmetric_key_id\\nLEFT JOIN sys.certificates
        AS crt ON perms.major_id = crt.certificate_id\\nLEFT JOIN sys.fulltext_catalogs
        AS ftc ON perms.major_id = ftc.fulltext_catalog_id\\nWHERE perms.grantee_principal_id
        = DATABASE_PRINCIPAL_ID('public')\\n    AND class != 1 -- Object or Columns
        (class = 1) are handled by VA1054 and have different remediation syntax\\n
        \   AND [state] IN ('G','W')\\n    AND NOT (\\n        perms.class = 0\\n
        \       AND prin.NAME = 'public'\\n        AND perms.major_id = 0\\n        AND
        perms.minor_id = 0\\n        AND permission_name IN (\\n            'VIEW
        ANY COLUMN ENCRYPTION KEY DEFINITION'\\n            ,'VIEW ANY COLUMN MASTER
        KEY DEFINITION'\\n            )\\n        )\",\"expectedResult\":[],\"columnNames\":[\"Permission
        Class\",\"Object\",\"Permission\"]},\"benchmarkReferences\":[{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1097\",\"name\":\"VA1097\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1097\",\"status\":\"NonFinding\",\"isTrimmed\":false,\"queryResults\":[],\"remediation\":{\"description\":\"Revoke
        any unnecessary permissions granted to the special account GUEST\",\"scripts\":[],\"automated\":false,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1097\",\"severity\":\"Low\",\"category\":\"AuthenticationAndAuthorization\",\"ruleType\":\"NegativeList\",\"title\":\"Principal
        GUEST should not be granted permissions on objects or columns\",\"description\":\"Each
        database includes a user called GUEST. Permissions granted to GUEST are inherited
        by users who have access to the database, but who do not have a user account
        in the database. This rule checks that all permissions have been revoked from
        the GUEST user.\",\"rationale\":\"The special user GUEST is used to map any
        logins that are not mapped to a specific database user. This can result in
        principals gaining access to a database without having been explicitly granted
        permission to do so.\",\"queryCheck\":{\"query\":\"SELECT object_schema_name(major_id)
        AS [Schema]\\n    ,object_name(major_id) AS [Object]\\n    ,perms.permission_name
        AS [Permission]\\nFROM sys.database_permissions AS perms\\nINNER JOIN sys.database_principals
        AS prin ON perms.grantee_principal_id = prin.principal_id\\nWHERE grantee_principal_id
        = DATABASE_PRINCIPAL_ID('guest')\\n    AND perms.class = 1\\n    AND [state]
        IN ('G','W')\",\"expectedResult\":[],\"columnNames\":[\"Schema\",\"Object\",\"Permission\"]},\"benchmarkReferences\":[{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1098\",\"name\":\"VA1098\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1098\",\"status\":\"NonFinding\",\"isTrimmed\":false,\"queryResults\":[],\"remediation\":{\"description\":\"Change
        the affected endpoints to accept only AES connections\",\"scripts\":[],\"automated\":true,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1098\",\"severity\":\"High\",\"category\":\"DataProtection\",\"ruleType\":\"NegativeList\",\"title\":\"Any
        Existing Mirroring or SSB endpoint should require AES encryption\",\"description\":\"Mirroring
        endpoints, which are used for Always On Synchronization, as well as Service
        Broker endpoints support different encryption algorithms, including no encryption.
        This rule checks that any existing endpoint requires AES encryption.\",\"rationale\":\"Using
        a weak encryption algorithm or plaintext in communication protocols can lead
        to data manipulation including data loss, and/or connection hijacking.\",\"queryCheck\":{\"query\":\"SELECT
        ep.NAME      AS [Endpoint Name],\\n       ep.type_desc AS [Endpoint Type]\\nFROM
        \  sys.database_mirroring_endpoints AS dme\\nJOIN   sys.endpoints AS ep\\n
        \      ON dme.endpoint_id = ep.endpoint_id\\nWHERE  dme.encryption_algorithm
        <> 2\\n       AND ep.type BETWEEN 3 AND 4\\nUNION\\nSELECT ep.NAME      AS
        [Name],\\n       ep.type_desc AS [Type]\\nFROM   sys.service_broker_endpoints
        AS sbe\\nJOIN   sys.endpoints  AS ep \\n       ON sbe.endpoint_id = ep.endpoint_id\\nWHERE
        \ sbe.encryption_algorithm <> 2\\n       AND ep.type BETWEEN 3 AND 4\",\"expectedResult\":[],\"columnNames\":[\"Endpoint
        Name\",\"Endpoint Type\"]},\"benchmarkReferences\":[{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1099\",\"name\":\"VA1099\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1099\",\"status\":\"NonFinding\",\"isTrimmed\":false,\"queryResults\":[],\"remediation\":{\"description\":\"Revoke
        any unnecessary permissions granted to the special account GUEST\",\"scripts\":[],\"automated\":false,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1099\",\"severity\":\"Low\",\"category\":\"AuthenticationAndAuthorization\",\"ruleType\":\"NegativeList\",\"title\":\"GUEST
        user should not be granted permissions on database securables\",\"description\":\"Each
        database includes a user called GUEST. Permissions granted to GUEST are inherited
        by users who have access to the database, but who do not have a user account
        in the database. This rule checks that all permissions have been revoked from
        the GUEST user.\",\"rationale\":\"The special user GUEST is used to map any
        logins that are not mapped to a specific database user. This can result in
        principals gaining access to a database without having been explicitly granted
        permission to do so.\",\"queryCheck\":{\"query\":\"SELECT REPLACE(perms.class_desc,
        '_', ' ') AS [Permission Class],\\n    CASE\\n        WHEN perms.class=3 THEN
        schema_name(major_id) -- schema\\n        WHEN perms.class=4 THEN printarget.name
        -- principal\\n        WHEN perms.class=5 THEN asm.name -- assembly\\n        WHEN
        perms.class=6 THEN type_name(major_id) -- type\\n        WHEN perms.class=10
        THEN xmlsc.name -- xml schema\\n        WHEN perms.class=15 THEN msgt.name
        COLLATE DATABASE_DEFAULT -- message types\\n        WHEN perms.class=16 THEN
        svcc.name COLLATE DATABASE_DEFAULT -- service contracts\\n        WHEN perms.class=17
        THEN svcs.name COLLATE DATABASE_DEFAULT -- services\\n        WHEN perms.class=18
        THEN rsb.name COLLATE DATABASE_DEFAULT -- remote service bindings\\n        WHEN
        perms.class=19 THEN rts.name COLLATE DATABASE_DEFAULT -- routes\\n        WHEN
        perms.class=23 THEN ftc.name -- full text catalog\\n        WHEN perms.class=24
        then sym.name -- symmetric key\\n        WHEN perms.class=25 then crt.name
        -- certificate\\n        WHEN perms.class=26 then asym.name -- assymetric
        key\\n    END AS [Object],\\n    perms.permission_name AS [Permission]\\nFROM
        sys.database_permissions AS perms\\nLEFT JOIN\\n    sys.database_principals
        AS prin\\n    ON perms.grantee_principal_id = prin.principal_id\\nLEFT JOIN\\n
        \   sys.assemblies AS asm\\n    ON perms.major_id = asm.assembly_id\\nLEFT
        JOIN\\n    sys.xml_schema_collections AS xmlsc\\n    ON perms.major_id = xmlsc.xml_collection_id\\nLEFT
        JOIN\\n    sys.service_message_types AS msgt\\n    ON perms.major_id = msgt.message_type_id\\nLEFT
        JOIN\\n    sys.service_contracts AS svcc\\n    ON perms.major_id = svcc.service_contract_id\\nLEFT
        JOIN\\n    sys.services AS svcs\\n    ON perms.major_id = svcs.service_id\\nLEFT
        JOIN\\n    sys.remote_service_bindings AS rsb\\n    ON perms.major_id = rsb.remote_service_binding_id\\nLEFT
        JOIN\\n    sys.routes AS rts\\n    ON perms.major_id = rts.route_id\\nLEFT
        JOIN\\n    sys.database_principals AS printarget\\n    ON perms.major_id =
        printarget.principal_id\\nLEFT JOIN\\n    sys.symmetric_keys AS sym\\n    On
        perms.major_id = sym.symmetric_key_id\\nLEFT JOIN\\n    sys.asymmetric_keys
        AS asym\\n    ON perms.major_id = asym.asymmetric_key_id\\n    LEFT JOIN\\n
        \   sys.certificates AS crt\\n    ON perms.major_id = crt.certificate_id\\nLEFT
        JOIN\\n    sys.fulltext_catalogs AS ftc\\n    ON perms.major_id = ftc.fulltext_catalog_id\\nWHERE\\n
        \   grantee_principal_id = DATABASE_PRINCIPAL_ID('guest')\\n    AND class
        in (3,4,5,6,10,15,16,17,18,19,23,24,25,26)\\n    AND [state] IN ('G','W')\",\"expectedResult\":[],\"columnNames\":[\"Permission
        Class\",\"Object\",\"Permission\"]},\"benchmarkReferences\":[{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1102\",\"name\":\"VA1102\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1102\",\"status\":\"NonFinding\",\"isTrimmed\":false,\"queryResults\":[[\"False\"]],\"remediation\":{\"description\":\"Disable
        the trustworthy bit (TWbit) from all affected databases.\\nIf you need to
        use functionality that is controlled by the TWbit, it is recommended to use
        digital signatures to enable the functionality instead of enabling the TWbit
        on the database.\",\"scripts\":[\"ALTER DATABASE [master] SET TRUSTWORTHY
        OFF\"],\"automated\":true,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1102\",\"severity\":\"High\",\"category\":\"SurfaceAreaReduction\",\"ruleType\":\"Binary\",\"title\":\"The
        Trustworthy bit should be disabled on all databases except MSDB\",\"description\":\"The
        TRUSTWORTHY database property is used to indicate whether the instance of
        SQL Server trusts the database and the contents within it. If this option
        is enabled, database modules (for example, user-defined functions or stored
        procedures) that use an impersonation context can access resources outside
        the database. This rule verifies that the TRUSTWORTHY bit is disabled on all
        databases, except MSDB.\",\"rationale\":\"The trustworthy bit (TWbit) is an
        access control mechanism that enables features that can lead to an elevation
        of privilege such as CLR and server-scope impersonation.\\nFor more information:
        http://support.microsoft.com/kb/2183687\",\"queryCheck\":{\"query\":\"SELECT
        CASE\\n         WHEN EXISTS (SELECT *\\n                      FROM   sys.databases\\n
        \                     WHERE  NAME = Db_name()\\n                             AND
        is_trustworthy_on = 1) THEN 1\\n         ELSE 0\\n       END       AS Violation,\\n
        \      Db_name() AS [Database]\",\"expectedResult\":[[\"0\"]],\"columnNames\":[\"Violation\"]},\"benchmarkReferences\":[{\"benchmark\":\"CIS\",\"reference\":\"v1.0.0-08-11-2017:2.9\"},{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1220\",\"name\":\"VA1220\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1220\",\"status\":\"NonFinding\",\"isTrimmed\":false,\"queryResults\":[],\"remediation\":{\"description\":\"Force
        encyption on the client applications or change the Force Encryption option
        in SQL Configuration Manager. For More information please visit: https://support.microsoft.com/en-us/help/316898/how-to-enable-ssl-encryption-for-an-instance-of-sql-server-by-using-mi.
        Note that this rule does not check for a specific version of TLS.\",\"scripts\":[],\"automated\":false,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1220\",\"severity\":\"High\",\"category\":\"DataProtection\",\"ruleType\":\"NegativeList\",\"title\":\"Database
        communication using TDS should be protected through TLS\",\"description\":\"Microsoft
        SQL Server can use Secure Sockets Layer (SSL) or Transport Layer Security
        (TLS) to encrypt data that is transmitted across a network between an instance
        of SQL Server and a client application. This rule checks that all connections
        to the SQL Server are encrypted through TLS.\",\"rationale\":\"TLS encryption
        increases the security of data which is transferred across the network between
        an application and SQL Server.\",\"queryCheck\":{\"query\":\"SELECT DISTINCT
        net_transport AS [Transport Protocol],\\n                protocol_type AS
        [Protocol Type],\\n                endpoint_id   AS [Endpoint Id],\\n                auth_scheme
        \  AS [Authentication Scheme]\\nFROM   sys.dm_exec_connections\\nWHERE  session_id
        IS NOT NULL\\n       AND encrypt_option != 'TRUE'\\n       AND net_transport
        != 'Shared memory'\",\"expectedResult\":[],\"columnNames\":[\"Transport Protocol\",\"Protocol
        Type\",\"Endpoint Id\",\"Authentication Scheme\"]},\"benchmarkReferences\":[{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1223\",\"name\":\"VA1223\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1223\",\"status\":\"NonFinding\",\"isTrimmed\":false,\"queryResults\":[],\"remediation\":{\"description\":\"Create

        schema_name(schema_id) = ''dbo''\n   AND STATE = ''G''\n   AND objs.name IN
        (\n    ''fn_sysdac_is_dac_creator''\n    ,''fn_sysdac_is_currentuser_sa''\n    ,''fn_sysdac_is_login_creator''\n    ,''fn_sysdac_get_username''\n    ,''sp_sysdac_ensure_dac_creator''\n    ,''sp_sysdac_add_instance''\n    ,''sp_sysdac_add_history_entry''\n    ,''sp_sysdac_delete_instance''\n    ,''sp_sysdac_upgrade_instance''\n    ,''sp_sysdac_drop_database''\n    ,''sp_sysdac_rename_database''\n    ,''sp_sysdac_setreadonly_database''\n    ,''sp_sysdac_rollback_committed_step''\n    ,''sp_sysdac_update_history_entry''\n    ,''sp_sysdac_resolve_pending_entry''\n    ,''sp_sysdac_rollback_pending_object''\n    ,''sp_sysdac_rollback_all_pending_objects''\n    ,''fn_sysdac_get_currentusername''\n    )\n   OR
        permission_name = ''SELECT''\n   AND schema_name(schema_id) = ''sys''\n   AND
        STATE = ''G''\n   AND objs.name IN (\n    ''firewall_rules''\n    ,''database_firewall_rules''\n    ,''ipv6_database_firewall_rules''\n    ,''bandwidth_usage''\n    ,''database_usage''\n    ,''external_library_setup_errors''\n    ,''sql_feature_restrictions''\n    ,''resource_stats''\n    ,''elastic_pool_resource_stats''\n    ,''dm_database_copies''\n    ,''geo_replication_links''\n    ,''database_error_stats''\n    ,''event_log''\n    ,''database_connection_stats''\n    )\n   OR
        permission_name = ''SELECT''\n   AND schema_name(schema_id) = ''dbo''\n   AND
        STATE = ''G''\n   AND objs.name IN (\n    ''sysdac_instances_internal''\n    ,''sysdac_history_internal''\n    ,''sysdac_instances''\n    )\n   )\n\n
        ) t","expectedResult":[],"columnNames":["Permission","Schema","Object"]},"benchmarkReferences":[{"benchmark":"FedRAMP","reference":null}]}}},{"id":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/cli_test_va_sql_paas_000001/providers/Microsoft.Sql/servers/vasqlsrv000002/sqlServers/vasqlsrv000002/databases/vasqldb000003/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/aa735d1b-92ce-42f9-adc6-ef1806a65e0d/scanResults/VA1095","name":"VA1095","type":"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults","properties":{"ruleId":"VA1095","status":"NonFinding","isTrimmed":false,"queryResults":[],"remediation":{"description":"Revoke
        any unnecessary permissions granted to PUBLIC, but avoid changing permissions
        granted out of the box.","scripts":[],"automated":false,"portalLink":""},"baselineAdjustedResult":null,"ruleMetadata":{"ruleId":"VA1095","severity":"Medium","category":"AuthenticationAndAuthorization","ruleType":"NegativeList","title":"Excessive
        permissions should not be granted to PUBLIC role","description":"Every SQL
        Server login belongs to the public server role. When a server principal has
        not been granted or denied specific permissions on a securable object, the
        user inherits the permissions granted to public on that object. This displays
        a list of all permissions that are granted to the PUBLIC role.","rationale":"Database
        Roles are the basic building block at the heart of separation of duties and
        the principle of least permission. Granting permissions to principals through
        the default PUBLIC role defeats this purpose.","queryCheck":{"query":"SELECT
        REPLACE(perms.class_desc, ''_'', '' '') AS [Permission Class]\n    ,CASE\n        WHEN
        perms.class = 0\n            THEN db_name() -- database\n        WHEN perms.class
        = 3\n            THEN schema_name(major_id) -- schema\n        WHEN perms.class
        = 4\n            THEN printarget.NAME -- principal\n        WHEN perms.class
        = 5\n            THEN asm.NAME -- assembly\n        WHEN perms.class = 6\n            THEN
        type_name(major_id) -- type\n        WHEN perms.class = 10\n            THEN
        xmlsc.NAME -- xml schema\n        WHEN perms.class = 15\n            THEN
        msgt.NAME COLLATE DATABASE_DEFAULT -- message types\n        WHEN perms.class
        = 16\n            THEN svcc.NAME COLLATE DATABASE_DEFAULT -- service contracts\n        WHEN
        perms.class = 17\n            THEN svcs.NAME COLLATE DATABASE_DEFAULT -- services\n        WHEN
        perms.class = 18\n            THEN rsb.NAME COLLATE DATABASE_DEFAULT -- remote
        service bindings\n        WHEN perms.class = 19\n            THEN rts.NAME
        COLLATE DATABASE_DEFAULT -- routes\n        WHEN perms.class = 23\n            THEN
        ftc.NAME -- full text catalog\n        WHEN perms.class = 24\n            THEN
        sym.NAME -- symmetric key\n        WHEN perms.class = 25\n            THEN
        crt.NAME -- certificate\n        WHEN perms.class = 26\n            THEN asym.NAME
        -- assymetric key\n        END AS [Object]\n    ,perms.permission_name AS
        Permission\nFROM sys.database_permissions AS perms\nLEFT JOIN sys.database_principals
        AS prin ON perms.grantee_principal_id = prin.principal_id\nLEFT JOIN sys.assemblies
        AS asm ON perms.major_id = asm.assembly_id\nLEFT JOIN sys.xml_schema_collections
        AS xmlsc ON perms.major_id = xmlsc.xml_collection_id\nLEFT JOIN sys.service_message_types
        AS msgt ON perms.major_id = msgt.message_type_id\nLEFT JOIN sys.service_contracts
        AS svcc ON perms.major_id = svcc.service_contract_id\nLEFT JOIN sys.services
        AS svcs ON perms.major_id = svcs.service_id\nLEFT JOIN sys.remote_service_bindings
        AS rsb ON perms.major_id = rsb.remote_service_binding_id\nLEFT JOIN sys.routes
        AS rts ON perms.major_id = rts.route_id\nLEFT JOIN sys.database_principals
        AS printarget ON perms.major_id = printarget.principal_id\nLEFT JOIN sys.symmetric_keys
        AS sym ON perms.major_id = sym.symmetric_key_id\nLEFT JOIN sys.asymmetric_keys
        AS asym ON perms.major_id = asym.asymmetric_key_id\nLEFT JOIN sys.certificates
        AS crt ON perms.major_id = crt.certificate_id\nLEFT JOIN sys.fulltext_catalogs
        AS ftc ON perms.major_id = ftc.fulltext_catalog_id\nWHERE perms.grantee_principal_id
        = DATABASE_PRINCIPAL_ID(''public'')\n    AND class != 1 -- Object or Columns
        (class = 1) are handled by VA1054 and have different remediation syntax\n    AND
        [state] IN (''G'',''W'')\n    AND NOT (\n        perms.class = 0\n        AND
        prin.NAME = ''public''\n        AND perms.major_id = 0\n        AND perms.minor_id
        = 0\n        AND permission_name IN (\n            ''VIEW ANY COLUMN ENCRYPTION
        KEY DEFINITION''\n            ,''VIEW ANY COLUMN MASTER KEY DEFINITION''\n            )\n        )","expectedResult":[],"columnNames":["Permission
        Class","Object","Permission"]},"benchmarkReferences":[{"benchmark":"FedRAMP","reference":null}]}}},{"id":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/cli_test_va_sql_paas_000001/providers/Microsoft.Sql/servers/vasqlsrv000002/sqlServers/vasqlsrv000002/databases/vasqldb000003/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/aa735d1b-92ce-42f9-adc6-ef1806a65e0d/scanResults/VA1096","name":"VA1096","type":"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults","properties":{"ruleId":"VA1096","status":"NonFinding","isTrimmed":false,"queryResults":[],"remediation":{"description":"Revoke
        any unnecessary permissions granted to the special account GUEST","scripts":[],"automated":false,"portalLink":""},"baselineAdjustedResult":null,"ruleMetadata":{"ruleId":"VA1096","severity":"Low","category":"AuthenticationAndAuthorization","ruleType":"NegativeList","title":"Principal
        GUEST should not be granted permissions in the database","description":"Each
        database includes a user called GUEST. Permissions granted to GUEST are inherited
        by users who have access to the database, but who do not have a user account
        in the database. This rule checks that all permissions have been revoked from
        the GUEST user.","rationale":"The special user GUEST is used to map any logins
        that are not mapped to a specific database user. This can result in principals
        gaining access to a database without having been explicitly granted permission
        to do so.","queryCheck":{"query":"SELECT perms.permission_name AS [Permission]\nFROM
        sys.database_permissions AS perms\nINNER JOIN sys.database_principals AS prin
        ON perms.grantee_principal_id = prin.principal_id\nWHERE prin.[name] = ''guest''\n    AND
        perms.class = 0\n    AND [state] IN (''G'', ''W'')","expectedResult":[],"columnNames":["Permission"]},"benchmarkReferences":[{"benchmark":"FedRAMP","reference":null}]}}},{"id":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/cli_test_va_sql_paas_000001/providers/Microsoft.Sql/servers/vasqlsrv000002/sqlServers/vasqlsrv000002/databases/vasqldb000003/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/aa735d1b-92ce-42f9-adc6-ef1806a65e0d/scanResults/VA1097","name":"VA1097","type":"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults","properties":{"ruleId":"VA1097","status":"NonFinding","isTrimmed":false,"queryResults":[],"remediation":{"description":"Revoke
        any unnecessary permissions granted to the special account GUEST","scripts":[],"automated":false,"portalLink":""},"baselineAdjustedResult":null,"ruleMetadata":{"ruleId":"VA1097","severity":"Low","category":"AuthenticationAndAuthorization","ruleType":"NegativeList","title":"Principal
        GUEST should not be granted permissions on objects or columns","description":"Each
        database includes a user called GUEST. Permissions granted to GUEST are inherited
        by users who have access to the database, but who do not have a user account
        in the database. This rule checks that all permissions have been revoked from
        the GUEST user.","rationale":"The special user GUEST is used to map any logins
        that are not mapped to a specific database user. This can result in principals
        gaining access to a database without having been explicitly granted permission
        to do so.","queryCheck":{"query":"SELECT object_schema_name(major_id) AS [Schema]\n    ,object_name(major_id)
        AS [Object]\n    ,perms.permission_name AS [Permission]\nFROM sys.database_permissions
        AS perms\nINNER JOIN sys.database_principals AS prin ON perms.grantee_principal_id
        = prin.principal_id\nWHERE prin.[name] = ''guest''\n    AND perms.class =
        1\n    AND [state] IN (''G'', ''W'')","expectedResult":[],"columnNames":["Schema","Object","Permission"]},"benchmarkReferences":[{"benchmark":"FedRAMP","reference":null}]}}},{"id":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/cli_test_va_sql_paas_000001/providers/Microsoft.Sql/servers/vasqlsrv000002/sqlServers/vasqlsrv000002/databases/vasqldb000003/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/aa735d1b-92ce-42f9-adc6-ef1806a65e0d/scanResults/VA1099","name":"VA1099","type":"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults","properties":{"ruleId":"VA1099","status":"NonFinding","isTrimmed":false,"queryResults":[],"remediation":{"description":"Revoke
        any unnecessary permissions granted to the special account GUEST","scripts":[],"automated":false,"portalLink":""},"baselineAdjustedResult":null,"ruleMetadata":{"ruleId":"VA1099","severity":"Low","category":"AuthenticationAndAuthorization","ruleType":"NegativeList","title":"GUEST
        user should not be granted permissions on database securables","description":"Each
        database includes a user called GUEST. Permissions granted to GUEST are inherited
        by users who have access to the database, but who do not have a user account
        in the database. This rule checks that all permissions have been revoked from
        the GUEST user.","rationale":"The special user GUEST is used to map any logins
        that are not mapped to a specific database user. This can result in principals
        gaining access to a database without having been explicitly granted permission
        to do so.","queryCheck":{"query":"DECLARE @guestId INT\n\nSELECT @guestId
        = principal_id\nFROM sys.database_principals\nWHERE [name] = ''guest''\n\nSELECT
        REPLACE(perms.class_desc, ''_'', '' '') AS [Permission Class]\n    ,CASE\n        WHEN
        perms.class = 3\n            THEN schema_name(major_id) -- schema\n        WHEN
        perms.class = 4\n            THEN printarget.name -- principal\n        WHEN
        perms.class = 5\n            THEN asm.name -- assembly\n        WHEN perms.class
        = 6\n            THEN type_name(major_id) -- type\n        WHEN perms.class
        = 24\n            THEN sym.name -- symmetric key\n        WHEN perms.class
        = 25\n            THEN crt.name -- certificate\n        END AS [Object]\n    ,perms.permission_name
        AS Permission\nFROM sys.database_permissions AS perms\nLEFT JOIN sys.database_principals
        AS prin ON perms.grantee_principal_id = prin.principal_id\nLEFT JOIN sys.assemblies
        AS asm ON perms.major_id = asm.assembly_id\nLEFT JOIN sys.database_principals
        AS printarget ON perms.major_id = printarget.principal_id\nLEFT JOIN sys.symmetric_keys
        AS sym ON perms.major_id = sym.symmetric_key_id\nLEFT JOIN sys.certificates
        AS crt ON perms.major_id = crt.certificate_id\nWHERE grantee_principal_id
        = @guestId\n    AND class IN (3, 4, 5, 6, 10, 15, 16, 17, 18, 19, 23, 24,
        25, 26)","expectedResult":[],"columnNames":["Permission Class","Object","Permission"]},"benchmarkReferences":[{"benchmark":"FedRAMP","reference":null}]}}},{"id":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/cli_test_va_sql_paas_000001/providers/Microsoft.Sql/servers/vasqlsrv000002/sqlServers/vasqlsrv000002/databases/vasqldb000003/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/aa735d1b-92ce-42f9-adc6-ef1806a65e0d/scanResults/VA1143","name":"VA1143","type":"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults","properties":{"ruleId":"VA1143","status":"Finding","isTrimmed":false,"queryResults":[["True"]],"remediation":{"description":"Create
        users with low privileges to access the DB and any data stored in it with
        the appropriate set of permissions.","scripts":[],"automated":false,"portalLink":""},"baselineAdjustedResult":{"baseline":{"expectedResults":[["True"]],"updatedTime":"2026-06-03T08:58:22.6755997+00:00"},"status":"NonFinding","resultsNotInBaseline":[],"resultsOnlyInBaseline":[]},"ruleMetadata":{"ruleId":"VA1143","severity":"Medium","category":"SurfaceAreaReduction","ruleType":"Binary","title":"''dbo''
        user should not be used for normal service operation","description":"The ''dbo'',
        or database owner, is a user account that has implied permissions to perform
        all activities in the database. Members of the sysadmin fixed server role
        are automatically mapped to dbo. This rule checks that dbo is not the only
        account allowed to access this database. Please note that on a newly created
        clean database this rule will fail until additional roles are created.","rationale":"A
        compromised service that accesses the database with the ''dbo'' user account
        will have full control of the database. To avoid this situation, lower privileged
        users should be defined for normal service operation, while the ''dbo'' account
        should only be used for administrative tasks that require this privilege.","queryCheck":{"query":"IF((SELECT
        count(*) from sys.database_principals  WHERE principal_id >= 5 AND principal_id
        < 16384 ) > 0) SELECT 0 AS [Violation]\nELSE SELECT 1 AS [Violation]","expectedResult":[["0"]],"columnNames":["Violation"]},"benchmarkReferences":[{"benchmark":"FedRAMP","reference":null}]}}},{"id":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/cli_test_va_sql_paas_000001/providers/Microsoft.Sql/servers/vasqlsrv000002/sqlServers/vasqlsrv000002/databases/vasqldb000003/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/aa735d1b-92ce-42f9-adc6-ef1806a65e0d/scanResults/VA1219","name":"VA1219","type":"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults","properties":{"ruleId":"VA1219","status":"NonFinding","isTrimmed":false,"queryResults":[["False"]],"remediation":{"description":"Enable
        TDE on the affected databases","scripts":[],"automated":false,"portalLink":"EnableTDE"},"baselineAdjustedResult":{"baseline":{"expectedResults":[["False"]],"updatedTime":"2026-06-03T08:58:17.6590939+00:00"},"status":"NonFinding","resultsNotInBaseline":[],"resultsOnlyInBaseline":[]},"ruleMetadata":{"ruleId":"VA1219","severity":"Medium","category":"DataProtection","ruleType":"Binary","title":"Transparent
        data encryption should be enabled","description":"Transparent data encryption
        (TDE) helps to protect the database files against information disclosure by
        performing real-time encryption and decryption of the database, associated
        backups, and transaction log files ''at rest'', without requiring changes
        to the application. This rule checks that TDE is enabled on the database.","rationale":"Transparent
        Data Encryption (TDE) protects data ''at rest'', meaning the data and log
        files are encrypted when stored on disk.","queryCheck":{"query":"SELECT CASE\n        WHEN
        EXISTS (\n                SELECT * \n                FROM sys.dm_database_encryption_keys
        \n                WHERE db_name(database_id) = db_name() \n                    AND
        (encryption_state != 5 and encryption_state != 1)\n                )\n            THEN
        0\n        ELSE 1\n        END AS [Violation]","expectedResult":[["0"]],"columnNames":["Violation"]},"benchmarkReferences":[{"benchmark":"FedRAMP","reference":null}]}}},{"id":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/cli_test_va_sql_paas_000001/providers/Microsoft.Sql/servers/vasqlsrv000002/sqlServers/vasqlsrv000002/databases/vasqldb000003/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/aa735d1b-92ce-42f9-adc6-ef1806a65e0d/scanResults/VA1221","name":"VA1221","type":"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults","properties":{"ruleId":"VA1221","status":"NonFinding","isTrimmed":false,"queryResults":[],"remediation":{"description":"Regenerate
        the DEK using AES","scripts":[],"automated":false,"portalLink":""},"baselineAdjustedResult":null,"ruleMetadata":{"ruleId":"VA1221","severity":"High","category":"DataProtection","ruleType":"NegativeList","title":"Database
        Encryption Symmetric Keys should use AES algorithm","description":"SQL Server
        uses encryption keys to help secure data, credentials, and connection information
        that is stored in a server database. SQL Server has two kinds of keys: symmetric
        and asymmetric. This rule checks that Database Encryption Symmetric Keys use
        AES algorithm.","rationale":"Weak encryption algorithms may lead to weaknesses
        in the data-at-rest protection.","queryCheck":{"query":"SELECT db_name(database_id)
        AS [Database]\n    ,encryption_state AS [Encryption State]\n    ,key_algorithm
        AS [Key Algorithm]\n    ,key_length AS [Key Length]\n    ,encryptor_type AS
        [Encryptor Type]\nFROM sys.dm_database_encryption_keys\nWHERE key_algorithm
        != ''AES''","expectedResult":[],"columnNames":["Database","Encryption State","Key
        Algorithm","Key Length","Encryptor Type"]},"benchmarkReferences":[{"benchmark":"FedRAMP","reference":null}]}}},{"id":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/cli_test_va_sql_paas_000001/providers/Microsoft.Sql/servers/vasqlsrv000002/sqlServers/vasqlsrv000002/databases/vasqldb000003/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/aa735d1b-92ce-42f9-adc6-ef1806a65e0d/scanResults/VA1223","name":"VA1223","type":"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults","properties":{"ruleId":"VA1223","status":"NonFinding","isTrimmed":false,"queryResults":[],"remediation":{"description":"Create
        new certificates, re-encrypt the data/sign-data using the new key, and drop
        the affected keys.","scripts":[],"automated":false,"portalLink":""},"baselineAdjustedResult":null,"ruleMetadata":{"ruleId":"VA1223","severity":"High","category":"DataProtection","ruleType":"NegativeList","title":"Certificate
        keys should use at least 2048 bits","description":"Certificate keys are used
        in RSA and other encryption algorithms to protect data. These keys need to
        be of enough length to secure the user''s data. This rule checks that the
        key''s length is at least 2048 bits for all certificates.","rationale":"Key
        length defines the upper-bound on the encryption algorithm''s security. Using
        short keys in encryption algorithms may lead to weaknesses in data-at-rest
        protection.","queryCheck":{"query":"SELECT name AS [Certificate Name], thumbprint
        AS [Thumbprint]\nFROM sys.certificates\nWHERE key_length < 2048","expectedResult":[],"columnNames":["Certificate
        Name","Thumbprint"]},"benchmarkReferences":[{"benchmark":"FedRAMP","reference":null}]}}},{"id":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/cli_test_va_sql_paas_000001/providers/Microsoft.Sql/servers/vasqlsrv000002/sqlServers/vasqlsrv000002/databases/vasqldb000003/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/aa735d1b-92ce-42f9-adc6-ef1806a65e0d/scanResults/VA1224","name":"VA1224","type":"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults","properties":{"ruleId":"VA1224","status":"NonFinding","isTrimmed":false,"queryResults":[],"remediation":{"description":"Create
        new asymmetric Keys, re-encrypt the data/sign-data using the new key, and
        drop the affected keys.","scripts":[],"automated":false,"portalLink":""},"baselineAdjustedResult":null,"ruleMetadata":{"ruleId":"VA1224","severity":"High","category":"DataProtection","ruleType":"NegativeList","title":"Asymmetric
        keys'' length should be at least 2048 bits","description":"Database asymmetric
        keys are used in many encryption algorithms, these keys need to be of enough
        length to secure the encrypted data, this rule checks that all asymmetric
        keys stored in the database are of length of at least 2048 bits","rationale":"Key
        length defines the upper-bound on the encryption algorithm''s security, using
        short keys in encryption algorithms may lead to weaknesses in the data-at-rest
        protection","queryCheck":{"query":"SELECT name AS [Key Name], pvt_key_encryption_type_desc
        AS [Encryption Type], algorithm_desc AS [Key Algorithm]\nFROM sys.asymmetric_keys\nWHERE
        key_length < 2048\nAND NOT (DB_NAME() = ''master'' AND name = ''MS_SQLEnableSystemAssemblyLoadingKey'')","expectedResult":[],"columnNames":["Key
        Name","Encryption Type","Key Algorithm"]},"benchmarkReferences":[{"benchmark":"CIS","reference":"v1.0.0-08-11-2017:7.2"},{"benchmark":"FedRAMP","reference":null}]}}},{"id":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/cli_test_va_sql_paas_000001/providers/Microsoft.Sql/servers/vasqlsrv000002/sqlServers/vasqlsrv000002/databases/vasqldb000003/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/aa735d1b-92ce-42f9-adc6-ef1806a65e0d/scanResults/VA1246","name":"VA1246","type":"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults","properties":{"ruleId":"VA1246","status":"NonFinding","isTrimmed":false,"queryResults":[],"remediation":{"description":"Remove
        the application roles. Use users without login as a permission-based replacement","scripts":[],"automated":true,"portalLink":""},"baselineAdjustedResult":null,"ruleMetadata":{"ruleId":"VA1246","severity":"Low","category":"AuthenticationAndAuthorization","ruleType":"NegativeList","title":"Application
        roles should not be used","description":"An application role is a database
        principal that enables an application to run with its own user-like permissions.
        Application roles enable that only users connecting through a particular application
        can access specific data. Application roles are password-based (which applications
        typically hardcode) and not permission based, which exposes the database to
        approle impersonation by password-guessing. This rule checks that no application
        roles are defined in the database.","rationale":"It is important to limit
        the possibility of acquiring user-like permissions to the database, and since
        application roles are password based, they can lead to impersonation of the
        application role via password-guessing.","queryCheck":{"query":"SELECT name
        AS [Role]\nFROM sys.database_principals\nWHERE type  = ''A''","expectedResult":[],"columnNames":["Role"]},"benchmarkReferences":[{"benchmark":"FedRAMP","reference":null}]}}},{"id":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/cli_test_va_sql_paas_000001/providers/Microsoft.Sql/servers/vasqlsrv000002/sqlServers/vasqlsrv000002/databases/vasqldb000003/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/aa735d1b-92ce-42f9-adc6-ef1806a65e0d/scanResults/VA1248","name":"VA1248","type":"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults","properties":{"ruleId":"VA1248","status":"NonFinding","isTrimmed":false,"queryResults":[],"remediation":{"description":"Remove
        user defined roles from fixed-database roles","scripts":[],"automated":false,"portalLink":""},"baselineAdjustedResult":null,"ruleMetadata":{"ruleId":"VA1248","severity":"Medium","category":"AuthenticationAndAuthorization","ruleType":"NegativeList","title":"User-defined
        database roles should not be members of fixed roles","description":"To easily
        manage the permissions in your databases, SQL Server provides several roles
        which are security principals that group other principals. They are like groups
        in the Microsoft Windows operating system. Database accounts and other SQL
        Server roles can be added into database-level roles. Each member of a fixed-database
        role can add other users to that same role. This rule checks that no user-defined
        roles are members of fixed roles","rationale":"Adding user defined database
        roles as members of fixed roles could enable unintended privilege escalation,
        also finding any metadata indicating that the fixed roles have been modified
        is typically a sign of data corruption or signs of somebody corrupting the
        metadata in order to hide unusual activity.","queryCheck":{"query":"SELECT
        user_name(roles.role_principal_id) AS [Role]\n    ,user_name(roles.member_principal_id)
        AS [Member]\nFROM sys.database_role_members AS roles\nINNER JOIN sys.database_principals
        AS users\nON roles.member_principal_id = users.principal_id\n    AND (\n        roles.role_principal_id
        >= 16384\n        AND roles.role_principal_id <= 16393\n        )\n    AND
        users.type = ''R''","expectedResult":[],"columnNames":["Role","Member"]},"benchmarkReferences":[{"benchmark":"FedRAMP","reference":null}]}}},{"id":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/cli_test_va_sql_paas_000001/providers/Microsoft.Sql/servers/vasqlsrv000002/sqlServers/vasqlsrv000002/databases/vasqldb000003/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/aa735d1b-92ce-42f9-adc6-ef1806a65e0d/scanResults/VA1258","name":"VA1258","type":"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults","properties":{"ruleId":"VA1258","status":"NonFinding","isTrimmed":false,"queryResults":[],"remediation":{"description":"Keep
        track of database owners. Remove unnecessary database owners to avoid granting
        excessive permissions or update the baseline to reflect the approved list
        of owners.","scripts":[],"automated":false,"portalLink":""},"baselineAdjustedResult":null,"ruleMetadata":{"ruleId":"VA1258","severity":"High","category":"AuditingAndLogging","ruleType":"BaselineExpected","title":"Database
        owners are as expected","description":"Database owners can perform all configuration
        and maintenance activities on the database, and can also drop databases in
        SQL Server. Tracking database owners is important to avoid having excessive
        permission for some principals. Create a baseline which defines the expected
        database owners for the database. This rule checks whether the database owners
        are as defined in the baseline.","rationale":"Keeping track of database owners
        is important to avoid granting excessive permissions.","queryCheck":{"query":"SELECT
        USER_NAME(member_principal_id) AS [Owner]\nFROM sys.database_role_members\nWHERE
        USER_NAME(role_principal_id) = ''db_owner''\n    AND USER_NAME(member_principal_id)
        != ''dbo''","expectedResult":[],"columnNames":["Owner"]},"benchmarkReferences":[{"benchmark":"FedRAMP","reference":null}]}}},{"id":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/cli_test_va_sql_paas_000001/providers/Microsoft.Sql/servers/vasqlsrv000002/sqlServers/vasqlsrv000002/databases/vasqldb000003/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/aa735d1b-92ce-42f9-adc6-ef1806a65e0d/scanResults/VA1281","name":"VA1281","type":"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults","properties":{"ruleId":"VA1281","status":"NonFinding","isTrimmed":false,"queryResults":[],"remediation":{"description":"Keep
        track of role membership and remove unnecessary members from roles to avoid
        granting excessive permissions or update baseline to comply with new changes","scripts":[],"automated":false,"portalLink":""},"baselineAdjustedResult":null,"ruleMetadata":{"ruleId":"VA1281","severity":"Medium","category":"AuditingAndLogging","ruleType":"BaselineExpected","title":"All
        memberships for user-defined roles should be intended","description":"User-defined
        roles are security principals defined by the user to group principals to easily
        manage permissions. Monitoring these roles is important to avoid having excessive
        permissions. Create a baseline which defines expected membership for each
        user-defined role. This rule checks whether all memberships for user-defined
        roles are as defined in the baseline","rationale":"Keeping track of role memberships
        is important to avoid granting excessive permissions","queryCheck":{"query":"SELECT
        user_name(role_principal_id) as [Role], user_name(member_principal_id) as
        [Member]\nFROM sys.database_role_members\nWHERE role_principal_id NOT IN (16384,16385,16386,16387,16389,16390,16391,16392,16393)","expectedResult":[],"columnNames":["Role","Member"]},"benchmarkReferences":[{"benchmark":"FedRAMP","reference":null}]}}},{"id":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/cli_test_va_sql_paas_000001/providers/Microsoft.Sql/servers/vasqlsrv000002/sqlServers/vasqlsrv000002/databases/vasqldb000003/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/aa735d1b-92ce-42f9-adc6-ef1806a65e0d/scanResults/VA1282","name":"VA1282","type":"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults","properties":{"ruleId":"VA1282","status":"NonFinding","isTrimmed":false,"queryResults":[],"remediation":{"description":"Drop
        the unnecessary database roles.","scripts":[],"automated":true,"portalLink":""},"baselineAdjustedResult":null,"ruleMetadata":{"ruleId":"VA1282","severity":"Low","category":"AuthenticationAndAuthorization","ruleType":"NegativeList","title":"Orphan
        database roles should be removed","description":"Orphan database roles are
        user-defined roles that have no members. It is recommended to eliminate orphaned
        roles as they are not needed on the system. This rule checks whether there
        are any orphan roles","rationale":"Reduce the attack surface area by eliminating
        unnecessary database roles in the system.","queryCheck":{"query":"SELECT name
        AS [Role]\nFROM sys.database_principals\nWHERE type = ''R''\nAND principal_id
        not in (0,16384,16385,16386,16387,16389,16390,16391,16392,16393)\nAND principal_id
        not in ( \n    SELECT distinct role_principal_id\n    FROM sys.database_role_members\n    )","expectedResult":[],"columnNames":["Role"]},"benchmarkReferences":[{"benchmark":"FedRAMP","reference":null}]}}},{"id":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/cli_test_va_sql_paas_000001/providers/Microsoft.Sql/servers/vasqlsrv000002/sqlServers/vasqlsrv000002/databases/vasqldb000003/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/aa735d1b-92ce-42f9-adc6-ef1806a65e0d/scanResults/VA2020","name":"VA2020","type":"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults","properties":{"ruleId":"VA2020","status":"NonFinding","isTrimmed":false,"queryResults":[],"remediation":{"description":"Revoke
        permissions from principals where not needed. It is recommended to have at
        most 1 principal granted a specific permission.","scripts":[],"automated":false,"portalLink":""},"baselineAdjustedResult":null,"ruleMetadata":{"ruleId":"VA2020","severity":"High","category":"AuthenticationAndAuthorization","ruleType":"BaselineExpected","title":"Minimal
        set of principals should be granted ALTER or ALTER ANY USER database-scoped
        permissions","description":"Every SQL Server securable has permissions associated
        with it that can be granted to principals. Permissions can be scoped at the
        server level (assigned to logins and server roles) or at the database level
        (assigned to database users and database roles). These rules check that only
        a minimal set of principals are granted ALTER or ALTER ANY USER database-scoped
        permissions.","rationale":"Developing an application using a least-privileged
        user account (LUA) approach is an important part of a defensive, in-depth
        strategy for countering security threats. The LUA approach ensures that users
        follow the principle of least privilege and always log on with limited user
        accounts. Administrative tasks are broken out using fixed server roles, and
        the use of the sysadmin fixed server role is severely restricted. Always follow
        the principle of least privilege when granting permissions to database users.
        Grant the minimum permissions necessary to a user or role to accomplish a
        given task. See https://msdn.microsoft.com/en-us/library/bb669084(v=vs.110).aspx.","queryCheck":{"query":"SELECT
        perms.class_desc AS [Permission Class]\n    ,perms.permission_name AS Permission\n    ,type_desc
        AS [Principal Type]\n    ,prin.name AS Principal\nFROM sys.database_permissions
        AS perms\nINNER JOIN sys.database_principals AS prin ON perms.grantee_principal_id
        = prin.principal_id\nWHERE permission_name IN (\n        ''ALTER''\n        ,''ALTER
        ANY USER''\n        )\n    AND user_name(grantee_principal_id) NOT IN (\n        ''guest''\n        ,''public''\n        )\n    AND
        perms.class = 0\n    AND [state] IN (''G'',''W'')\n    AND NOT (\n        prin.type
        = ''S''\n        AND prin.name = ''dbo''\n        AND prin.authentication_type
        = 1\n        AND prin.owning_principal_id IS NULL\n        )","expectedResult":[],"columnNames":["Permission
        Class","Permission","Principal Type","Principal"]},"benchmarkReferences":[{"benchmark":"FedRAMP","reference":null}]}}},{"id":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/cli_test_va_sql_paas_000001/providers/Microsoft.Sql/servers/vasqlsrv000002/sqlServers/vasqlsrv000002/databases/vasqldb000003/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/aa735d1b-92ce-42f9-adc6-ef1806a65e0d/scanResults/VA2033","name":"VA2033","type":"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults","properties":{"ruleId":"VA2033","status":"NonFinding","isTrimmed":false,"queryResults":[],"remediation":{"description":"Revoke
        permissions from principals where not needed. It is recommended to have at
        most 1 principal granted a specific permission.","scripts":[],"automated":false,"portalLink":""},"baselineAdjustedResult":null,"ruleMetadata":{"ruleId":"VA2033","severity":"Low","category":"AuthenticationAndAuthorization","ruleType":"BaselineExpected","title":"Minimal
        set of principals should be granted EXECUTE permission on objects or columns","description":"This
        rule checks which principals are granted EXECUTE permission on objects or
        columns to ensure this permission is granted to a minimal set of principals.
        Every SQL Server securable has permissions associated with it that can be
        granted to principals.\nPermissions can be scoped at the server level (assigned
        to logins and server roles) or at the database level (assigned to database
        users, database roles or application roles). The EXECUTE permission applies
        to both stored procedures and scalar functions, which can be used in computed
        columns.","rationale":"Developing an application using a least-privileged
        user account (LUA) approach is an important part of a defensive, in-depth
        strategy for countering security threats. The LUA approach ensures that users
        follow the principle of least privilege and always log on with limited user
        accounts. Administrative tasks are broken out using fixed server roles, and
        the use of the sysadmin fixed server role is severely restricted. Always follow
        the principle of least privilege when granting permissions to database users.
        Grant the minimum permissions necessary to a user or role to accomplish a
        given task. See https://msdn.microsoft.com/en-us/library/bb669084(v=vs.110).aspx.","queryCheck":{"query":"SELECT
        perms.class_desc AS [Permission Class]\n    ,object_schema_name(major_id)
        AS [Schema]\n    ,object_name(major_id) AS [Object]\n    ,perms.permission_name
        AS [Permission]\n    ,type_desc AS [Principal Type]\n    ,prin.name AS [Principal]\nFROM
        sys.database_permissions AS perms\nINNER JOIN sys.database_principals AS prin
        ON perms.grantee_principal_id = prin.principal_id\nWHERE permission_name IN
        (''EXECUTE'')\n    AND grantee_principal_id NOT IN (\n        SELECT principal_id\n        FROM
        sys.database_principals\n        WHERE name IN (''guest'', ''public'')\n        )\n    AND
        perms.class = 1\n    AND [state] IN (''G'', ''W'')","expectedResult":[],"columnNames":["Permission
        Class","Schema","Object","Permission","Principal Type","Principal"]},"benchmarkReferences":[{"benchmark":"FedRAMP","reference":null}]}}},{"id":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/cli_test_va_sql_paas_000001/providers/Microsoft.Sql/servers/vasqlsrv000002/sqlServers/vasqlsrv000002/databases/vasqldb000003/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/aa735d1b-92ce-42f9-adc6-ef1806a65e0d/scanResults/VA2062","name":"VA2062","type":"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults","properties":{"ruleId":"VA2062","status":"NonFinding","isTrimmed":false,"queryResults":[],"remediation":{"description":"Remove
        database firewall rules that grant excessive access","scripts":[],"automated":false,"portalLink":""},"baselineAdjustedResult":null,"ruleMetadata":{"ruleId":"VA2062","severity":"High","category":"SurfaceAreaReduction","ruleType":"NegativeList","title":"Database-level
        firewall rules should not grant excessive access","description":"The Azure
        SQL Database-level firewall helps protect your data by preventing all access
        to your database until you specify which IP addresses have permission. Database-level
        firewall rules grant access to the specific database based on the originating
        IP address of each request.\n\nDatabase-level firewall rules for master and
        user databases can only be created and managed through Transact-SQL (unlike
        server-level firewall rules which can also be created and managed using the
        Azure portal or PowerShell). For more details please see: https://docs.microsoft.com/en-us/azure/sql-database/sql-database-firewall-configure\n\nThis
        check verifies that each database-level firewall rule does not grant access
        to more than 255 IP addresses.","rationale":"Often, administrators add rules
        that grant excessive access as part of a troubleshooting process - to eliminate
        the firewall as the source of a problem, they simply create a rule that allows
        all traffic to pass to the affected database.\n\nGranting excessive access
        using database firewall rules is a clear security concern, as it violates
        the principle of least privilege by allowing unnecessary access to your database.
        In fact, it''s the equivalent of placing the database outside of the firewall.","queryCheck":{"query":"SELECT
        name AS [Firewall Rule Name]\n    ,start_ip_address AS [Start Address]\n    ,end_ip_address
        AS [End Address]\nFROM sys.database_firewall_rules\nWHERE ( \n        (CONVERT(bigint,
        parsename(end_ip_address, 1)) +\n         CONVERT(bigint, parsename(end_ip_address,
        2)) * 256 + \n         CONVERT(bigint, parsename(end_ip_address, 3)) * 65536
        + \n         CONVERT(bigint, parsename(end_ip_address, 4)) * 16777216 ) \n        -
        \n        (CONVERT(bigint, parsename(start_ip_address, 1)) +\n         CONVERT(bigint,
        parsename(start_ip_address, 2)) * 256 + \n         CONVERT(bigint, parsename(start_ip_address,
        3)) * 65536 + \n         CONVERT(bigint, parsename(start_ip_address, 4)) *
        16777216 )\n      ) > 255","expectedResult":[],"columnNames":["Firewall Rule
        Name","Start Address","End Address"]},"benchmarkReferences":[]}}},{"id":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/cli_test_va_sql_paas_000001/providers/Microsoft.Sql/servers/vasqlsrv000002/sqlServers/vasqlsrv000002/databases/vasqldb000003/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/aa735d1b-92ce-42f9-adc6-ef1806a65e0d/scanResults/VA2064","name":"VA2064","type":"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults","properties":{"ruleId":"VA2064","status":"NonFinding","isTrimmed":false,"queryResults":[],"remediation":{"description":"Evaluate
        each of the database-level firewall rules. Remove any rules that grant unnecessary
        access and set the rest as a baseline. Deviations from the baseline will be
        identified and brought to your attention in subsequent scans.","scripts":[],"automated":false,"portalLink":""},"baselineAdjustedResult":null,"ruleMetadata":{"ruleId":"VA2064","severity":"High","category":"SurfaceAreaReduction","ruleType":"BaselineExpected","title":"Database-level
        firewall rules should be tracked and maintained at a strict minimum","description":"The
        Azure SQL Database-level firewall helps protect your data by preventing all
        access to your database until you specify which IP addresses have permission.
        Database-level firewall rules grant access to the specific database based
        on the originating IP address of each request.\n\nDatabase-level firewall
        rules for master and user databases can only be created and managed through
        Transact-SQL (unlike server-level firewall rules which can also be created
        and managed using the Azure portal or PowerShell). For more details please
        see: https://docs.microsoft.com/en-us/azure/sql-database/sql-database-firewall-configure.\n\nThis
        check enumerates all the database-level firewall rules so that any changes
        made to them can be identified and addressed.","rationale":"Firewall rules
        should be strictly configured to allow access only to client computers that
        have a valid need to connect to the database. Any superfluous entries in the
        firewall may pose a threat by allowing an unauthorized source access to your
        database.","queryCheck":{"query":"SELECT name AS [Firewall Rule Name]\n    ,start_ip_address
        AS [Start Address]\n    ,end_ip_address AS [End Address]\nFROM sys.database_firewall_rules","expectedResult":[],"columnNames":["Firewall
        Rule Name","Start Address","End Address"]},"benchmarkReferences":[]}}},{"id":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/cli_test_va_sql_paas_000001/providers/Microsoft.Sql/servers/vasqlsrv000002/sqlServers/vasqlsrv000002/databases/vasqldb000003/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/aa735d1b-92ce-42f9-adc6-ef1806a65e0d/scanResults/VA2108","name":"VA2108","type":"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults","properties":{"ruleId":"VA2108","status":"NonFinding","isTrimmed":false,"queryResults":[],"remediation":{"description":"Remove
        members who should not have access to the database role","scripts":[],"automated":true,"portalLink":""},"baselineAdjustedResult":null,"ruleMetadata":{"ruleId":"VA2108","severity":"High","category":"AuthenticationAndAuthorization","ruleType":"BaselineExpected","title":"Minimal
        set of principals should be members of fixed high impact database roles","description":"SQL
        Server provides roles to help manage the permissions. Roles are security principals
        that group other principals. Database-level roles are database-wide in their
        permission scope. This rule checks that a minimal set of principals are members
        of the fixed database roles.","rationale":"Fixed database roles may have administrative
        permissions on the system. Following the principle of least privilege, it
        is important to minimize membership in fixed database roles and keep a baseline
        of these memberships. See https://docs.microsoft.com/en-us/sql/relational-databases/security/authentication-access/database-level-roles
        for additional information on database roles.","queryCheck":{"query":"SELECT
        user_name(sr.member_principal_id) AS [Principal]\n    ,user_name(sr.role_principal_id)
        AS [Role]\n    ,type_desc AS [Principal Type]\n    ,authentication_type_desc
        AS [Authentication Type]\nFROM sys.database_role_members AS sr\nINNER JOIN
        sys.database_principals AS sp ON sp.principal_id = sr.member_principal_id\nWHERE
        sr.role_principal_id IN (\n        user_id(''bulkadmin''),\n        user_id(''db_accessadmin''),\n        user_id(''db_securityadmin''),\n        user_id(''db_ddladmin''),\n        user_id(''db_backupoperator''))\n    OR
        (sr.role_principal_id = user_id(''db_owner'')\n        AND sr.member_principal_id
        <> user_id(''dbo''))","expectedResult":[],"columnNames":["Principal","Role","Principal
        Type","Authentication Type"]},"benchmarkReferences":[{"benchmark":"FedRAMP","reference":null}]}}},{"id":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/cli_test_va_sql_paas_000001/providers/Microsoft.Sql/servers/vasqlsrv000002/sqlServers/vasqlsrv000002/databases/vasqldb000003/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/aa735d1b-92ce-42f9-adc6-ef1806a65e0d/scanResults/VA2109","name":"VA2109","type":"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults","properties":{"ruleId":"VA2109","status":"NonFinding","isTrimmed":false,"queryResults":[],"remediation":{"description":"Remove
        members who should not have access to the database role","scripts":[],"automated":true,"portalLink":""},"baselineAdjustedResult":null,"ruleMetadata":{"ruleId":"VA2109","severity":"Low","category":"AuthenticationAndAuthorization","ruleType":"BaselineExpected","title":"Minimal
        set of principals should be members of fixed low impact database roles","description":"SQL
        Server provides roles to help manage the permissions. Roles are security principals
        that group other principals. Database-level roles are database-wide in their
        permission scope. This rule checks that a minimal set of principals are members
        of the fixed database roles.","rationale":"Fixed database roles may have administrative
        permissions on the system. Following the principle of least privilege, it
        is important to minimize membership in fixed database roles and keep a baseline
        of these memberships. See https://docs.microsoft.com/en-us/sql/relational-databases/security/authentication-access/database-level-roles
        for additional information on database roles.","queryCheck":{"query":"SELECT
        user_name(sr.member_principal_id) as [Principal]\n    ,user_name(sr.role_principal_id)
        as [Role]\n    ,type_desc as [Principal Type]\n    ,authentication_type_desc
        as [Authentication Type]\nFROM sys.database_role_members AS sr\nINNER JOIN
        sys.database_principals AS sp ON sp.principal_id = sr.member_principal_id\nWHERE
        sr.role_principal_id IN (\n        user_id(''db_datareader'')\n        ,user_id(''db_datawriter'')\n        ,user_id(''db_denydatareader'')\n        ,user_id(''db_denydatawriter'')\n        )","expectedResult":[],"columnNames":["Principal","Role","Principal
        Type","Authentication Type"]},"benchmarkReferences":[{"benchmark":"FedRAMP","reference":null}]}}},{"id":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/cli_test_va_sql_paas_000001/providers/Microsoft.Sql/servers/vasqlsrv000002/sqlServers/vasqlsrv000002/databases/vasqldb000003/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/aa735d1b-92ce-42f9-adc6-ef1806a65e0d/scanResults/VA2129","name":"VA2129","type":"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults","properties":{"ruleId":"VA2129","status":"NonFinding","isTrimmed":false,"queryResults":[],"remediation":{"description":"Baseline
        or remove the signature from the modules ","scripts":[],"automated":false,"portalLink":""},"baselineAdjustedResult":null,"ruleMetadata":{"ruleId":"VA2129","severity":"High","category":"AuthenticationAndAuthorization","ruleType":"BaselineExpected","title":"Changes
        to signed modules should be authorized","description":"You can sign a stored
        procedure, function or trigger with a certificate or an asymmetric key. This
        is designed for scenarios when permissions cannot be inherited through ownership
        chaining or when the ownership chain is broken, such as dynamic SQL. This
        rule checks for changes made to signed modules which could be an indication
        of malicious use.","rationale":"Changes made to the contents of a signed module
        or to the certificate or asymmetric key that is used to sign it, as well as
        the introduction of new signed modules could be an an indication of an attack.
        Setting the known signed modules as a baseline allows you to easily detect
        changes made, and to evaluate whether the changes are intended.","queryCheck":{"query":"SELECT
        \n    QUOTENAME(sc.name) + ''.'' + QUOTENAME(oj.name) AS [Module]\n    ,IIF(ct.certificate_id
        IS NOT NULL, ct.name, ak.name) AS [Signing Object]\n    ,dp.name AS [Signing
        Object Owner]\n    ,cp.thumbprint AS [Signing Object Thumbprint]\n    ,oj.modify_date
        AS [Last Definition Modify Date]\n    ,IIF(ct.certificate_id IS NOT NULL,
        ''CERTIFICATE'', ''ASYMMETRIC KEY'') AS [Signing Object Type]\nFROM \n    sys.crypt_properties
        AS cp\n    INNER JOIN sys.objects AS oj ON cp.major_id = oj.object_id\n    INNER
        JOIN sys.schemas AS sc ON oj.schema_id = sc.schema_id\n    INNER JOIN sys.sql_modules
        AS md ON md.object_id = cp.major_id\n    LEFT OUTER JOIN sys.certificates
        AS ct ON cp.thumbprint = ct.thumbprint\n    LEFT OUTER JOIN sys.asymmetric_keys
        AS ak ON cp.thumbprint = ak.thumbprint\n    LEFT OUTER JOIN sys.database_principals
        AS dp ON (ct.sid = dp.sid OR ak.sid = dp.sid)\nWHERE \n    oj.type IN (''P'',''FN'',''TR'')\n    AND
        cp.class_desc = ''OBJECT_OR_COLUMN''\n    AND oj.is_ms_shipped = 0","expectedResult":[],"columnNames":["Module","Signing
        Object","Signing Object Owner","Signing Object Thumbprint","Last Definition
        Modify Date","Signing Object Type"]},"benchmarkReferences":[{"benchmark":"CIS","reference":null}]}}},{"id":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/cli_test_va_sql_paas_000001/providers/Microsoft.Sql/servers/vasqlsrv000002/sqlServers/vasqlsrv000002/databases/vasqldb000003/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/aa735d1b-92ce-42f9-adc6-ef1806a65e0d/scanResults/VA2130","name":"VA2130","type":"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults","properties":{"ruleId":"VA2130","status":"NonFinding","isTrimmed":false,"queryResults":[],"remediation":{"description":"Revoke
        unnecessary access granted to users. Add the rest to the baseline. ","scripts":[],"automated":false,"portalLink":""},"baselineAdjustedResult":null,"ruleMetadata":{"ruleId":"VA2130","severity":"Low","category":"AuthenticationAndAuthorization","ruleType":"BaselineExpected","title":"Track
        all users with access to the database","description":"This check tracks all
        users with access to a database. Make sure that these users are authorized
        according to their current role in the organization. ","rationale":"Performing
        a User Access Review helps identify accounts that were added to the server
        maliciously and dormant accounts.","queryCheck":{"query":"WITH UsersAndRoles
        (principal_name, sid, type) AS \n(\n    SELECT DISTINCT prin.name, prin.sid,
        prin.type \n    FROM sys.database_principals prin \n        INNER JOIN ( SELECT
        *\n                     FROM sys.database_permissions\n                     WHERE
        type = ''CO'' \n                        AND state IN (''G'', ''W'')\n        )
        perm \n            ON perm.grantee_principal_id = prin.principal_id \n        WHERE
        prin.type IN (''S'', ''X'', ''R'', ''E'', ''G'')\n    UNION ALL\n    SELECT
        \n        user_name(rls.member_principal_id), prin.sid, prin.type\n    FROM
        \n        UsersAndRoles cte\n        INNER JOIN sys.database_role_members
        rls\n            ON user_name(rls.role_principal_id) = cte.principal_name\n        INNER
        JOIN sys.database_principals prin\n            ON rls.member_principal_id
        = prin.principal_id\n        WHERE cte.type = ''R''\n),\nUsers (database_user,
        sid) AS\n(\n    SELECT principal_name, sid\n    FROM UsersAndRoles\n    WHERE
        type IN (''S'', ''X'', ''E'', ''G'')\n        AND principal_name != ''dbo''\n)\nSELECT
        DISTINCT database_user AS [User], sid AS [SID]\n    FROM Users\n    WHERE
        sid != 0x01","expectedResult":[],"columnNames":["User","SID"]},"benchmarkReferences":[{"benchmark":"SOX","reference":null}]}}}]}'

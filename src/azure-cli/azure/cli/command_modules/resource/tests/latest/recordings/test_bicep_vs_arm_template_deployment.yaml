-bicep.vsix\",\"label\":\"\",\"uploader\":{\"login\":\"shenglol\",\"id\":16367959,\"node_id\":\"MDQ6VXNlcjE2MzY3OTU5\",\"avatar_url\":\"https://avatars.githubusercontent.com/u/16367959?v=4\",\"gravatar_id\":\"\",\"url\":\"https://api.github.com/users/shenglol\",\"html_url\":\"https://github.com/shenglol\",\"followers_url\":\"https://api.github.com/users/shenglol/followers\",\"following_url\":\"https://api.github.com/users/shenglol/following{/other_user}\",\"gists_url\":\"https://api.github.com/users/shenglol/gists{/gist_id}\",\"starred_url\":\"https://api.github.com/users/shenglol/starred{/owner}{/repo}\",\"subscriptions_url\":\"https://api.github.com/users/shenglol/subscriptions\",\"organizations_url\":\"https://api.github.com/users/shenglol/orgs\",\"repos_url\":\"https://api.github.com/users/shenglol/repos\",\"events_url\":\"https://api.github.com/users/shenglol/events{/privacy}\",\"received_events_url\":\"https://api.github.com/users/shenglol/received_events\",\"type\":\"User\",\"user_view_type\":\"public\",\"site_admin\":false},\"content_type\":\"application/vsix\",\"state\":\"uploaded\",\"size\":94647293,\"digest\":\"sha256:441a1270c69858a7c0f5238d08b90511c1b08fc7df43766500e8b2418f4bb55c\",\"download_count\":648,\"created_at\":\"2025-08-01T01:18:01Z\",\"updated_at\":\"2025-08-01T01:18:05Z\",\"browser_download_url\":\"https://github.com/Azure/bicep/releases/download/v0.37.4/vscode-bicep.vsix\"}],\"tarball_url\":\"https://api.github.com/repos/Azure/bicep/tarball/v0.37.4\",\"zipball_url\":\"https://api.github.com/repos/Azure/bicep/zipball/v0.37.4\",\"body\":\"##
        Highlights\\r\\n* **[Experimental]** Bicep MCP server (#17519, #17572, #17607,
        #17712). See [Using Bicep MCP Server in VS Code (Preview!)](https://github.com/Azure/bicep/blob/main/docs/experimental/mcp-tools.md)
        for usage information.\\r\\n* **[Experimental]** Simplified C# authoring experience
        for [Local Deploy](https://github.com/Azure/bicep/blob/main/docs/experimental/local-deploy.md)
        extensions (#17557, #17616) - thanks @samirbanjanovic !\\r\\n    * See [Creating
        a Local Extension with .NET](https://github.com/Azure/bicep/blob/main/docs/experimental/local-deploy-dotnet-quickstart.md)
        for a minimal quickstart guide.\\r\\n* GA release for the `externalInput()`
        function (#17470)\\r\\n* **[Requires the `localDeploy` [Experimental feature](https://github.com/Azure/bicep/blob/main/docs/experimental-features.md)]**
        Simplify publishing process by supporting type discovery via gRPC (#17665)\\r\\n*
        Add \\\"format\\\" capability to `bicep jsonrpc` (#17567)\\r\\n* **[Requires
        the `moduleExtensionConfigs` [Experimental feature](https://github.com/Azure/bicep/blob/main/docs/experimental-features.md)]**
        Extension config assignment syntax updates and module aware extension config
        assignment (#17389)\\r\\n\\r\\n## Breaking Changes\\r\\n\\r\\n### `bicep generate-params`
        now preserves the specified output file extension\\r\\nThe command no longer
        overrides the output file extension when `--outfile` is specified.\\r\\n\\r\\nPreviously,
        the command would change the output file\u2019s extension even if one was
        explicitly provided. For example:\\r\\n\\r\\n```\\r\\nbicep generate-params
        main.bicep --outfile main\\r\\nbicep generate-params main.bicep --outfile
        main.txt\\r\\n```\\r\\nwould all produce `main.parameters.json`, which was
        an unintentional behavior.\\r\\n\\r\\nStarting with this release, the command
        preserves the file name exactly as specified:\\r\\n\\r\\n```\\r\\nbicep generate-params
        main.bicep --outfile main\\r\\nbicep generate-params main.bicep --outfile
        main.txt\\r\\nbicep generate-params main.bicep --outfile main.params.json\\r\\n```\\r\\n\\r\\nnow
        produces main, main.txt, and main.params.json respectively.\\r\\n\\r\\n##
        Bugs and Features\\r\\n* Use language version 2.0 for extensibility (#17714)\\r\\n*
        Update short-circuiting linter to use nested deployment expander (#17334)\\r\\n*
        Emit an error diagnostic when a secure output is dereferenced indirectly (#17453)\\r\\n*
        Improve `reduce` type inference (#17574)\\r\\n* Add stacks extensibility linting
        rule. Restrict syntax on config assignments. (#17654)\\r\\n* Add control bar
        for visual designer (#17518)\\r\\n* Remove deprecated CLI arguments (#17564)\\r\\n\\r\\n##
        Community Contributions\\r\\n* Update params-file-grammar.md (#17510) - thanks
        @rgant !\\r\\n* Add linter rule to warn on usage of outdated AzPowerShell
        version in deployment scripts (#17556) - thanks @guimatheus92 !\\r\\n* Added
        references to the Azure Verified Module website and bicep-registry-module
        repository (#17664) - thanks @johnlokerse !\",\"reactions\":{\"url\":\"https://api.github.com/repos/Azure/bicep/releases/236677351/reactions\",\"total_count\":7,\"+1\":0,\"-1\":0,\"laugh\":0,\"hooray\":0,\"confused\":0,\"heart\":0,\"rocket\":7,\"eyes\":0},\"mentions_count\":4}"

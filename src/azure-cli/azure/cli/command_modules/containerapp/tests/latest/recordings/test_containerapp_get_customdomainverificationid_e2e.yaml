        style=\\\"text-align: center;\\\">\\n<p><span data-contrast=\\\"auto\\\">100%</span></p>\\n</td>\\n</tr>\\n</tbody>\\n</table>\\n<p>The
        service credit will be applied against future payments otherwise due from
        you for the affected Premium DNS Service. Service credits do not entitle you
        to any refund or other payment from us. The most we\u2019ll credit for one
        month is 100% of your Premium DNS Service fee for the affected Premium DNS
        Service. The total we\u2019ll credit in any 12-month period under the Service
        Uptime Guarantee will not be more than one (1) month of your Premium DNS Service
        fees.\u202F\u202F\u202F </p>\\n<p>The service credits set forth herein are
        the sole and exclusive remedy if we do not meet the Service Uptime Guarantee.
        </p>\\n<p><u><em>Domain Name System Security Extensions (&quot;DNSSEC&quot;)</em></u></p>\\n<p>If
        your Premium DNS Service include DNSSEC, you will be able to secure your domain
        names with DNSSEC. DNSSEC is designed to protect you from forged DNS data
        so \u201Chackers\u201D cannot direct visitors to your website to a forged
        site.\u202F </p>\\n<p>DNSSEC works by using public key cryptography. You acknowledge
        and agree that if the keys do not match, a visitor\u2019s lookup of your website
        may fail (and result in a \u201Cwebsite not found\u201D error) and we assume
        no liability or responsibility regarding the same. In addition, DNSSEC responses
        are authenticated, but not encrypted. You acknowledge and agree that DNSSEC
        does not provide confidentiality of data, and we assume no liability or responsibility
        regarding the same. </p>\\n<p>We prohibit the running of a public recursive
        DNS service on any server. All recursive DNS servers must be secured to allow
        only internal network access or a limited set of IP addresses. We actively
        scan for the presence of public recursive DNS services and reserve the right
        to remove any servers from the network that violate this restriction. </p>\\n</p>\\n
        \       <p><p><strong>Domain Protection.</strong> We have different levels
        of Domain Protection to help keep your domains secure:</p>\\n<ul>\\n<li>Full
        Domain Protection: Helps prevent unauthorized domain actions, such as transferring
        away, changing nameservers and editing domain contact info. \\t\u202F\u202F
        </li>\\n<li>Ultimate Domain Protection: Ultimate Domain Protection includes
        all the benefits of Full Domain Protection, and it also helps keep your domains
        from cancelling unexpectedly because of failed billing by providing a 90 day
        window during which you can manually renew it without being liable to pay
        redemption fees.\u202F\u202F </li>\\n<li>\u202FDomain Ownership Protection:\u202F
        Domain Ownership Protection has the same coverage as our Ultimate Domain Protection
        and was created specifically to support specific domain extensions, as detailed
        here.\u202F </li>\\n</ul>\\n<p>DOMAIN PROTECTION WILL NOT, HOWEVER, PREVENT

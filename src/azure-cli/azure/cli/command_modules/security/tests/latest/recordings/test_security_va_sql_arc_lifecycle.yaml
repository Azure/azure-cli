        'filestream access level', 0; RECONFIGURE;\\nEXECUTE sp_configure 'show advanced
        options', 0; RECONFIGURE;\"],\"automated\":false,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1230\",\"severity\":\"High\",\"category\":\"SurfaceAreaReduction\",\"ruleType\":\"Binary\",\"title\":\"Filestream
        should be disabled\",\"description\":\"FILESTREAM integrates the SQL Server
        Database Engine with an NTFS file system by storing varbinary(max) binary
        large object (BLOB) data as files on the file system. Transact-SQL statements
        can insert, update, query, search, and back up FILESTREAM data. Enabling Filestream
        on SQL server exposes additional NTFS streaming API which increases its attack
        surface and makes it prone to malicious attacks. This rule checks that Filestream
        is disabled.\",\"rationale\":\"The most significant potential for attacking
        an instance is by using features that expose an external interface or ad hoc
        execution capability. Filestream (FS) allows for storage of large blobs on
        the OS as files that are managed by a driver. If FS is not needed, this feature
        must be disabled.\",\"queryCheck\":{\"query\":\"DECLARE @EnableLevel INT\\n\\nEXEC
        master.dbo.xp_instance_regread\\n      N'HKEY_LOCAL_MACHINE',\\n      N'Software\\\\Microsoft\\\\MSSQLServer\\\\MSSQLServer\\\\Filestream',\\n
        \     N'EnableLevel',\\n      @EnableLevel output\\n\\nSELECT CASE\\n    WHEN
        @EnableLevel = 0 \\n        OR EXISTS (SELECT *\\n            FROM   sys.configurations\\n
        \           WHERE  NAME = 'filestream access level'\\n                AND
        Cast(value AS INT) = 0) THEN 0\\n    ELSE 1\\n    END AS [Violation]\",\"expectedResult\":[[\"0\"]],\"columnNames\":[\"Violation\"]},\"benchmarkReferences\":[{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1235\",\"name\":\"VA1235\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1235\",\"status\":\"NonFinding\",\"isTrimmed\":false,\"queryResults\":[[\"False\"]],\"remediation\":{\"description\":\"Disable
        replication XPs on the system\",\"scripts\":[\"EXECUTE sp_configure 'show
        advanced options', 1; RECONFIGURE;\\nEXECUTE sp_configure 'replication xps',
        0; RECONFIGURE;\\nEXECUTE sp_configure 'show advanced options', 0; RECONFIGURE;\"],\"automated\":true,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1235\",\"severity\":\"Medium\",\"category\":\"SurfaceAreaReduction\",\"ruleType\":\"Binary\",\"title\":\"Server
        configuration 'Replication XPs' should be disabled\",\"description\":\"Disable
        the deprecated server configuration 'Replication XPs' to limit the attack
        surface area. This is an internal only configuration setting.\",\"rationale\":\"Enabling
        the replication XPs opens a significant attack surface area that can be used
        by an attacker to gather information about the system and potentially abuse
        the privileges of SQL Server.\",\"queryCheck\":{\"query\":\"SELECT CASE\\n
        \        WHEN EXISTS (SELECT *\\n                      FROM   sys.configurations\\n
        \                     WHERE  NAME = 'replication xps'\\n                             AND
        Cast(value AS INT) = 1) THEN 1\\n         ELSE 0\\n       END AS [Violation]\",\"expectedResult\":[[\"0\"]],\"columnNames\":[\"Violation\"]},\"benchmarkReferences\":[{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1246\",\"name\":\"VA1246\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1246\",\"status\":\"NonFinding\",\"isTrimmed\":false,\"queryResults\":[],\"remediation\":{\"description\":\"Remove
        the application roles. Use users without login as a permission-based replacement\",\"scripts\":[],\"automated\":true,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1246\",\"severity\":\"Low\",\"category\":\"AuthenticationAndAuthorization\",\"ruleType\":\"NegativeList\",\"title\":\"Application
        roles should not be used\",\"description\":\"An application role is a database
        principal that enables an application to run with its own user-like permissions.
        Application roles enable that only users connecting through a particular application
        can access specific data. Application roles are password-based (which applications
        typically hardcode) and not permission based, which exposes the database to
        approle impersonation by password-guessing. This rule checks that no application
        roles are defined in the database.\",\"rationale\":\"It is important to limit
        the possibility of acquiring user-like permissions to the database, and since
        application roles are password based, they can lead to impersonation of the
        application role via password-guessing.\",\"queryCheck\":{\"query\":\"SELECT
        name AS [Role]\\nFROM sys.database_principals\\nWHERE type  = 'A'\",\"expectedResult\":[],\"columnNames\":[\"Role\"]},\"benchmarkReferences\":[{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1247\",\"name\":\"VA1247\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1247\",\"status\":\"NonFinding\",\"isTrimmed\":false,\"queryResults\":[],\"remediation\":{\"description\":\"Remove
        the startup property on the affected modules.\",\"scripts\":[],\"automated\":true,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1247\",\"severity\":\"High\",\"category\":\"SurfaceAreaReduction\",\"ruleType\":\"NegativeList\",\"title\":\"There
        should be no SPs marked as auto-start\",\"description\":\"When SQL Server
        has been configured to 'scan for startup procs', the server will scan master
        DB for stored procedures marked as auto-start. This rule checks that there
        are no SPs marked as auto-start.\",\"rationale\":\"It is recommended to disable
        the 'scan for startup procs', but in case you need to enable it (i.e. for
        replication, or some other reason), keep track of the modules that will be
        loaded automatically to avoid abuse.\",\"queryCheck\":{\"query\":\"SELECT
        NAME AS [Stored Procedure]\\nFROM   sys.procedures\\nWHERE  is_auto_executed
        = 1\",\"expectedResult\":[],\"columnNames\":[\"Stored Procedure\"]},\"benchmarkReferences\":[{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1248\",\"name\":\"VA1248\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1248\",\"status\":\"NonFinding\",\"isTrimmed\":false,\"queryResults\":[],\"remediation\":{\"description\":\"Remove
        user defined roles from fixed-database roles\",\"scripts\":[],\"automated\":false,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1248\",\"severity\":\"Medium\",\"category\":\"AuthenticationAndAuthorization\",\"ruleType\":\"NegativeList\",\"title\":\"User-defined
        database roles should not be members of fixed roles\",\"description\":\"To
        easily manage the permissions in your databases, SQL Server provides several
        roles which are security principals that group other principals. They are
        like groups in the Microsoft Windows operating system. Database accounts and
        other SQL Server roles can be added into database-level roles. Each member
        of a fixed-database role can add other users to that same role. This rule
        checks that no user-defined roles are members of fixed roles\",\"rationale\":\"Adding
        user defined database roles as members of fixed roles could enable unintended
        privilege escalation, also finding any metadata indicating that the fixed
        roles have been modified is typically a sign of data corruption or signs of
        somebody corrupting the metadata in order to hide unusual activity.\",\"queryCheck\":{\"query\":\"SELECT
        user_name(roles.role_principal_id) as [Role], user_name(roles.member_principal_id)
        as [Member]\\nFROM sys.database_role_members AS roles, sys.database_principals
        users\\nWHERE roles.member_principal_id = users.principal_id\\nAND ( roles.role_principal_id
        >= 16384 AND roles.role_principal_id <= 16393)\\nAND users.type = 'R'\",\"expectedResult\":[],\"columnNames\":[\"Role\",\"Member\"]},\"benchmarkReferences\":[{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1256\",\"name\":\"VA1256\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1256\",\"status\":\"NonFinding\",\"isTrimmed\":false,\"queryResults\":[],\"remediation\":{\"description\":\"Drop
        assemblies from the affected databases\",\"scripts\":[],\"automated\":true,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1256\",\"severity\":\"High\",\"category\":\"SurfaceAreaReduction\",\"ruleType\":\"NegativeList\",\"title\":\"User
        CLR assemblies should not be defined in the database\",\"description\":\"CLR
        assemblies can be used to execute arbitrary code on SQL Server process. This
        rule checks that there are no user-defined CLR assemblies in the database\",\"rationale\":\"Using
        CLR assemblies can bring a security flaw to the SQL Server instance and to
        all other network resources accessible from it\",\"queryCheck\":{\"query\":\"SELECT
        name AS [Assembly] FROM sys.assemblies WHERE is_user_defined != 0\",\"expectedResult\":[],\"columnNames\":[\"Assembly\"]},\"benchmarkReferences\":[{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1258\",\"name\":\"VA1258\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1258\",\"status\":\"Finding\",\"isTrimmed\":false,\"queryResults\":[[\"master\",\"sa\"],[\"model\",\"sa\"],[\"msdb\",\"sa\"],[\"tempdb\",\"sa\"]],\"remediation\":{\"description\":\"Keep
        track of database owners. Remove unnecessary database owners to avoid granting
        excessive permissions or update the baseline to reflect the approved list
        of owners.\",\"scripts\":[],\"automated\":false,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1258\",\"severity\":\"High\",\"category\":\"AuditingAndLogging\",\"ruleType\":\"BaselineExpected\",\"title\":\"Database
        owners are as expected\",\"description\":\"Database owners can perform all
        configuration and maintenance activities on the database, and can also drop
        databases in SQL Server. Tracking database owners is important to avoid having
        excessive permission for some principals. Create a baseline which defines
        the expected database owners for the database. This rule checks whether the
        database owners are as defined in the baseline.\",\"rationale\":\"Keeping
        track of database owners is important to avoid granting excessive permissions.\",\"queryCheck\":{\"query\":\"SELECT
        NAME AS [Database],\\n    Suser_sname(owner_sid) AS [Owner]\\nFROM   sys.databases\",\"expectedResult\":[],\"columnNames\":[\"Database\",\"Owner\"]},\"benchmarkReferences\":[{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1264\",\"name\":\"VA1264\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1264\",\"status\":\"Finding\",\"isTrimmed\":false,\"queryResults\":[[\"True\"]],\"remediation\":{\"description\":\"Create
        and enable a new SERVER AUDIT SPECIFICATION that will audit FAILED_LOGIN_GROUP
        & SUCCESSFUL_LOGIN_GROUP events. This SERVER AUDIT SPECIFICATION must target
        a valid SERVER AUDIT object that is enabled.\",\"scripts\":[\"CREATE SERVER
        AUDIT SPECIFICATION [AuditSpec_logon_information_failed_succeessful] FOR SERVER
        AUDIT [<REPLACE WITH VALID AUDIT SPECIFICATION NAME>] ADD (FAILED_LOGIN_GROUP),
        ADD (SUCCESSFUL_LOGIN_GROUP) WITH (STATE = ON);\"],\"automated\":true,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1264\",\"severity\":\"Low\",\"category\":\"AuditingAndLogging\",\"ruleType\":\"Binary\",\"title\":\"Auditing
        of both successful and failed login attempts should be enabled\",\"description\":\"SQL
        Server auditing configuration enables administrators to track the users logging
        into SQL Server instances that they're responsible for. This rule checks that
        auditing is enabled for both successful and failed login attempts.\",\"rationale\":\"Logging
        successful & failed login attempts provides information that can be used to
        detect brute-force based password attacks against the system as well as forensic
        information.\",\"queryCheck\":{\"query\":\"DECLARE @success_logon_event INT
        = 0;\\nDECLARE @fail_logon_event INT = 0;\\n\\nSELECT @success_logon_event
        = Count(*)\\nFROM   sys.server_audits adts,\\n       sys.server_audit_specifications
        srvadtspecs,\\n       sys.server_audit_specification_details srvadtspecdtls\\nWHERE
        \ adts.audit_guid = srvadtspecs.audit_guid\\n       AND adts.is_state_enabled
        = 1\\n       AND srvadtspecs.is_state_enabled = 1\\n       AND srvadtspecdtls.audited_result
        = 'SUCCESS AND FAILURE'\\n       AND srvadtspecdtls.audit_action_id = 'LGSD';\\n\\nSELECT
        @fail_logon_event = Count(*)\\nFROM   sys.server_audits adts,\\n       sys.server_audit_specifications
        srvadtspecs,\\n       sys.server_audit_specification_details srvadtspecdtls\\nWHERE
        \ adts.audit_guid = srvadtspecs.audit_guid\\n       AND adts.is_state_enabled
        = 1\\n       AND srvadtspecs.is_state_enabled = 1\\n       AND srvadtspecdtls.audited_result
        = 'SUCCESS AND FAILURE'\\n       AND srvadtspecdtls.audit_action_id = 'LGFL';\\n\\nDECLARE
        @check_results INT = 0;\\n\\nSELECT CASE\\n         WHEN ( @success_logon_event
        > 0\\n                AND @fail_logon_event > 0 ) THEN 0\\n         ELSE 1\\n
        \      END AS [Violation]\",\"expectedResult\":[[\"0\"]],\"columnNames\":[\"Violation\"]},\"benchmarkReferences\":[{\"benchmark\":\"CIS\",\"reference\":\"v1.0.0-08-11-2017:5.4\"}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1278\",\"name\":\"VA1278\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1278\",\"status\":\"NonFinding\",\"isTrimmed\":false,\"queryResults\":[],\"remediation\":{\"description\":\"Create
        a base for EKM providers being used in the system. Remove old versions of
        providers when no longer needed.\",\"scripts\":[],\"automated\":false,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1278\",\"severity\":\"Medium\",\"category\":\"SurfaceAreaReduction\",\"ruleType\":\"BaselineExpected\",\"title\":\"Create
        a baseline of External Key Management Providers\",\"description\":\"The SQL
        Server Extensible Key Management (EKM) enables third-party EKM / Hardware
        Security Modules (HSM) vendors to register their modules in SQL Server. When
        registered, SQL Server users can use the encryption keys stored on EKM modules.
        This rule displays a list of EKM providers being used in the system.\",\"rationale\":\"External
        Key Management (EKM) Providers are the implementation of various HSM APIs
        to interact with SQL server and encrypt/sign data. Keep a baseline of the
        providers & versions being used in your system\",\"queryCheck\":{\"query\":\"SELECT
        friendly_name AS [Provider Name],\\n       provider_version AS [Provider Version],\\n
        \      guid as [Guid]\\nFROM   sys.dm_cryptographic_provider_properties\",\"expectedResult\":[],\"columnNames\":[\"Provider
        Name\",\"Provider Version\",\"Guid\"]},\"benchmarkReferences\":[{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1279\",\"name\":\"VA1279\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1279\",\"status\":\"Finding\",\"isTrimmed\":false,\"queryResults\":[[\"True\"]],\"remediation\":{\"description\":\"Change
        the ForceEncryption setting on SQL Server Control Manager. For More information
        please visit: https://support.microsoft.com/en-us/help/316898/how-to-enable-ssl-encryption-for-an-instance-of-sql-server-by-using-mi\",\"scripts\":[],\"automated\":false,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1279\",\"severity\":\"High\",\"category\":\"DataProtection\",\"ruleType\":\"Binary\",\"title\":\"Force
        encryption should be enabled for TDS\",\"description\":\"When the Force Encryption
        option for the Database Engine is enabled, all communications between client
        and server is encrypted regardless of whether the 'Encrypt connection' option
        (such as from SSMS) is checked or not. This rule checks that Force Encryption
        option is enabled.\",\"rationale\":\"Connection encryption increases the security
        of data which is transferred across the network between an application and
        SQL Server. Using the force encryption option will guarantee that all connections
        are encrypted.\",\"queryCheck\":{\"query\":\"DECLARE @ForceEncryption INT;\\n\\nEXEC
        master.dbo.xp_instance_regread N'HKEY_LOCAL_MACHINE'\\n    ,N'Software\\\\Microsoft\\\\MSSQLServer\\\\MSSQLServer\\\\SuperSocketNetLib'\\n
        \   ,N'ForceEncryption'\\n    ,@ForceEncryption OUTPUT;\\n\\nSELECT CASE \\n
        \       WHEN @ForceEncryption = 1\\n            OR UnencryptedConnections
        > 0 -- Unencrypted connections will trigger VA1220\\n            THEN 0\\n
        \       ELSE 1\\n        END AS [Violation]\\nFROM (\\n    SELECT COUNT(*)
        AS UnencryptedConnections\\n    FROM sys.dm_exec_connections\\n    WHERE encrypt_option
        != 'TRUE'\\n        AND net_transport != 'Shared memory'\\n    ) t\",\"expectedResult\":[[\"0\"]],\"columnNames\":[\"Violation\"]},\"benchmarkReferences\":[{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1280\",\"name\":\"VA1280\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1280\",\"status\":\"NonFinding\",\"isTrimmed\":false,\"queryResults\":[],\"remediation\":{\"description\":\"Revoke
        any unecessary permissions\",\"scripts\":[],\"automated\":true,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1280\",\"severity\":\"Medium\",\"category\":\"AuthenticationAndAuthorization\",\"ruleType\":\"NegativeList\",\"title\":\"Server
        Permissions granted to public should be minimized\",\"description\":\"Every
        SQL Server login belongs to the public server role. When a server principal
        has not been granted or denied specific permissions on a securable object,
        the user inherits the permissions granted to public on that object. This rule
        checks that server permissions granted to public is minimized.\",\"rationale\":\"Server
        permissions are effective for SQL Server as a whole, and may affect permissions
        in user databases. Keeping the server-scoped permissions granted to public
        at a minimum will significantly reduce the attack surface area.\",\"queryCheck\":{\"query\":\"SELECT
        permission_name AS [Permission],\\n       CASE\\n         WHEN perms.class
        = 101 THEN 'LOGIN'\\n         ELSE class_desc\\n       END             AS
        [Permission Class],\\n       CASE\\n         WHEN perms.class = 100 THEN @@SERVERNAME
        -- SERVER\\n         WHEN perms.class = 101 THEN prins.NAME -- SERVER_PRINCIPAL\\n
        \        WHEN perms.class = 105 THEN ep.NAME -- ENDPOINT\\n       END             AS
        [Object]\\nFROM   sys.server_permissions AS perms\\n       LEFT JOIN sys.endpoints
        AS ep\\n              ON ep.endpoint_id = perms.major_id\\n       LEFT JOIN
        sys.server_principals AS prins\\n              ON prins.principal_id = perms.major_id\\nWHERE
        \ grantee_principal_id = Suser_id('public')\\n       AND NOT (\\n                   (permission_name
        = 'CONNECT' AND perms.class = 105 AND ep.NAME = 'TSQL LOCAL MACHINE') OR\\n
        \                  (permission_name = 'CONNECT' AND perms.class = 105 AND
        ep.NAME = 'TSQL Named Pipes') OR\\n                   (permission_name = 'CONNECT'
        AND perms.class = 105 AND ep.NAME = 'TSQL Default TCP') OR\\n                   (permission_name
        = 'CONNECT' AND perms.class = 105 AND ep.NAME = 'TSQL Default VIA') OR\\n
        \                  (permission_name = 'VIEW ANY DATABASE' AND perms.class
        = 100)\\n               )\",\"expectedResult\":[],\"columnNames\":[\"Permission\",\"Permission
        Class\",\"Object\"]},\"benchmarkReferences\":[{\"benchmark\":\"CIS\",\"reference\":\"v1.0.0-08-11-2017:3.8\"},{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1281\",\"name\":\"VA1281\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1281\",\"status\":\"Finding\",\"isTrimmed\":false,\"queryResults\":[[\"SQLArcExtensionUserRole\",\"NT
        AUTHORITY\\\\SYSTEM\"]],\"remediation\":{\"description\":\"Keep track of role
        membership and remove unnecessary members from roles to avoid granting excessive
        permissions or update baseline to comply with new changes\",\"scripts\":[\"ALTER
        ROLE [SQLArcExtensionUserRole] DROP MEMBER [NT AUTHORITY\\\\SYSTEM]\"],\"automated\":false,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1281\",\"severity\":\"Medium\",\"category\":\"AuditingAndLogging\",\"ruleType\":\"BaselineExpected\",\"title\":\"All
        memberships for user-defined roles should be intended\",\"description\":\"User-defined
        roles are security principals defined by the user to group principals to easily
        manage permissions. Monitoring these roles is important to avoid having excessive
        permissions. Create a baseline which defines expected membership for each
        user-defined role. This rule checks whether all memberships for user-defined
        roles are as defined in the baseline\",\"rationale\":\"Keeping track of role
        memberships is important to avoid granting excessive permissions\",\"queryCheck\":{\"query\":\"SELECT
        user_name(role_principal_id) AS [Role], user_name(member_principal_id) AS
        [Member]\\nFROM sys.database_role_members\\nWHERE role_principal_id NOT IN
        (16384,16385,16386,16387,16389,16390,16391,16392,16393)\",\"expectedResult\":[],\"columnNames\":[\"Role\",\"Member\"]},\"benchmarkReferences\":[{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1283\",\"name\":\"VA1283\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1283\",\"status\":\"Finding\",\"isTrimmed\":false,\"queryResults\":[[\"True\"]],\"remediation\":{\"description\":\"Follow
        the instruction on: https://msdn.microsoft.com/en-us/library/cc280448.aspx\",\"scripts\":[],\"automated\":false,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1283\",\"severity\":\"Low\",\"category\":\"AuditingAndLogging\",\"ruleType\":\"Binary\",\"title\":\"There
        should be at least 1 active audit in the system\",\"description\":\"Auditing
        an instance of the SQL Server Database Engine or an individual database involves
        tracking and logging events that occur on the Database Engine. The SQL Server
        Audit object collects a single instance of server or database-level actions
        and groups of actions to monitor. This rule checks that there is at least
        one active audit in the system.\",\"rationale\":\"Auditing is necessary for
        the analysis of database actions, troubleshooting problems, investigating
        suspicious and malicious activity and can deter users from taking inappropriate
        actions.\",\"queryCheck\":{\"query\":\"SELECT CASE\\n         WHEN ( NOT EXISTS
        (SELECT NAME\\n                            FROM   sys.server_audits\\n                            WHERE
        \ is_state_enabled = 1\\n                                   AND type != 'FL'\\n
        \                           UNION\\n                            SELECT NAME\\n
        \                           FROM   sys.server_file_audits sdtfls\\n                            WHERE
        \ is_state_enabled = 1) ) THEN 1\\n         ELSE 0\\n       END AS [Violation]\",\"expectedResult\":[[\"0\"]],\"columnNames\":[\"Violation\"]},\"benchmarkReferences\":[{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA2020\",\"name\":\"VA2020\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA2020\",\"status\":\"NonFinding\",\"isTrimmed\":false,\"queryResults\":[],\"remediation\":{\"description\":\"Revoke
        permissions from principals where not needed. It is recommended to have at
        most 1 principal granted a specific permission.\",\"scripts\":[],\"automated\":false,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA2020\",\"severity\":\"High\",\"category\":\"AuthenticationAndAuthorization\",\"ruleType\":\"BaselineExpected\",\"title\":\"Minimal
        set of principals should be granted ALTER or ALTER ANY USER database-scoped
        permissions\",\"description\":\"Every SQL Server securable has permissions
        associated with it that can be granted to principals. Permissions can be scoped
        at the server level (assigned to logins and server roles) or at the database
        level (assigned to database users and database roles). These rules check that
        only a minimal set of principals are granted ALTER or ALTER ANY USER database-scoped
        permissions.\",\"rationale\":\"Developing an application using a least-privileged
        user account (LUA) approach is an important part of a defensive, in-depth
        strategy for countering security threats. The LUA approach ensures that users
        follow the principle of least privilege and always log on with limited user
        accounts. Administrative tasks are broken out using fixed server roles, and
        the use of the sysadmin fixed server role is severely restricted. Always follow
        the principle of least privilege when granting permissions to database users.
        Grant the minimum permissions necessary to a user or role to accomplish a
        given task. See https://msdn.microsoft.com/en-us/library/bb669084(v=vs.110).aspx.\",\"queryCheck\":{\"query\":\"SELECT
        perms.class_desc AS [Permission Class]\\n    ,perms.permission_name AS [Permission]\\n
        \   ,type_desc AS [Principal Type]\\n    ,prin.name AS [Principal]\\nFROM
        sys.database_permissions AS perms\\nINNER JOIN sys.database_principals AS
        prin ON perms.grantee_principal_id = prin.principal_id\\nWHERE permission_name
        IN (\\n        'ALTER'\\n        ,'ALTER ANY USER'\\n        )\\n    AND user_name(grantee_principal_id)
        NOT IN (\\n        'guest'\\n        ,'public'\\n        )\\n    AND perms.class
        = 0\\n    AND [state] IN ('G','W')\\n    AND NOT (\\n        prin.type = 'S'\\n
        \       AND prin.name = 'dbo'\\n        AND prin.authentication_type = 1\\n
        \       AND prin.owning_principal_id IS NULL\\n        )\",\"expectedResult\":[],\"columnNames\":[\"Permission
        Class\",\"Permission\",\"Principal Type\",\"Principal\"]},\"benchmarkReferences\":[{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA2103\",\"name\":\"VA2103\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA2103\",\"status\":\"Finding\",\"isTrimmed\":false,\"queryResults\":[[\"xp_dirtree\",\"public\"],[\"xp_fixeddrives\",\"public\"],[\"xp_getnetname\",\"public\"],[\"xp_msver\",\"public\"],[\"xp_sprintf\",\"public\"],[\"xp_sscanf\",\"public\"]],\"remediation\":{\"description\":\"Revoke
        unnecessary EXECUTE permission on extended stored procedure.\",\"scripts\":[\"REVOKE
        EXECUTE ON [xp_dirtree] TO [public]\",\"REVOKE EXECUTE ON [xp_fixeddrives]
        TO [public]\",\"REVOKE EXECUTE ON [xp_getnetname] TO [public]\",\"REVOKE EXECUTE
        ON [xp_msver] TO [public]\",\"REVOKE EXECUTE ON [xp_sprintf] TO [public]\",\"REVOKE
        EXECUTE ON [xp_sscanf] TO [public]\"],\"automated\":true,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA2103\",\"severity\":\"Medium\",\"category\":\"AuthenticationAndAuthorization\",\"ruleType\":\"NegativeList\",\"title\":\"Unnecessary
        execute permissions on extended stored procedures should be revoked.\",\"description\":\"Extended
        stored procedures are DLLs that an instance of SQL Server can dynamically
        load and run. SQL Server is packaged with many extended stored procedures
        that allow for interaction with the system DLLs. This rule checks that unnecessary
        execute permissions on extended stored procedures have been revoked.\",\"rationale\":\"The
        execution of an extended stored procedure has these characteristics:\\nThe
        extended stored procedure function is executed under the security context
        of Microsoft SQL Server.\\nThe extended stored procedure function runs in
        the process space of SQL Server.\\nThe thread associated with the execution
        of the extended stored procedure is the same one used for the client connection.\\n\\nAfter
        the extended stored procedure DLL is loaded, the DLL remains loaded in the
        address space of the server until SQL Server is stopped or the administrator
        explicitly unloads the DLL.\\n\\nBecause extended stored procedures can access
        the server machine, they can be a very powerful tool. But if their access
        is not properly controlled, they can be exploited by an attacker. As such,
        any unnecessary extended stored procedure should be disabled to prevent their
        misuse.\",\"queryCheck\":{\"query\":\"SELECT\\n   Object_name(major_id) AS
        [Stored Procedure],\\n   dpr.NAME AS [Principal] \\nFROM\\n   sys.database_permissions
        AS dp \\n   INNER JOIN\\n      sys.database_principals AS dpr \\n      ON
        dp.grantee_principal_id = dpr.principal_id \\nWHERE\\n   (\\n      major_id
        IN \\n      (\\n         Object_id('xp_dsninfo'),\\n         Object_id('xp_enumdsn'),\\n
        \        Object_id('xp_enumerrorlogs'),\\n         Object_id('xp_eventlog'),\\n
        \        Object_id('xp_getfiledetails'),\\n         Object_id('xp_getnetname')
        \\n      )\\n      OR \\n      (\\n         major_id IN \\n         (\\n            Object_id('xp_availablemedia'),\\n
        \           Object_id('xp_dirtree'),\\n            Object_id('xp_enumerrorlogs'),\\n
        \           Object_id('xp_enumgroups'),\\n            Object_id('xp_fixeddrives'),\\n
        \           Object_id('xp_logevent'),\\n            Object_id('xp_loginconfig'),\\n
        \           Object_id('xp_msver'),\\n            Object_id('xp_sprintf'),\\n
        \           Object_id('xp_sscanf'),\\n            Object_id('xp_subdirs'),\\n
        \           Object_id('xp_servicecontrol') \\n         )\\n         AND dp.grantee_principal_id
        = 0\\n      )\\n   )\\n   AND dp.[type] = 'EX' \\n   AND [state] IN \\n   (\\n
        \     'G',\\n      'W'\\n   )\",\"expectedResult\":[],\"columnNames\":[\"Stored
        Procedure\",\"Principal\"]},\"benchmarkReferences\":[{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA2108\",\"name\":\"VA2108\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA2108\",\"status\":\"NonFinding\",\"isTrimmed\":false,\"queryResults\":[],\"remediation\":{\"description\":\"Remove
        members who should not have access to the database role\",\"scripts\":[],\"automated\":true,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA2108\",\"severity\":\"High\",\"category\":\"AuthenticationAndAuthorization\",\"ruleType\":\"BaselineExpected\",\"title\":\"Minimal
        set of principals should be members of fixed high impact database roles\",\"description\":\"SQL
        Server provides roles to help manage the permissions. Roles are security principals
        that group other principals. Database-level roles are database-wide in their
        permission scope. This rule checks that a minimal set of principals are members
        of the fixed database roles.\",\"rationale\":\"Fixed database roles may have
        administrative permissions on the system. Following the principle of least
        privilege, it is important to minimize membership in fixed database roles
        and keep a baseline of these memberships. See https://docs.microsoft.com/en-us/sql/relational-databases/security/authentication-access/database-level-roles
        for additional information on database roles.\",\"queryCheck\":{\"query\":\"SELECT
        user_name(sr.member_principal_id) AS [Principal]\\n    ,user_name(sr.role_principal_id)
        AS [Role]\\n    ,type_desc AS [Principal Type]\\nFROM sys.database_role_members
        AS sr\\nINNER JOIN sys.database_principals sp ON sp.principal_id = sr.member_principal_id\\nWHERE
        sr.role_principal_id IN (\\n        user_id('bulkadmin'),\\n        user_id('db_accessadmin'),\\n
        \       user_id('db_securityadmin'),\\n        user_id('db_ddladmin'),\\n
        \       user_id('db_backupoperator'))\\n    OR (sr.role_principal_id = user_id('db_owner')\\n
        \       AND sr.member_principal_id <> user_id('dbo'))\",\"expectedResult\":[],\"columnNames\":[\"Principal\",\"Role\",\"Principal
        Type\"]},\"benchmarkReferences\":[{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA2109\",\"name\":\"VA2109\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA2109\",\"status\":\"NonFinding\",\"isTrimmed\":false,\"queryResults\":[],\"remediation\":{\"description\":\"Remove
        members who should not have access to the database role\",\"scripts\":[],\"automated\":true,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA2109\",\"severity\":\"Low\",\"category\":\"AuthenticationAndAuthorization\",\"ruleType\":\"BaselineExpected\",\"title\":\"Minimal
        set of principals should be members of fixed low impact database roles\",\"description\":\"SQL
        Server provides roles to help manage the permissions. Roles are security principals
        that group other principals. Database-level roles are database-wide in their
        permission scope. This rule checks that a minimal set of principals are members
        of the fixed database roles.\",\"rationale\":\"Fixed database roles may have
        administrative permissions on the system. Following the principle of least
        privilege, it is important to minimize membership in fixed database roles
        and keep a baseline of these memberships. See https://docs.microsoft.com/en-us/sql/relational-databases/security/authentication-access/database-level-roles
        for additional information on database roles.\",\"queryCheck\":{\"query\":\"SELECT
        user_name(sr.member_principal_id) as [Principal]\\n    ,user_name(sr.role_principal_id)
        as [Role]\\n    ,type_desc as [Principal Type]\\nFROM sys.database_role_members
        AS sr\\nINNER JOIN sys.database_principals AS sp ON sp.principal_id = sr.member_principal_id\\nWHERE
        sr.role_principal_id IN (\\n        user_id('db_datareader')\\n        ,user_id('db_datawriter')\\n
        \       ,user_id('db_denydatareader')\\n        ,user_id('db_denydatawriter')\\n
        \       )\",\"expectedResult\":[],\"columnNames\":[\"Principal\",\"Role\",\"Principal
        Type\"]},\"benchmarkReferences\":[{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA2110\",\"name\":\"VA2110\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA2110\",\"status\":\"Finding\",\"isTrimmed\":false,\"queryResults\":[[\"xp_instance_regread\",\"NT
        Service\\\\Microsoft Defender For SQL\"],[\"xp_instance_regread\",\"public\"],[\"xp_regread\",\"public\"]],\"remediation\":{\"description\":\"Review
        the list of principals that have permission to execute registry extended stored
        procedures. Revoke execute permissions for principals that should not have
        this permission. Set the remaining principals as a baseline and track that
        changes made to this list are desirable. Note that revoking execute permissions
        to xp_instance_regread and xp_regread will affect applications that use SMO
        library such as SSMS.\",\"scripts\":[\"REVOKE EXECUTE ON [xp_instance_regread]
        TO [NT Service\\\\Microsoft Defender For SQL]\",\"REVOKE EXECUTE ON [xp_instance_regread]
        TO [public]\",\"REVOKE EXECUTE ON [xp_regread] TO [public]\"],\"automated\":true,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA2110\",\"severity\":\"High\",\"category\":\"AuthenticationAndAuthorization\",\"ruleType\":\"BaselineExpected\",\"title\":\"Execute
        permissions to access the registry should be restricted\",\"description\":\"Registry
        extended stored procedures allow Microsoft SQL Server to read, write, and
        enumerate values and keys in the registry. This rule enumerates principals
        with permission to execute registry extended stored procedures.\",\"rationale\":\"The
        registry contains sensitive information, including password hashes as well
        as clear text passwords. Registry extended stored procedures allow Microsoft
        SQL Server to access the machine's registry. The sensitivity of these procedures
        are exacerbated if Microsoft SQL Server is run under the Windows account LocalSystem.
        LocalSystem can read and write nearly all values in the registry, even those
        not accessible by the Administrator. Unlike the xp_cmdshell extended stored
        procedure, which runs under a separate context if executed by a login not
        in the sysadmin role, the registry extended stored procedures always execute
        under the security context of the MSSQLServer service. Because the sensitive
        information is stored in the registry, it is essential that access to that
        information be properly guarded.\",\"queryCheck\":{\"query\":\"SELECT OBJECT_NAME(major_id)
        AS [Stored Procedure]\\n    ,dpr.NAME AS [Principal]\\nFROM sys.database_permissions
        AS dp\\nINNER JOIN sys.database_principals AS dpr ON dp.grantee_principal_id
        = dpr.principal_id\\nWHERE major_id IN (\\n        OBJECT_ID('xp_regaddmultistring')\\n
        \       ,OBJECT_ID('xp_regdeletekey')\\n        ,OBJECT_ID('xp_regdeletevalue')\\n
        \       ,OBJECT_ID('xp_regenumvalues')\\n        ,OBJECT_ID('xp_regenumkeys')\\n
        \       ,OBJECT_ID('xp_regread')\\n        ,OBJECT_ID('xp_regremovemultistring')\\n
        \       ,OBJECT_ID('xp_regwrite')\\n        ,OBJECT_ID('xp_instance_regaddmultistring')\\n
        \       ,OBJECT_ID('xp_instance_regdeletekey')\\n        ,OBJECT_ID('xp_instance_regdeletevalue')\\n
        \       ,OBJECT_ID('xp_instance_regenumkeys')\\n        ,OBJECT_ID('xp_instance_regenumvalues')\\n
        \       ,OBJECT_ID('xp_instance_regread')\\n        ,OBJECT_ID('xp_instance_regremovemultistring')\\n
        \       ,OBJECT_ID('xp_instance_regwrite')\\n        )\\n    AND dp.[type]
        = 'EX'\\n    AND [state] IN ('G','W')\",\"expectedResult\":[],\"columnNames\":[\"Stored
        Procedure\",\"Principal\"]},\"benchmarkReferences\":[{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA2111\",\"name\":\"VA2111\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA2111\",\"status\":\"NonFinding\",\"isTrimmed\":false,\"queryResults\":[],\"remediation\":{\"description\":\"Remove
        the sample database.\",\"scripts\":[],\"automated\":true,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA2111\",\"severity\":\"Low\",\"category\":\"SurfaceAreaReduction\",\"ruleType\":\"NegativeList\",\"title\":\"Sample
        databases should be removed\",\"description\":\"Microsoft SQL Server comes
        shipped with several sample databases. This rule checks whether the sample
        databases have been removed.\",\"rationale\":\"Sample database potentially
        provide additional surface area against which an attack could be made. If
        a security vulnerability exists in a sample database, then the vulnerability
        could possibly be exploited to gain unauthorized access to other databases
        or the server machine. As such, it is recommended that sample databases be
        removed from any production environment.\",\"queryCheck\":{\"query\":\"SELECT
        NAME AS [Database]\\nFROM   sys.databases\\nWHERE  NAME IN ( 'pubs', 'Northwind',
        'AdventureWorks', 'AdventureWorksDW',\\n                 'AdventureWorksAS',
        'WideWorldImporters', 'WideWorldImportersDW' )\",\"expectedResult\":[],\"columnNames\":[\"Database\"]},\"benchmarkReferences\":[{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA2114\",\"name\":\"VA2114\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA2114\",\"status\":\"Finding\",\"isTrimmed\":false,\"queryResults\":[[\"sysadmin\",\"MIDDLEEAST\\\\ggoldshtein\"]],\"remediation\":{\"description\":\"Remove
        members who should not have access to fixed server roles.\",\"scripts\":[\"ALTER
        SERVER ROLE [sysadmin] DROP MEMBER [MIDDLEEAST\\\\ggoldshtein]\"],\"automated\":true,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA2114\",\"severity\":\"High\",\"category\":\"AuthenticationAndAuthorization\",\"ruleType\":\"BaselineExpected\",\"title\":\"Minimal
        set of principals should be members of fixed server roles\",\"description\":\"SQL
        Server provides roles to help manage permissions. Roles are security principals
        that group other principals. Server-level roles are server-wide in their permission
        scope. This rule checks that a minimal set of principals are members of the
        fixed server roles.\",\"rationale\":\"Fixed server roles typically have administrative
        permissions on the system. Following the principle of least privilege, it
        is important to minimize membership in fixed server roles and keep a baseline
        of these memberships. See https://docs.microsoft.com/en-us/sql/relational-databases/security/authentication-access/server-level-roles
        for additional information on server roles.\",\"queryCheck\":{\"query\":\"SELECT\\n
        \  Suser_name(sr.role_principal_id) AS [Role],\\n   sp.NAME AS [Principal]
        \\nFROM\\n   sys.server_role_members AS sr \\n   INNER JOIN\\n      sys.server_principals
        sp \\n      ON sp.principal_id = sr.member_principal_id \\nWHERE\\n   sr.role_principal_id
        IN \\n   (\\n      Suser_id('sysadmin'),\\n      suser_id('serveradmin'),\\n
        \     suser_id('setupadmin'),\\n      suser_id('processadmin'),\\n      suser_id('diskadmin'),\\n
        \     suser_id('dbcreator'),\\n      suser_id('bulkadmin') \\n   )\\n   AND
        sp.principal_id != 1 \\n   AND NOT ( ( sr.role_principal_id = 3 \\n   AND
        sp.NAME = 'NT SERVICE\\\\SQLWriter' ) \\n   OR \\n   (\\n      sr.role_principal_id
        = 3 \\n      AND sp.NAME = 'NT SERVICE\\\\Winmgmt' \\n   )\\n   OR \\n   (\\n
        \     sr.role_principal_id = 3 \\n      AND sp.NAME = 'NT Service\\\\MSSQLSERVER'
        \\n   )\\n   OR \\n   (\\n      sr.role_principal_id = 3 \\n      AND sp.NAME
        = 'NT SERVICE\\\\SQLSERVERAGENT' \\n   )\\n   OR \\n   (\\n      sr.role_principal_id
        = 3 \\n      AND sp.NAME = 'NT Service\\\\SQLIaaSExtension' \\n   )\\n   OR
        \\n   (\\n      sr.role_principal_id = 3 \\n      AND sp.NAME = 'NT Service\\\\HealthService'
        \\n   )\\n   OR \\n   (\\n      sr.role_principal_id = 3 \\n      AND sp.NAME
        = 'NT Service\\\\MSSQL' + ISNULL('$' + convert(sysname, serverproperty('InstanceName')),
        '') \\n   )\\n   OR \\n   (\\n      sr.role_principal_id = 3 \\n      AND
        sp.NAME = 'NT SERVICE\\\\SQLAgent' + ISNULL('$' + convert(sysname, serverproperty('InstanceName')),
        '') \\n   )\\n   OR \\n   (\\n      sr.role_principal_id = 3 \\n      AND
        sp.NAME LIKE '%\\\\replAgentUser'\\n      AND sp.type = 'U'\\n      AND SERVERPROPERTY('EngineEdition')
        = 8\\n   )\\n   OR \\n   (\\n      sr.role_principal_id = 3 \\n      AND sp.NAME
        LIKE '%\\\\sqlAgentUser'\\n      AND sp.type = 'U'\\n      AND SERVERPROPERTY('EngineEdition')
        = 8\\n   )           \\n)\",\"expectedResult\":[],\"columnNames\":[\"Role\",\"Principal\"]},\"benchmarkReferences\":[{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA2120\",\"name\":\"VA2120\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA2120\",\"status\":\"Finding\",\"isTrimmed\":false,\"queryResults\":[[\"remote
        access\"]],\"remediation\":{\"description\":\"Disable the features.\",\"scripts\":[\"EXECUTE
        sp_configure 'show advanced options', 1; RECONFIGURE WITH OVERRIDE;\\nEXECUTE
        sp_configure 'remote access', 0; RECONFIGURE;\\nEXECUTE sp_configure 'show
        advanced options', 0; RECONFIGURE;\"],\"automated\":true,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA2120\",\"severity\":\"High\",\"category\":\"SurfaceAreaReduction\",\"ruleType\":\"NegativeList\",\"title\":\"Features
        that may affect security should be disabled\",\"description\":\"SQL Server
        is capable of providing a wide range of features and services. Some of the
        features and services, provided by default, may not be necessary, and enabling
        them could adversely affect the security of the system. This rules checks
        that these features are disabled.\",\"rationale\":\"The more SQL Server features
        and services you enable, the larger its surface attack area becomes, making
        your system more vulnerable to potential attacks. These fetures should be
        disabled unless it is absolutely needed in this environment.\",\"queryCheck\":{\"query\":\"SELECT
        NAME AS [Feature]\\nFROM   sys.configurations\\nWHERE  NAME IN ( 'allow updates',
        'cross db ownership chaining',\\n                 'contained database authentication',
        'remote access')\\n       AND Cast(value AS INT) = 1\",\"expectedResult\":[],\"columnNames\":[\"Feature\"]},\"benchmarkReferences\":[{\"benchmark\":\"CIS\",\"reference\":\"v1.0.0-08-11-2017:2.3\"},{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA2121\",\"name\":\"VA2121\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA2121\",\"status\":\"NonFinding\",\"isTrimmed\":false,\"queryResults\":[[\"False\"]],\"remediation\":{\"description\":\"Disable
        the feature 'OLE Automation Procedures'\",\"scripts\":[\"EXECUTE sp_configure
        'show advanced options', 1; RECONFIGURE;\\nEXECUTE sp_configure 'ole automation
        procedures', 0; RECONFIGURE;\\nEXECUTE sp_configure 'show advanced options',
        0; RECONFIGURE;\"],\"automated\":true,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA2121\",\"severity\":\"High\",\"category\":\"SurfaceAreaReduction\",\"ruleType\":\"Binary\",\"title\":\"'OLE
        Automation Procedures' feature should be disabled\",\"description\":\"SQL
        Server is capable of providing a wide range of features and services. Some
        of the features and services, provided by default, may not be necessary, and
        enabling them could adversely affect the security of the system.\\nThe OLE
        Automation Procedures option controls whether OLE Automation objects can be
        instantiated within Transact-SQL batches. These are extended stored procedures
        that allow SQL Server users to execute functions external to SQL Server.\\nRegardless
        of its benefits it can also be used for exploits, and is known as a popular
        mechanism to plant files on the target machines. It is advised to use Powershell
        as a replacement for this tool.\\nThis rule checks that 'OLE Automation Procedures'
        feature is disabled.\",\"rationale\":\"The more SQL Server features and services
        you enable, the larger its surface attack area becomes, making your system
        more vulnerable to potential attacks.\\nIf this feature is enabled, users
        will be allowed to execute functions in the security context of SQL Server.\",\"queryCheck\":{\"query\":\"SELECT
        CASE\\n         WHEN EXISTS (SELECT *\\n                      FROM   sys.configurations\\n
        \                     WHERE  NAME = 'ole automation procedures'\\n                             AND

        on when you attempt to recover the domain\u2014in many cases, the fee increases
        later on in the redemption period to reflect additional costs we incur from
        the Registry.\u202F </p>\\n</p>\\n        <p><p><strong>(C) FREE PRODUCT TERMS</strong></p>\\n<p>In
        the event you are provided with free products with the registration of a domain

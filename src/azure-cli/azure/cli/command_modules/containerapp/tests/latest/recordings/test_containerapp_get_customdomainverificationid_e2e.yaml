        conflict between the provisions of this Agreement and the TLD registry terms,
        the TLD registry terms shall apply. Visit our Help Center for more information
        about the standard expiration timelines, TLD exclusions and exceptions.\u202F\u202F
        </p>\\n<p><strong>If a domain expires and a registrant does not take advantage
        of any Renewal Grace Period or Redemption Grace Period that may apply (or

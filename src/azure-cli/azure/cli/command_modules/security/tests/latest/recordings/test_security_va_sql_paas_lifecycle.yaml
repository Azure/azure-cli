  response:
    body:
      string: '{"value":[{"id":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/cli_test_va_sql_paas_000001/providers/Microsoft.Sql/servers/vasqlsrv000002/sqlServers/vasqlsrv000002/databases/vasqldb000003/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/aa735d1b-92ce-42f9-adc6-ef1806a65e0d/scanResults/VA1020","name":"VA1020","type":"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults","properties":{"ruleId":"VA1020","status":"NonFinding","isTrimmed":false,"queryResults":[],"remediation":{"description":"Remove
        the special user GUEST from all roles.","scripts":[],"automated":true,"portalLink":""},"baselineAdjustedResult":null,"ruleMetadata":{"ruleId":"VA1020","severity":"High","category":"AuthenticationAndAuthorization","ruleType":"NegativeList","title":"Database
        user GUEST should not be a member of any role","description":"The guest user
        permits access to a database for any logins that are not mapped to a specific
        database user. This rule checks that no database roles are assigned to the
        Guest user.","rationale":"Database Roles are the basic building block at the
        heart of separation of duties and the principle of least permission. Granting
        the Guest user membership to specific roles defeats this purpose.","queryCheck":{"query":"SELECT
        roles.[name] AS [Role]\nFROM sys.database_role_members AS drms\nINNER JOIN
        sys.database_principals AS roles ON drms.role_principal_id = roles.principal_id\nINNER
        JOIN sys.database_principals AS users ON drms.member_principal_id = users.principal_id\nWHERE
        users.[name] = ''guest''","expectedResult":[],"columnNames":["Role"]},"benchmarkReferences":[{"benchmark":"FedRAMP","reference":null}]}}},{"id":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/cli_test_va_sql_paas_000001/providers/Microsoft.Sql/servers/vasqlsrv000002/sqlServers/vasqlsrv000002/databases/vasqldb000003/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/aa735d1b-92ce-42f9-adc6-ef1806a65e0d/scanResults/VA1054","name":"VA1054","type":"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults","properties":{"ruleId":"VA1054","status":"NonFinding","isTrimmed":false,"queryResults":[],"remediation":{"description":"Revoke
        unnecessary permissions granted to PUBLIC","scripts":[],"automated":false,"portalLink":""},"baselineAdjustedResult":null,"ruleMetadata":{"ruleId":"VA1054","severity":"Low","category":"AuthenticationAndAuthorization","ruleType":"NegativeList","title":"Excessive
        permissions should not be granted to PUBLIC role on objects or columns","description":"Every
        SQL Server login belongs to the public server role. When a server principal
        has not been granted or denied specific permissions on a securable object,
        the user inherits the permissions granted to public on that object. This rule
        displays a list of all securable objects or columns that are accessible to
        all users through the PUBLIC role.","rationale":"Database Roles are the basic
        building block at the heart of separation of duties and the principle of least
        permission. Granting permissions to principals through the default PUBLIC
        role defeats this purpose.","queryCheck":{"query":"SELECT permission_name
        AS [Permission]\n ,schema_name AS [Schema]\n ,object_name AS [Object]\nFROM
        (\n    SELECT objs.TYPE COLLATE database_default AS object_type\n        ,schema_name(schema_id)
        COLLATE database_default AS schema_name\n        ,objs.name COLLATE database_default
        AS object_name\n        ,user_name(grantor_principal_id) COLLATE database_default
        AS grantor_principal_name\n        ,permission_name COLLATE database_default
        AS permission_name\n        ,perms.TYPE COLLATE database_default AS TYPE\n        ,STATE
        COLLATE database_default AS STATE\n FROM sys.database_permissions AS perms\n
        INNER JOIN sys.objects AS objs\n ON objs.object_id = perms.major_id\n  WHERE
        perms.class = 1 -- objects or columns. Other cases are handled by VA1095 which
        has different remediation syntax\n  AND grantee_principal_id = DATABASE_PRINCIPAL_ID(''public'')\n  AND

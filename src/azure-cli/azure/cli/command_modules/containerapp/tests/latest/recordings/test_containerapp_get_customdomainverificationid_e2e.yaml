        Act 1974.</p>\\n</p>\\n        <p><p><strong><em>(B) PROVISIONS SPECIFIC TO
        .CA REGISTRATIONS</em></strong><br />\\nYou acknowledge and agree that registration
        of your selected domain name in your first application to CIRA shall not be
        effective until you have entered into and agreed to be bound by CIRA's Registrant
        Agreement. <br />\\n<br />\\n<u><em>CIRA Certified Registrar</em></u>.  The
        registrar shall immediately give notice to you in the event that it is no
        longer a CIRA Certified Registrar, has had its certification as a CIRA Certified
        Registrar suspended or terminated, or the Registrar Agreement between CIRA
        and the Registrar is terminated or expires. CIRA may post notice of such suspension,
        termination, or expiry on its website and may, if CIRA deems appropriate,
        give notice to the registrants thereof. In the event that the registrar is
        no longer a CIRA Certified Registrar, has had its certification as a CIRA
        Certified Registrar suspended or terminated or in the event the Registrar
        Agreement between CIRA and the Registrar is terminated or expires, you shall
        be responsible for changing your Registrar of Record to a new CIRA Certified
        Registrar within thirty (30) days of the earlier of notice thereof being given
        to you by (i) the Registrar or (ii) CIRA in accordance with CIRA's then current
        Registry PRP; provided, however, that if any of your domain name registrations
        are scheduled to expire within thirty (30) days of the giving of such notice,
        then you shall have thirty (30) days from the anniversary date of the registration(s),
        to register with a new CIRA certified registrar and to renew such domain name
        registration(s) in accordance with the Registry PRP.<br />\\n<br />\\nYou
        acknowledge and agree that should there be insufficient funds prepaid by the
        registrar in the CIRA Deposit Account to be applied in payment of any fees,
        CIRA may in its sole discretion stop accepting applications for domain name
        registrations from the registrar, stop effecting registrations of domain names
        and transfers, renewals, modifications, and cancellations requested by the
        registrar and stop performing other billable transactions requested by the
        registrar not paid in full and CIRA may terminate the Registrar Agreement
        between CIRA and the Registrar.<br />\\n<br />\\n<u><em>.CA ASCII and IDN
        domain variants</em></u> are bundled and reserved for a single registrant.
        \ Registrants are not required to register all variants in a bundle, but all
        registered variants must be registered and managed at a single registrar.
        Each variant registered will incur a registration fee.  In addition, when
        registering multiple .CA domain (ASCII and IDN) variants in a bundle, your
        registrant information <strong><em>must be identical</em></strong>.  If variants
        are registered at other registrars or if registrant information does not match,
        it may result in an &quot;unavailable&quot; search result, delayed or failed
        registration. If information does not match, validation is required and may
        take up to seven business days and delay availability of domain.</p>\\n</p>\\n
        \       <p><p><strong><em>(C) PROVISIONS SPECIFIC TO .CN REGISTRATIONS</em></strong><br
        />\\n.CN is a restricted TLD \u2013 applications are subject to both a domain
        name check <strong><em>and</em></strong> real name verification as required
        by the People\u2019s Republic of China.  Registrations in .CN are therefore
        subject to the following additional terms:</p>\\n<p><u><em>Verification, Registration
        and Activation</em></u>.  If a domain name is not permitted to be registered
        by the Chinese government, as determined by us, the Registry Operator and/or
        a 3rd party provider utilized for such services and determinations, in either
        party\u2019s discretion, the application for registration will not be successful.
        \ In such event, the name will be deleted and you will be eligible for a refund
        as further described below.</p>\\n<p>If permitted, then the Registration may
        proceed, but a .CN domain name may not be activated (i.e., it will not resolve
        in the Internet) <u><em>unless and until</em></u> you have submitted (via
        the process described during registration) valid documents required of us
        and the Registry to perform real name verification.  The following are acceptable
        forms of documents for the purpose of verification:\\r\\n</p>\\n<ul><li>China:
        Resident ID, temporary resident ID, business license or organization code
        certificate</li>\\r\\n\\r\\n<li>Hong Kong/Macau: Resident ID, driver\u2019s
        license, passport or business license</li>\\r\\n\\r\\n<li>Singapore: Driver\u2019s
        license, passport or business license</li>\\r\\n\\r\\n<li>Taiwan: Resident
        ID, driver\u2019s license or business license</li>\\r\\n\\r\\n<li>Other Countries/Regions:
        Driver\u2019s license or passport</li></ul>\\r\\n<p>Documents submitted to
        us are used by us and shared with the Registry solely for the purpose of real
        name verification, and are otherwise subject to our <a href=\\\"https://www.secureserver.net/legal/agreements/privacy-policy?prog_id=510456&pl_id=510456&plid=510456\\\">Privacy
        Policy</a>.  By registering a .CN domain, you expressly agree that your data
        may be stored on servers in the U.S., or otherwise outside of the People's
        Republic of China.</p>\\n<p><u><em>Refunds</em></u>.  Refunds for .CN Registrations
        will only be allowed where (i) registration of the applied for domain name
        is not permitted by the Chinese government; or (ii) you notify us of your
        intent to cancel for any reason within the first five (5) days after the Registration
        (i.e., after it is deemed permissible by the Chinese government).  For the
        avoidance of doubt, refunds will not be permitted under any circumstances
        after five (5) days from the date of Registration, including, for example,
        in the event real name verification is not successful or if the Chinese government
        determines after Registration that the domain name should not have been registered
        (and directs us to delete).</p>\\n</p>\\n        <p><p><strong><em>(D) PROVISIONS
        SPECIFIC TO .IN REGISTRATIONS</em></strong></p>\\n<p>.IN domain name registrations
        are subject to the rules, policies, procedures, and requirements of the .IN
        Registry and the National Internet Exchange of India (\u201CNIXI\u201D), including
        mandatory electronic Know Your Customer (\u201Ce-KYC\u201D), contact verification,
        and anti-abuse requirements. </p>\\n<ul>\\n<li>By registering, renewing, transferring,
        updating, or maintaining a .IN domain name, you agree to provide accurate,
        authentic, and verifiable identification information, contact information,
        and supporting documentation requested by GoDaddy, the .IN Registry, or NIXI.
        You must complete required e-KYC procedures and provide any required e-KYC
        verification acknowledgement within the timeframe required by the .IN Registry.
        You also agree that you may be required to verify your email address and designated
        contact number. GoDaddy may collect, retain, verify, and provide such information
        and documentation to the .IN Registry or NIXI upon request.</li>\\n<li>If
        you are located outside India, you may be required to demonstrate a legitimate
        business connection or purpose connected to India by submitting a signed declaration
        or other information requested by GoDaddy, the .IN Registry, or NIXI.</li>\\n<li>You
        must not use a temporary email address or other email service prohibited by
        the .IN Registry during registration or at any time during the lifecycle of
        the domain name. You must not register or attempt to register a .IN domain
        name through a virtual private network (\u201CVPN\u201D).</li>\\n<li>GoDaddy
        and/or the .IN Registry may reject, suspend, place on hold, cancel, delete,
        transfer, lock, or otherwise make unavailable any .IN domain name if required
        information, documentation, verification, or declarations are not provided,
        are inaccurate or unverifiable, or if Registry requirements are not satisfied.
        </li>\\n</ul>\\n</p>\\n        <p><p><strong><em>(E) PROVISIONS SPECIFIC TO
        .JP REGISTRATIONS</em></strong>  <br />\\n<u><em>Registration Restrictions</em></u>.
        \ You represent and warrant that you have a local presence in Japan with a
        home or office address. You agree that certain domain names are reserved and
        can only be registered by certain parties. These include: (i) TLDs, other
        than ccTLDs, as determined by ICANN; (ii) geographical-type .JP domain names
        that are defined as metropolitan, prefectural, and municipal labels; (iii)
        names of primary and secondary educational organizations; (iv) names of organizations
        related to Internet management; (v) names required for .JP domain name operations;
        and (vi) character strings which may be confused with ASCII-converted Japanese
        domain names. The complete list of .JP Reserved Domains is available <a href=\\\"https://www.nic.ad.jp/dotjp/doc/dotjp-reserved.html\\\">here</a>.
        </p>\\n</p>\\n            <strong><strong>19. PROVISIONS SPECIFIC TO LEASE
        TO OWN</strong></strong>\\n\\n\\n        <p><p>The following additional Terms
        apply with respect to Lease to Own Services (the \u201CLTO Services\u201D)
        provided by Azure, to you.</p>\\n<p><strong>(A) Definitions:</strong></p>\\n<ul>\\n<li><strong>Down
        Payment</strong>: an optional upfront portion of the purchase price that Buyer
        must pay, if applicable, upon entering into the LTO transaction, before the
        remaining monthly payments become due.  \\n</li>\\n<li><strong>LTO Domain</strong>:
        a domain name that you purchase from Azure through the Site with an agreement
        to pay over time.</li>\\n<li><strong>LTO Term</strong>: the period agreed
        between Azure and Buyer during which Buyer will have access to the DNS and,
        after payment of any applicable Down Payment, will make monthly payments to
        Azure.</li>\\n<li><strong>Service Fee</strong>: fee owed by Buyer to Azure
        for the Services provided by Azure during the LTO Term, including, but not
        limited to, renewing the LTO Domain, providing administrative services related
        to the management of the LTO Domain, forwarding correspondence, etc.</li>\\n</ul>\\n</p>\\n
        \       <p><p><strong>(B) Description of Services.</strong> </p>\\n<p>The
        LTO Services are provided to facilitate the buying and selling of currently
        registered domain names through payments over time, and not the purchase or
        sale of associated website content.</p>\\n<p>As Buyer, you agree to purchase
        the LTO Domain from Azure. During the LTO Term, Azure will make the DNS for
        the LTO Domain available to Buyer. You are required to make the first payment
        due under the LTO transaction, consisting of either the applicable Down Payment
        or, if no Down Payment applies, the first monthly payment, together with any
        applicable Service Fee, as established by Azure, as soon as practical after
        you agree to the purchase price, but in no event later than five (5) business
        days. At no time will Buyer be able to withdraw those funds or send the funds
        to another recipient unless the initial transaction is cancelled. You agree
        that Azure is not responsible for breach of contract based upon a failure
        to transfer the LTO Domain to Buyer after the first payment is received. In
        the event that Azure is unable to make the LTO Domain DNS available to Buyer
        after the first payment, Azure shall return any funds paid by Buyer for the
        purchase of the LTO Domain as soon as commercially practicable.</p>\\n</p>\\n
        \       <p><p><strong>(C) Fees and Payment.</strong></p>\\n<p>You are responsible
        for paying any applicable Down Payment and each monthly payment related to
        your LTO Domain, together with, any applicable Service Fee.</p>\\n</p>\\n
        \       <p><p><strong>(D) Your Additional Obligations.</strong></p>\\n<ol><li>Buyer
        agrees to use the LTO Domain only in accordance with any applicable laws and/or
        regulations, and with all duty and care. For the avoidance of doubt, Buyer
        is prohibited from using the LTO Domain in a manner (as determined by Azure
        in its sole and absolute discretion) that:<ol type=a><li>in breach of any
        applicable law, statute, or regulation;</li><li>is fraudulent, criminal or
        unlawful;</li><li>promotes racism, bigotry, hatred or physical harm of any
        kind against any group or individual;</li><li>infringes or breaches the patent,
        copyright, trademark, trade secret, right of publicity or other intellectual
        property) rights of any third party;</li><li>contains video, audio photographs,
        or images of another person without his or her permission (or in the case
        of a minor, the minor's legal guardian\u2019s permission);</li><li>provides
        information on any illegal activity (including, but not limited to, instructional
        information on acquiring or fabricating illegal weapons or drugs, privacy
        violations or distributing computer viruses);</li><li>publicizes or promotes
        commercial activities an/or sales without our prior written consent such as
        contests, sweepstakes, barter, advertising, and pyramid schemes; or</li><li>involves
        the use, delivery or transmission of any viruses, harmful code, unsolicited
        emails, Trojan horses or any other computer programming routines that are
        intended to disrupt, damage, detrimentally interfere with, surreptitiously
        intercept or expropriate any system, data or personal information.</li></ol></li><li>Buyer
        acknowledges and agrees not to engage in any activity with the LTO Domain
        or using the LTO Services that would decrease the value of the LTO Domain.
        Such activities include, but are not limited to, the use of aggressive SEO
        strategies, techniques and tactics that focus only on search engines and not
        a human audience, and usually does not obey search engines guidelines (black
        hat SEO), such as keyword stuffing, invisible text, doorway pages, adding
        unrelated keywords to the page content or page swapping (changing the webpage
        entirely after it has been ranked by search engines), and the use of the domain
        name for spam activities.</li><li>Buyer may not grant any third party any
        rights to the LTO Domain, including any right to use the LTO Domain.</li><li>\\tBuyer
        agrees to protect, defend, indemnity and hold harmless Azure and its officers,
        directors, employees, agents and third party service providers from and against
        any and all claims, demands, costs, expenses, losses liabilities and damages
        of every kind and nature (including, without limitation, reasonable attorneys\u2019
        fees) imposed upon or incurred by Azure directly or indirectly arising from
        (i) your use of the LTO Services; (ii) your violation(s) of any provision
        of this Agreement; and/or (iii) your violation of any third party right, including
        without limitation any intellectual property or other proprietary right. This
        indemnification obligation shall survive any termination or expiration of
        this Agreement or your use of the LTO Services.</li></ol>\\r\\n</p>\\n        <p><p><strong>E.
        Azure\u2019s Rights.</strong></p>\\n<ol>\\n<li>Azure may terminate your use
        of the LTO Services for any violation or breach of any of the terms of this
        Agreement by you. Any such termination will not entitle you to any refund
        of payments already made to Azure for any LTO Services or Service Fee, and
        you will lose any and all access to the applicable LTO Domain.</li>\\n<li>If
        the LTO Services are terminated, Buyer will have no further rights under the
        terminated LTO transaction with respect to the LTO domain. Azure shall have
        no ongoing obligation to Buyer related to the LTO Domain.</li>\\n<li>The parties
        acknowledge and agree that Azure is not a payment provider and that Azure
        does not make any warranties in that respect. In order to effectuate the transfer
        of payments, Azure uses the services of a third-party payment provider. The
        terms and conditions of the third-party payment provider shall apply to such
        payments.</li>\\n</ol>\\n</p>\\n        <p><p><strong>F. Remedies and Right
        to Cancel.</strong></p>\\n<p>Without limiting any other remedies available
        to Azure, if:</p>\\n<ol type=A><li>You breach this Agreement, or any document
        incorporated by reference;</li><li>Azure determines your actions may pose
        a risk to Azure or its members;</li><li>Azure determines your use of the Services
        infringes on the intellectual property or legal rights of others.</li></ol>\\r\\n<p>Azure
        may immediately:</p>\\n<ol type=i><li>Warn its members of your actions;</li><li>Place
        a hold on any pending transactions associated with your account(s);</li><li>Limit
        funding sources and payments;</li><li>Limit your access to your account(s)
        or to any functionality of your account(s); or</li><li>Indefinitely suspend
        or close your account(s) and refuse to provide our Services to you.</li></ol><p></li></ol></p>\\n<p>In
        addition, Azure reserves the right to hold funds beyond normal distribution
        periods for transactions it deems suspicious or for account(s) conducting
        high transaction volumes to ensure integrity of the funds. If Azure closes
        your account(s), Azure will provide notice and pay you all of the unrestricted
        funds in your account(s) due to you.</p>\\n</p>\\n            <strong><strong>20.
        PROVISIONS SPECIFIC TO DOMAIN RESERVE</strong></strong>\\n\\n\\n  <p><p>The
        following additional Terms apply if you purchase or use Domain Reserve. You
        represent and warrant that You are the registered domain name holder of the
        exact match original domain name to purchase the associated Domain Reserve.
        You agree and acknowledge that: </p>\\n<ol>\\n<li>You will comply with the
        Brand Safety Alliance LLC (\u201CBSA\u201D) Terms of Use and Policies with
        respect to Domain Reserve, with its own limitations and restrictions, which
        are set out <a href=\\\"https://globalblock.co/policies/\\\">here</a>.  \\n</li>\\n<li>You
        will not, through your use of Domain Reserve, knowingly infringe or frustrate
        the intellectual property rights of any other person or entity, or use Domain
        Reserve for any abusive purpose.\u202F </li>\\n<li>The included extensions
        in Domain Reserve may change from time to time. The complete list of current
        extensions included in Domain Reserve is: .biz, .design, .club, .vip, .us,
        .wiki, .luxe, .photo, .info,.surf, .reviews, .digital, .media, .news, .email,
        .support, .social, .bio, .global, .work. Certain labels within those included
        extensions may not be available for inclusion in Domain Reserve. </li>\\n<li>Domains
        in Domain Reserve do not resolve and cannot be used for email or websites.
        </li>\\n<li>Your Domain Reserve cannot be transferred to another account or
        registrar.  \\n</li>\\n<li>After purchase, Domain Reserve and the associated
        exact match original domain can each respectively be canceled separately without
        affecting the other product or service. </li>\\n<li>\\nNotwithstanding anything
        to the contrary in our Refund Policy, and Your statutory rights are not affected:
        \\n<ol>\\n<li>New purchases of Domain Reserve:\u202FNon-refundable. </li>\\n<li>Manual
        renewals of Domain Reserve:\u202FNon-refundable. </li>\\n<li>Auto-renewals
        of Domain Reserve:\u202FRenewal fees are non-refundable\u202Fafter the expiration
        date. </li>\\n</ol>\\n</li>\\n<li>Domain Reserve may be purchased for 1-year
        increments up to a 10-year period. </li>\\n<li>There is currently no ability
        to request that a specific domain name that is included in your Domain Reserve
        be made available for your use (registration). You must comply with all applicable
        TLD registration requirements and policies.  \\n</li>\\n<li>Another party
        that holds a verified Right (for example, a registered trademark) that exactly
        matches the label of your original domain name may place an order for GlobalBlock
        Services for that Right even after you place your Domain Reserve order. If
        the same label is blocked by more than one party, the domain name cannot be
        released for registration unless all such parties consent. If any party withholds
        consent, the issue may be taken to dispute proceedings under the <a href=\\\"https://globalblock.co/policies/\\\">GlobalBlock
        Dispute Resolution Policy</a>.  \\n</li>\\n<li>\\nWe reserve the right to:
        \\n<ol>\\n<li>restrict, suspend or terminate your Domain Reserve order or
        Your Services if You or Your account is found to be in violation of this Agreement,
        including these Provisions specific to Domain Reserve. </li>\\n<li>take any
        action that We deem necessary, in our sole discretion, to protect the integrity
        and stability of Domain Reserve, comply with any applicable laws, government
        rules or requirements, law enforcement requests, BSA Policies or any dispute
        resolution policies, or correct mistakes made by Us, any authorized user or
        any of our service providers in connection with the provision of Domain Reserve.
        \ \\n</li>\\n</ol>\\n</li>\\n<li>Azure and BSA make no representations or
        warranties regarding Domain Reserve and expressly disclaim all liability for
        any damages (direct, indirect, or consequential) arising from your use of
        Domain Reserve or from taking action in accordance with BSA Policies. </li>\\n</ol>\\n</p>\\n</div>\\n\",\"url\":\"http://www.secureserver.net/agreements/ShowDoc.aspx?pageid=reg_sa&pl_id=510456\"},{\"agreementKey\":\"DNPA\",\"title\":\"Domains
        by Proxy Agreement\",\"content\":\"\\n<style>.vsc-legal-content-module .lcm-title{margin-top:2.5rem;margin-bottom:1rem}.vsc-legal-content-module
        .lcm-subtitle{margin-bottom:1rem}.vsc-legal-content-module .paragraph{margin-top:0;margin-bottom:1rem}.vsc-legal-content-module
        .lcm-numbered-list ul>ol{list-style:circle inside}.vsc-legal-content-module
        .lcm-numbered-list ol{counter-reset:section;list-style:none;padding-left:0}.vsc-legal-content-module
        .lcm-numbered-list ol>li{display:block;list-style:none}.vsc-legal-content-module
        .lcm-numbered-list ol>li:before{content:counters(section,\\\".\\\") \\\" \\\";counter-increment:section}.vsc-legal-content-module
        .lcm-numbered-list ol>li.lcm-embed{list-style:none}.vsc-legal-content-module
        .lcm-numbered-list ol>li.lcm-embed:before{content:none;counter-increment:none}</style>\\n\\n<div
        id=\\\"id-fc86ff53-d1e8-4ffa-8551-77fd27f0b3ce\\\" class=\\\"vsc-legal-content-module\\\"
        \ data-track-name=\\\"5428\\\" data-track-promo-click data-track-promo-id=\\\"fc86ff53-d1e8-4ffa-8551-77fd27f0b3ce\\\">\\n
        \ <div class=\\\"lcm-title\\\">\\n    <span class=\\\"h5\\\">Azure - DOMAIN
        NAME PROXY AGREEMENT</span>\\n  </div>\\n    <div class=\\\"lcm-subtitle\\\">\\n
        \     Last Revised:  4/1/2024\\n    </div>\\n\\n\\n  <p><p>PLEASE READ THIS
        AGREEMENT CAREFULLY, AS IT CONTAINS IMPORTANT INFORMATION REGARDING YOUR LEGAL
        RIGHTS AND REMEDIES. </p>\\n<p>The Universal Terms of Service Agreement sets
        forth the general terms and conditions of your use of the Site and the Services.
        This Domain Name Proxy Agreement (this \u201C<strong>Service Agreement</strong>\u201D)
        governs your use of Azure\u2019s domain privacy related services (\u201C<strong>DBP
        Services</strong>\u201D). Capitalized terms used in this Service Agreement,
        but not defined, are defined in the Universal Terms of Service Agreement.
        </p>\\n<p>You further agree to abide by the terms and conditions promulgated
        by the Internet Corporation for Assigned Names and Numbers (&quot;ICANN&quot;)
        (including the Uniform Domain Name Dispute Resolution Policy (&quot;<strong>Dispute
        Resolution Policy</strong>&quot;) and Your Registrar (i.e., the ICANN-accredited
        person or entity through which You register a domain name).</p>\\n</p>\\n
        \           <strong><strong>1. <span style=\\\"text-transform:uppercase;\\\">Description
        of Azure's Private Registration Services</span></strong> </strong>\\n\\n\\n
        \ <p><p>When You subscribe to Azure's private registration service through
        a Azure-affiliated Registrar, Azure will display its contact information in
        the publicly available &quot;Whois&quot; directory in place of Your information.
        Azure shall keep Your name, postal address, email address, phone and fax numbers
        confidential, subject to Section 4 of this Agreement. The following information
        (and not Your personal information) will be made publicly available in the
        &quot;Whois&quot; directory as determined by ICANN policy:  \\r</p>\\n<ol
        type=i>\\r\\n<li>Azure's name as the proxy Registrant of the domain name and
        a proxy email address, phone number and postal address for the proxy Registrant's
        contact information;</li>  \\r\\n<li>A proxy postal address and phone number
        for the domain name registration's technical contact;</li>  \\r\\n<li>A proxy
        email address, postal address and phone number for the domain name registration's
        administrative contact;</li>  \\r\\n<li>A proxy email address, postal address
        and phone number for the domain's name registration's billing contact;</li>
        \ \\r\\n<li>The primary and secondary domain name servers You designate for
        the domain name;</li>  \\r\\n<li>The domain name's original date of registration
        and expiration date of the registration; and</li>  \\r\\n<li>The identity
        of the Registrar.</li>\\r\\n</ol>\\r\\n</p>\\n            <strong><strong>2
        . FULL BENEFITS OF COMAIN REGISTRATION RETAINED BY YOU</strong> </strong>\\n\\n\\n
        \ <p><p>Although Azure will show in the &quot;Whois&quot; directory as the
        Registrant of each domain name registration You designate, You will retain
        the full benefits of domain name registration with respect to each such domain
        name registration, including, subject to Section 4 below: </p>\\n<ol type=i>\\r\\n<li>The
        right to sell, transfer or assign each domain name registration, which shall
        require cancellation of the DBP Services associated with each such domain
        name registration;</li>  \\r\\n<li>The right to control the use of each domain
        name registration, including designating the primary and secondary domain
        name servers to which each domain name points;</li>  \\r\\n<li>The right to
        cancel each domain name registration;</li>  \\r\\n<li>The right to cancel
        the DBP Services associated with each domain name registration and/or Your
        privacy services with Azureso that Your contract information is listed in
        the \\\"Whois\\\" directory; and</li>   \\r\\n<li>The right to renew each
        domain name registration upon its expiration, subject to Your Registrar's
        applicable rules and policies.</li>\\r\\n</ol>\\r\\n</p>\\n            <strong><strong>3
        . PERSONAL INFORMATION AND YOUR NOTIFICATION OBLIGATIONS; REPRESENTATION AND
        WARRANTIES; ACCOUNT SECURITY</strong> </strong>\\n\\n\\n    <div class=\\\"paragraph\\\"><p><strong>Personal
        Information and Your Notification Obligations</strong>  \\r</p>\\n<p>You agree
        that for each domain name for which you use DBP Services, You will provide
        accurate and current information as to:  \\r</p>\\n<ol type=i><li>Your name,
        the email address, postal address, phone and fax numbers for the domain name
        registration's Registrant contact;</li><li>The email address, postal address,
        phone and fax numbers for the domain name registration's technical contact;</li><li>The
        email address, postal address, phone and fax numbers for the domain name registration's
        administrative contact;</li><li>The email address, postal address, phone and
        fax numbers for the domain name registration's billing contact; and</li><li>You
        agree to provide government issued photo identification and/or government
        issued business identification as required for verification of identity when
        requested.</li></ol>\\r\\n<p><strong>You agree to:</strong>  \\r</p>\\n<ol
        type=i><li>Notify Azurewithin three (3) calendar days when any of the personal
        information You provided upon subscribing to DBP Services, changes;</li><li>Respond
        within three (3) calendar days to any inquiries made by Azure to determine
        the validity of personal information provided by You; and</li><li>Timely respond
        to email messages Azure sends to You regarding correspondence Azure  has received
        that is either addressed to or involves You and/or Your domain name registration,
        as more fully set forth in Section 5(c) below.</li><li>To allow Azure to act
        as your Designated Agent (as that term is defined below) in instances when
        DBP Services are added to or cancelled from your domain name and for the purpose
        of facilitating a change of registrant request (as further described below).</li><li>As

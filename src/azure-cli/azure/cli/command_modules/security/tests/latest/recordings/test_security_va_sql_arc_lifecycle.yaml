  response:
    body:
      string: "{\"value\":[{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1017\",\"name\":\"VA1017\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1017\",\"status\":\"NonFinding\",\"isTrimmed\":false,\"queryResults\":[],\"remediation\":{\"description\":\"Revoke
        EXECUTE permission on xp_cmdshell to all users (except dbo)\",\"scripts\":[],\"automated\":true,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1017\",\"severity\":\"High\",\"category\":\"AuthenticationAndAuthorization\",\"ruleType\":\"NegativeList\",\"title\":\"Execute
        permissions on xp_cmdshell from all users (except dbo) should be revoked.\",\"description\":\"The
        xp_cmdshell extended stored procedure spawns a Windows command shell, passing
        in a string for execution. This rule checks that no users (except users with
        the CONTROL SERVER permission like members of the sysadmin server role) have
        permission to execute the xp_cmdshell extended stored procedure.\",\"rationale\":\"The
        xp_cmdshell extended stored procedure is a very powerful tool, but because
        of that, it is crucial that access to xp_cmdshell be tightly controlled. By
        default, only users with the CONTROL SERVER permission like members of the
        sysadmin server role can execute this extended stored procedure.\\nWhen first
        enabled, xp_cmdshell has the same security context as the SQL Server service
        account. The SQL Server service account is often more privileged than necessary
        for the work being performed by the process created by xp_cmdshell. As such,
        malicious users can attempt to elevate their privileges by using xp_cmdshell.\\nSee
        https://docs.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/xp-cmdshell-transact-sql
        for more information on xp_cmdshell.\",\"queryCheck\":{\"query\":\"SELECT
        dpr.name AS [Principal]\\nFROM sys.database_permissions AS dp\\nJOIN sys.database_principals
        AS dpr\\n    ON dp.grantee_principal_id = dpr.principal_id\\nWHERE major_id
        = OBJECT_ID('xp_cmdshell')\\n    AND dp.[type] = 'EX'\\n    AND [state] IN
        (\\n        'G'\\n        ,'W'\\n        )\",\"expectedResult\":[],\"columnNames\":[\"Principal\"]},\"benchmarkReferences\":[{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1018\",\"name\":\"VA1018\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1018\",\"status\":\"Finding\",\"isTrimmed\":false,\"queryResults\":[[\"True\"]],\"remediation\":{\"description\":\"Install
        the latest SQL Server CU corresponding to your version of SQL Server. Go to
        https://technet.microsoft.com/en-us/sqlserver/ff803383.aspx to find and download
        the required CU.\",\"scripts\":[],\"automated\":false,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1018\",\"severity\":\"High\",\"category\":\"InstallationUpdatesAndPatches\",\"ruleType\":\"Binary\",\"title\":\"Latest
        updates should be installed\",\"description\":\"Microsoft periodically releases
        Cumulative Updates (CUs) for each version of SQL Server. This rule checks
        whether the latest CU has been installed for the particular version of SQL
        Server being used.\",\"rationale\":\"Running with the latest Cumulative Updates
        (CU) for any particular version of SQL Server is important as these CU are
        a collection of all available patches up-to-date, including all known security
        fixes. Microsoft officially recommends ongoing, proactive installation of
        SQL Server CUs as they become available.\",\"queryCheck\":{\"query\":\"SELECT
        CASE\\n         WHEN Serverproperty('ProductVersion') >= '16.0.4065.3' THEN
        0\\n         ELSE 1\\n       END AS [Violation]\",\"expectedResult\":[[\"0\"]],\"columnNames\":[\"Violation\"]},\"benchmarkReferences\":[{\"benchmark\":\"CIS\",\"reference\":\"v1.0.0-08-11-2017:1.1\"},{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1020\",\"name\":\"VA1020\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1020\",\"status\":\"NonFinding\",\"isTrimmed\":false,\"queryResults\":[],\"remediation\":{\"description\":\"Remove
        the special user GUEST from all roles.\",\"scripts\":[],\"automated\":true,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1020\",\"severity\":\"High\",\"category\":\"AuthenticationAndAuthorization\",\"ruleType\":\"NegativeList\",\"title\":\"Database
        user GUEST should not be a member of any role\",\"description\":\"The guest
        user permits access to a database for any logins that are not mapped to a
        specific database user. This rule checks that no database roles are assigned
        to the Guest user.\",\"rationale\":\"Database Roles are the basic building
        block at the heart of separation of duties and the principle of least permission.
        Granting the Guest user membership to specific roles defeats this purpose.\",\"queryCheck\":{\"query\":\"SELECT
        name as [Role]\\nFROM sys.database_role_members AS drms\\nINNER JOIN sys.database_principals
        AS dps\\n    ON drms.role_principal_id = dps.principal_id\\nWHERE member_principal_id
        = DATABASE_PRINCIPAL_ID('guest')\",\"expectedResult\":[],\"columnNames\":[\"Role\"]},\"benchmarkReferences\":[{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1022\",\"name\":\"VA1022\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1022\",\"status\":\"NonFinding\",\"isTrimmed\":false,\"queryResults\":[[\"False\"]],\"remediation\":{\"description\":\"Disable
        the 'ad hoc distributed queries' feature on SQL Server\",\"scripts\":[\"EXECUTE
        sp_configure 'show advanced options', 1; RECONFIGURE;\\nEXECUTE sp_configure
        'ad hoc distributed queries', 0; RECONFIGURE;\\nEXECUTE sp_configure 'show
        advanced options', 0; RECONFIGURE;\"],\"automated\":true,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1022\",\"severity\":\"Medium\",\"category\":\"SurfaceAreaReduction\",\"ruleType\":\"Binary\",\"title\":\"Ad-hoc
        distributed queries should be disabled\",\"description\":\"Ad-hoc distributed
        queries use the 'OPENROWSET' and 'OPENDATASOURCE' functions to connect to
        remote data sources that use OLE DB. This rule checks that ad-hoc distributed
        queries are disabled.\",\"rationale\":\"Ad hoc distributed queries should
        be disabled, as they can allow an attacker to connect from a compromised server
        on your network to a non-compromised server that normally wouldn't allow connections
        from outside the network. In addition, the attacker can use this option to
        connect from a compromised server back to the his database, and copy your
        data to it.\",\"queryCheck\":{\"query\":\"SELECT CASE\\n    WHEN EXISTS (SELECT
        *\\n        FROM   sys.configurations\\n        WHERE  NAME = 'ad hoc distributed
        queries'\\n            AND Cast(value AS INT) = 1) THEN 1\\n    ELSE 0\\n
        \   END AS [Violation]\",\"expectedResult\":[[\"0\"]],\"columnNames\":[\"Violation\"]},\"benchmarkReferences\":[{\"benchmark\":\"CIS\",\"reference\":\"v1.0.0-08-11-2017:2.1\"},{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1023\",\"name\":\"VA1023\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1023\",\"status\":\"NonFinding\",\"isTrimmed\":false,\"queryResults\":[[\"False\"]],\"remediation\":{\"description\":\"Disable
        CLR hosting on SQL Server\",\"scripts\":[\"EXECUTE sp_configure 'show advanced
        options', 1; RECONFIGURE;\\nEXECUTE sp_configure 'clr enabled', 0; RECONFIGURE;\\nEXECUTE
        sp_configure 'clr strict security', 1; RECONFIGURE;\\nEXECUTE sp_configure
        'show advanced options', 0; RECONFIGURE;\"],\"automated\":true,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1023\",\"severity\":\"High\",\"category\":\"SurfaceAreaReduction\",\"ruleType\":\"Binary\",\"title\":\"CLR
        should be disabled\",\"description\":\"The CLR allows managed code to be hosted
        by and run in the Microsoft SQL Server environment. This rule checks that
        CLR is disabled.\",\"rationale\":\"If you enable CLR and set a database TRUSTWORTHY
        without knowing what particular assemblies can do and what code they contain,
        you can introduce a security flaw to the SQL Server instance and eventually
        to all other network resources where the account under which the SQL Server
        is running has access.\",\"queryCheck\":{\"query\":\"SELECT\\n       CASE\\n
        \             WHEN SatisfiedConditions = 2\\n                     THEN 1\\n
        \                    ELSE 0\\n       END AS Violation\\nFROM\\n       (\\n
        \             SELECT\\n                     COUNT(*) AS SatisfiedConditions\\n
        \             FROM\\n                     sys.configurations\\n              WHERE\\n
        \                    (\\n                            [name]                   =
        'clr enabled'\\n                            AND Cast([value] AS INT) = 1\\n
        \                    )\\n                     OR\\n                     (\\n
        \                           [name]                   = 'clr strict security'\\n
        \                           AND Cast([value] AS INT) = 0\\n                     )\\n
        \      )\\n       t\",\"expectedResult\":[[\"0\"]],\"columnNames\":[\"Violation\"]},\"benchmarkReferences\":[{\"benchmark\":\"CIS\",\"reference\":\"v1.0.0-08-11-2017:2.2\"},{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1026\",\"name\":\"VA1026\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1026\",\"status\":\"NonFinding\",\"isTrimmed\":false,\"queryResults\":[[\"False\"]],\"remediation\":{\"description\":\"Disable
        CLR hosting on SQL Server\",\"scripts\":[\"EXECUTE sp_configure 'show advanced
        options', 1; RECONFIGURE;\\nEXECUTE sp_configure 'clr enabled', 0; RECONFIGURE;\\nEXECUTE
        sp_configure 'show advanced options', 0; RECONFIGURE;\"],\"automated\":true,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1026\",\"severity\":\"Medium\",\"category\":\"SurfaceAreaReduction\",\"ruleType\":\"Binary\",\"title\":\"CLR
        should be disabled\",\"description\":\"The CLR allows managed code to be hosted
        by and run in the Microsoft SQL Server environment.\\nCLR strict security
        treats SAFE and EXTERNAL_ACCESS assemblies as if they were marked UNSAFE and
        requires all assemblies be signed by a certificate or asymmetric key with
        a corresponding login that has been granted UNSAFE ASSEMBLY permission in
        the master database.\\nThis rule checks that CLR is disabled.\",\"rationale\":\"If
        you enable CLR and set a database TRUSTWORTHY or add trusted assemblies without
        knowing what particular assemblies can do and what code they contain, you
        can introduce a security flaw to the SQL Server instance and eventually to
        all other network resources where the account under which the SQL Server is
        running has access.\",\"queryCheck\":{\"query\":\"SELECT\\n    CASE WHEN SatisfiedConditions
        = 2 THEN 1 ELSE 0 END AS [Violation]\\n    FROM (\\n        SELECT\\n            COUNT(*)
        AS SatisfiedConditions\\n        FROM\\n            sys.configurations\\n
        \       WHERE\\n            (\\n                [name] = 'clr enabled'\\n
        \               AND Cast([value] AS INT) = 1\\n            )\\n            OR
        (\\n                [name] = 'clr strict security'\\n                AND Cast([value]
        AS INT) = 1\\n            )\\n    ) AS t\",\"expectedResult\":[[\"0\"]],\"columnNames\":[\"Violation\"]},\"benchmarkReferences\":[{\"benchmark\":\"CIS\",\"reference\":\"v1.0.0-08-11-2017:2.2\"},{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1027\",\"name\":\"VA1027\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1027\",\"status\":\"NonFinding\",\"isTrimmed\":false,\"queryResults\":[],\"remediation\":{\"description\":\"Remove
        unwanted assemblies and set the rest as baseline\",\"scripts\":[],\"automated\":true,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1027\",\"severity\":\"High\",\"category\":\"SurfaceAreaReduction\",\"ruleType\":\"BaselineExpected\",\"title\":\"Untracked
        trusted assemblies should be removed\",\"description\":\"Assemblies marked
        as UNSAFE are required to be signed by a certificate or asymmetric key with
        a corresponding login that has been granted UNSAFE ASSEMBLY permission in
        the master database. Trusted assemblies may bypass this requirement.\",\"rationale\":\"If
        you enable CLR and add trusted assemblies without knowing what particular
        assemblies can do and what code they contain, you can introduce a security
        flaw to the SQL Server instance and eventually to all other network resources
        where the account under which the SQL Server is running has access.\",\"queryCheck\":{\"query\":\"IF
        (EXISTS (SELECT *\\n    FROM sys.configurations\\n    WHERE [name] = 'clr
        enabled' \\n        AND Cast([value] AS INT) = 1)) \\n    SELECT hash AS [Assembly]\\n
        \       , created_by As [Created By]\\n        , create_date as [Creation
        Date]\\n    FROM sys.trusted_assemblies\",\"expectedResult\":[],\"columnNames\":[\"Assembly\",\"Created
        By\",\"Creation Date\"]},\"benchmarkReferences\":[]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1042\",\"name\":\"VA1042\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1042\",\"status\":\"NonFinding\",\"isTrimmed\":false,\"queryResults\":[],\"remediation\":{\"description\":\"Disable
        DB_CHANING option for all databases that do not absolutely require it and
        set a baseline for the remaining databases that have a justification to make
        use of database chaining.\",\"scripts\":[],\"automated\":true,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1042\",\"severity\":\"High\",\"category\":\"AuthenticationAndAuthorization\",\"ruleType\":\"NegativeList\",\"title\":\"Database
        ownership chaining should be disabled for all databases except for 'master',
        'msdb' and 'tempdb'\",\"description\":\"Cross database ownership chaining
        is an extension of ownership chaining, except it does cross the database boundary.
        This rule checks that this option is disabled for all databases except for
        'master', 'msdb' and 'tempdb'. For 'master', 'msdb' and 'tempdb' cross database
        ownership chaining is enabled by default.\",\"rationale\":\"This option enables
        privileged users on a database to perform DML operations on a different database
        that has also been enabled, essentially bypassing permissions on the target
        DB. Using this feature should be done on an exception-basis.\",\"queryCheck\":{\"query\":\"SELECT
        name as [Database Name]\\nFROM sys.databases\\nWHERE name NOT IN (\\n        'master'\\n
        \       ,'model'\\n        ,'msdb'\\n        ,'tempdb'\\n        )\\n    AND
        is_db_chaining_on = 1\",\"expectedResult\":[],\"columnNames\":[\"Database
        Name\"]},\"benchmarkReferences\":[{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1045\",\"name\":\"VA1045\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1045\",\"status\":\"NonFinding\",\"isTrimmed\":false,\"queryResults\":[[\"False\"]],\"remediation\":{\"description\":\"Set
        the 'default trace enabled' option on SQL Server to 1\",\"scripts\":[\"EXECUTE
        sp_configure 'show advanced options', 1; RECONFIGURE;\\nEXECUTE sp_configure
        'default trace enabled', 1; RECONFIGURE;\\nEXECUTE sp_configure 'show advanced
        options', 0; RECONFIGURE;\"],\"automated\":true,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1045\",\"severity\":\"Medium\",\"category\":\"AuditingAndLogging\",\"ruleType\":\"Binary\",\"title\":\"Default
        trace should be enabled\",\"description\":\"Default trace provides troubleshooting
        assistance to database administrators by ensuring that they have the log data
        necessary to diagnose problems the first time they occur. This rule checks
        that the default trace is enabled.\",\"rationale\":\"The default trace provides
        logging information of important activity in the system, including creation
        of principals, and activities that could lead to escalation of privileges.
        This information is also useful as forensic information.\",\"queryCheck\":{\"query\":\"SELECT
        CASE\\n    WHEN EXISTS (SELECT *\\n    FROM   sys.configurations\\n        WHERE
        \ NAME = 'default trace enabled'\\n        AND Cast(value AS INT) = 0) THEN
        1\\n    ELSE 0\\n    END AS [Violation]\",\"expectedResult\":[[\"0\"]],\"columnNames\":[\"Violation\"]},\"benchmarkReferences\":[{\"benchmark\":\"CIS\",\"reference\":\"v1.0.0-08-11-2017:5.2\"},{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1046\",\"name\":\"VA1046\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1046\",\"status\":\"Finding\",\"isTrimmed\":false,\"queryResults\":[[\"gal\"]],\"remediation\":{\"description\":\"In
        order to fix, you must call ALTER LOGIN [target_login_name] WITH CHECK_POLICY
        = ON.\\nPlease notice that the password policy cannot be applied retroactively,
        so it is highly recommended  that you force affected users to rotate their
        password.\",\"scripts\":[\"ALTER LOGIN [gal] WITH CHECK_POLICY = ON;\"],\"automated\":true,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1046\",\"severity\":\"Low\",\"category\":\"AuthenticationAndAuthorization\",\"ruleType\":\"NegativeList\",\"title\":\"CHECK_POLICY
        should be enabled for all SQL logins\",\"description\":\"CHECK_POLICY option
        enables verifying SQL logins against the domain policy. This rule checks that
        CHECK_POLICY option is enabled for all SQL logins.\",\"rationale\":\"This
        option will apply the domain policy (OS level) to the SQL login password policy.
        The domain policy usually enforces password complexity policy, password expiration
        policy, etc.\",\"queryCheck\":{\"query\":\"SELECT NAME AS [Login]\\nFROM   sys.sql_logins\\nWHERE
        \ is_policy_checked = 0\",\"expectedResult\":[],\"columnNames\":[\"Login\"]},\"benchmarkReferences\":[{\"benchmark\":\"CIS\",\"reference\":\"v1.0.0-08-11-2017:4.3\"},{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1047\",\"name\":\"VA1047\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1047\",\"status\":\"Finding\",\"isTrimmed\":false,\"queryResults\":[[\"gal\"]],\"remediation\":{\"description\":\"Enable
        the password policy for expiration check on the affected logins.\",\"scripts\":[\"ALTER
        LOGIN [gal] WITH CHECK_EXPIRATION = ON, CHECK_POLICY = ON;\"],\"automated\":true,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1047\",\"severity\":\"Low\",\"category\":\"AuthenticationAndAuthorization\",\"ruleType\":\"NegativeList\",\"title\":\"Password
        expiration check should be enabled for all SQL logins\",\"description\":\"Password
        expiration policies are used to manage the lifespan of a password. When SQL
        Server enforces password expiration policy, users are reminded to change old
        passwords, and accounts that have expired passwords are disabled. This rule
        checks that password expiration policy is enabled for all SQL logins.\",\"rationale\":\"Without
        a password expiration policy, an unauthorized person that acquires a password
        and uses it without being detected, may have access to your database for an
        indefinite period.\",\"queryCheck\":{\"query\":\"SELECT name as [Login]\\nFROM
        \  sys.sql_logins\\nWHERE  is_expiration_checked = 0\\n    AND is_disabled
        = 0\\n    AND name != '##MS_PolicyTsqlExecutionLogin##'\\n    AND name !=
        '##MS_PolicyEventProcessingLogin##'\",\"expectedResult\":[],\"columnNames\":[\"Login\"]},\"benchmarkReferences\":[{\"benchmark\":\"CIS\",\"reference\":\"v1.0.0-08-11-2017:4.2\"},{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1052\",\"name\":\"VA1052\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1052\",\"status\":\"NonFinding\",\"isTrimmed\":false,\"queryResults\":[[\"False\"]],\"remediation\":{\"description\":\"Removing
        the BUILTIN\\\\Administrators well known group from SQL server principals,
        and grant instead permissions based on other Windows group memberships.\",\"scripts\":[\"DECLARE
        @sa SYSNAME;  DECLARE @cmd NVARCHAR(max);  SELECT @sa = Suser_sname(0x01020000000000052000000020020000);
        \ SET @cmd = N'DROP LOGIN ' + Quotename(@sa);  EXEC( @cmd);\"],\"automated\":true,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1052\",\"severity\":\"Low\",\"category\":\"AuthenticationAndAuthorization\",\"ruleType\":\"Binary\",\"title\":\"Remove
        BUILTIN\\\\Administrators as a server login\",\"description\":\"The BUILTIN\\\\Administrators
        group contains the Windows Local Administrators group. In old versions of
        Microsoft SQL Server, this group has administrator rights by default. This
        rule checks that this group is removed from SQL Server.\",\"rationale\":\"This
        is a best-practice with the intent of making a separation between OS administration
        and SQL administration.\\nAlthough a OS administrator can take control of
        the SQL service, this rule is intended to help avoid mistakes.\",\"queryCheck\":{\"query\":\"SELECT
        CASE\\n         WHEN EXISTS (SELECT *\\n                      FROM   sys.server_principals\\n
        \                     WHERE  sid = 0x01020000000000052000000020020000\\n                     /*S-1-5-32-544*/)\\n
        \      THEN 1\\n         ELSE 0\\n       END AS [Violation]\",\"expectedResult\":[[\"0\"]],\"columnNames\":[\"Violation\"]},\"benchmarkReferences\":[{\"benchmark\":\"CIS\",\"reference\":\"v1.4.0-08-11-2017:3.9\"},{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1053\",\"name\":\"VA1053\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1053\",\"status\":\"Finding\",\"isTrimmed\":false,\"queryResults\":[[\"True\"]],\"remediation\":{\"description\":\"Rename
        the default sysadmin (sa) account and disable it.\",\"scripts\":[\"DECLARE
        @sa sysname; DECLARE @new_sa sysname; DECLARE @cmd nvarchar(max); SELECT @sa
        = suser_sname(0x01); SET @new_sa = convert(nvarchar(128), newid()); SET @cmd
        =  N'ALTER LOGIN ' + quotename(@sa) + N' DISABLE; ALTER LOGIN ' + quotename(@sa)
        + N' WITH NAME = ' + quotename(@new_sa) + N';'; EXEC(@cmd);\"],\"automated\":true,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1053\",\"severity\":\"Low\",\"category\":\"AuthenticationAndAuthorization\",\"ruleType\":\"Binary\",\"title\":\"Account
        with default name 'sa' should be renamed and disabled\",\"description\":\"'sa'
        is a well-known account with principal Id 1. This rule verifies that the 'sa'
        account is renamed and disabled\",\"rationale\":\"The well-known default sysadmin
        account is named 'sa'. Automated attacks will try to brute force the 'sa'
        account as soon as a SQL instance is discovered. By renaming the 'sa' account,
        most automated attacks will fail to brute force the database admin password.\",\"queryCheck\":{\"query\":\"DECLARE
        @IsSaRenamed INT = 0;\\n\\nSELECT @IsSaRenamed = CASE\\n    WHEN EXISTS (SELECT
        *\\n                      FROM   sys.sql_logins\\n                      WHERE
        \ name != 'sa'\\n                             AND principal_id = 1) THEN 1\\n
        \   ELSE 0\\n    END;\\n\\nDECLARE @IsSaDisabled INT = 0;\\n\\nSELECT @IsSaDisabled
        = CASE\\n    WHEN  EXISTS (SELECT *\\n                      FROM   sys.sql_logins\\n
        \                     WHERE  principal_id = 1\\n                      AND
        is_disabled = 1) THEN 1\\n    ELSE 0\\n    END;\\n\\nSELECT CASE\\n    WHEN
        (@IsSaDisabled = 0\\n        or @IsSaRenamed = 0) THEN 1\\n    ELSE 0\\n    END
        AS [Violation]\",\"expectedResult\":[[\"0\"]],\"columnNames\":[\"Violation\"]},\"benchmarkReferences\":[{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1054\",\"name\":\"VA1054\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1054\",\"status\":\"NonFinding\",\"isTrimmed\":false,\"queryResults\":[],\"remediation\":{\"description\":\"Revoke
        unnecessary permissions granted to PUBLIC\",\"scripts\":[],\"automated\":false,\"portalLink\":\"\"},\"baselineAdjustedResult\":null,\"ruleMetadata\":{\"ruleId\":\"VA1054\",\"severity\":\"Low\",\"category\":\"AuthenticationAndAuthorization\",\"ruleType\":\"NegativeList\",\"title\":\"Excessive
        permissions should not be granted to PUBLIC role on objects or columns\",\"description\":\"Every
        SQL Server login belongs to the public server role. When a server principal
        has not been granted or denied specific permissions on a securable object,
        the user inherits the permissions granted to public on that object. This rule
        displays a list of all securable objects or columns that are accessible to
        all users through the PUBLIC role.\",\"rationale\":\"Database Roles are the
        basic building block at the heart of separation of duties and the principle
        of least permission. Granting permissions to principals through the default
        PUBLIC role defeats this purpose.\",\"queryCheck\":{\"query\":\"IF object_id('tempdb.dbo.#entries_to_exclude_va1054',
        'U') IS NOT NULL\\n    DROP TABLE #entries_to_exclude_va1054;\\n\\nCREATE
        TABLE #entries_to_exclude_va1054 (\\n    object_type VARCHAR(20)\\n    ,schema_name
        VARCHAR(3)\\n    ,object_name VARCHAR(128)\\n    ,grantor_principal_name VARCHAR(3)\\n
        \   ,permission_name VARCHAR(20)\\n    ,TYPE VARCHAR(3)\\n    ,STATE CHAR(1)\\n
        \   )\\n\\nINSERT INTO #entries_to_exclude_va1054 (object_name)\\nVALUES ('fn_sysdac_get_currentusername')\\n
        \   ,('fn_sysdac_get_username')\\n    ,('fn_sysdac_is_currentuser_sa')\\n
        \   ,('fn_sysdac_is_dac_creator')\\n    ,('fn_sysdac_is_login_creator')\\n
        \   ,('fn_syspolicy_is_automation_enabled')\\n\\nUPDATE #entries_to_exclude_va1054\\nSET
        object_type = 'FN'\\n    ,schema_name = 'dbo'\\n    ,grantor_principal_name
        = 'dbo'\\n    ,permission_name = 'EXECUTE'\\n    ,TYPE = 'EX'\\n    ,STATE
        = 'G'\\nWHERE object_type IS NULL\\n\\nINSERT INTO #entries_to_exclude_va1054
        (object_name)\\nVALUES ('sp_sysdac_add_history_entry')\\n    ,('sp_sysdac_add_instance')\\n
        \   ,('sp_sysdac_delete_history')\\n    ,('sp_sysdac_delete_instance')\\n
        \   ,('sp_sysdac_drop_database')\\n    ,('sp_sysdac_ensure_dac_creator')\\n
        \   ,('sp_sysdac_rename_database')\\n    ,('sp_sysdac_resolve_pending_entry')\\n
        \   ,('sp_sysdac_rollback_all_pending_objects')\\n    ,('sp_sysdac_rollback_committed_step')\\n
        \   ,('sp_sysdac_rollback_pending_object')\\n    ,('sp_sysdac_setreadonly_database')\\n
        \   ,('sp_sysdac_update_history_entry')\\n    ,('sp_sysdac_update_instance')\\n
        \   ,('sp_sysdac_upgrade_instance')\\n\\nUPDATE #entries_to_exclude_va1054\\nSET
        object_type = 'P'\\n    ,schema_name = 'dbo'\\n    ,grantor_principal_name
        = 'dbo'\\n    ,permission_name = 'EXECUTE'\\n    ,TYPE = 'EX'\\n    ,STATE
        = 'G'\\nWHERE object_type IS NULL\\n\\nINSERT INTO #entries_to_exclude_va1054
        (object_name)\\nVALUES ('backupfile')\\n    ,('backupmediafamily')\\n    ,('backupmediaset')\\n
        \   ,('backupset')\\n    ,('dm_hadr_automatic_seeding_history')\\n    ,('logmarkhistory')\\n
        \   ,('restorefile')\\n    ,('restorefilegroup')\\n    ,('restorehistory')\\n
        \   ,('spt_fallback_db')\\n    ,('spt_fallback_dev')\\n    ,('spt_fallback_usg')\\n
        \   ,('spt_monitor')\\n    ,('suspect_pages')\\n    ,('sysdac_history_internal')\\n
        \   ,('sysdac_instances_internal')\\n\\nUPDATE #entries_to_exclude_va1054\\nSET
        object_type = 'U'\\n    ,schema_name = 'dbo'\\n    ,grantor_principal_name
        = 'dbo'\\n    ,permission_name = 'SELECT'\\n    ,TYPE = 'SL'\\n    ,STATE
        = 'G'\\nWHERE object_type IS NULL\\n\\nINSERT INTO #entries_to_exclude_va1054
        (object_name)\\nVALUES ('autoadmin_backup_configuration_summary')\\n    ,('spt_values')\\n
        \   ,('sysdac_instances')\\n    ,('syspolicy_conditions')\\n    ,('syspolicy_configuration')\\n
        \   ,('syspolicy_object_sets')\\n    ,('syspolicy_policies')\\n    ,('syspolicy_policy_categories')\\n
        \   ,('syspolicy_policy_category_subscriptions')\\n    ,('syspolicy_policy_execution_history')\\n
        \   ,('syspolicy_policy_execution_history_details')\\n    ,('syspolicy_system_health_state')\\n
        \   ,('syspolicy_target_set_levels')\\n    ,('syspolicy_target_sets')\\n\\nUPDATE
        #entries_to_exclude_va1054\\nSET object_type = 'V'\\n    ,schema_name = 'dbo'\\n
        \   ,grantor_principal_name = 'dbo'\\n    ,permission_name = 'SELECT'\\n    ,TYPE
        = 'SL'\\n    ,STATE = 'G'\\nWHERE object_type IS NULL\\n\\n\\nSELECT all_entries.permission_name
        AS [Permission]\\n    ,all_entries.schema_name AS [Schema]\\n    ,all_entries.object_name
        AS [Object]\\nFROM (\\n    SELECT objs.TYPE COLLATE database_default AS object_type\\n
        \       ,schema_name(schema_id) COLLATE database_default AS schema_name\\n
        \       ,objs.name COLLATE database_default AS object_name\\n        ,user_name(grantor_principal_id)
        COLLATE database_default AS grantor_principal_name\\n        ,permission_name
        COLLATE database_default AS permission_name\\n        ,perms.TYPE COLLATE
        database_default AS TYPE\\n        ,STATE COLLATE database_default AS STATE\\n
        \   FROM sys.database_permissions AS perms\\n    INNER JOIN sys.objects AS
        objs\\n    ON objs.object_id = perms.major_id\\n    WHERE perms.class = 1
        -- objects or columns. Other cases are handled by VA1095 which has different
        remediation syntax\\n        AND grantee_principal_id = database_principal_id('public')\\n
        \       AND [state] IN (\\n            'G'\\n            ,'W'\\n            )\\n
        \   \\n    UNION\\n    \\n    SELECT 'system_object' COLLATE database_default
        AS object_type\\n        ,'sys' COLLATE database_default AS schema_name\\n
        \       ,object_name(major_id) COLLATE database_default AS object_name\\n
        \       ,user_name(grantor_principal_id) COLLATE database_default AS grantor_principal_name\\n
        \       ,permission_name COLLATE database_default AS permission_name\\n        ,TYPE
        COLLATE database_default AS TYPE\\n        ,STATE COLLATE database_default
        AS STATE\\n    FROM sys.database_permissions\\n    WHERE class = 1\\n        AND
        grantee_principal_id = database_principal_id('public')\\n        AND object_name(major_id)
        COLLATE database_default = 'sp_syspolicy_execute_policy'\\n        AND [state]
        IN (\\n            'G'\\n            ,'W'\\n            )\\n    ) AS all_entries\\nLEFT
        JOIN #entries_to_exclude_va1054 ON all_entries.object_type = #entries_to_exclude_va1054.object_type
        COLLATE database_default\\n    AND all_entries.schema_name = #entries_to_exclude_va1054.schema_name
        COLLATE database_default\\n    AND all_entries.object_name = #entries_to_exclude_va1054.object_name
        COLLATE database_default\\n    AND all_entries.grantor_principal_name = #entries_to_exclude_va1054.grantor_principal_name
        COLLATE database_default\\n    AND all_entries.permission_name = #entries_to_exclude_va1054.permission_name
        COLLATE database_default\\n    AND all_entries.TYPE = #entries_to_exclude_va1054.TYPE
        COLLATE database_default\\n    AND all_entries.STATE = #entries_to_exclude_va1054.STATE
        COLLATE database_default\\nWHERE #entries_to_exclude_va1054.object_name IS
        NULL -- assuring the permissions are not part of the default one given to
        public\",\"expectedResult\":[],\"columnNames\":[\"Permission\",\"Schema\",\"Object\"]},\"benchmarkReferences\":[{\"benchmark\":\"FedRAMP\",\"reference\":null}]}}},{\"id\":\"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/ggoldshtein/providers/Microsoft.HybridCompute/machines/galLaptop/sqlServers/SQLEXPRESS/databases/master/providers/Microsoft.Security/sqlVulnerabilityAssessments/default/scans/a9f98e23-7917-405f-adbe-c0a82bafd337/scanResults/VA1058\",\"name\":\"VA1058\",\"type\":\"Microsoft.Security/sqlVulnerabilityAssessments/scans/scanResults\",\"properties\":{\"ruleId\":\"VA1058\",\"status\":\"NonFinding\",\"isTrimmed\":false,\"queryResults\":[[\"False\"]],\"remediation\":{\"description\":\"Disable
        the well-known sysadmin account 'sa'. Instead use Windows-based groups to

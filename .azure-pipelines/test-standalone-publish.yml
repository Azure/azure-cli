# Temporary manual recovery pipeline for publishing artifacts from a completed
# macOS and Linux standalone validation run.
trigger: none
pr: none

parameters:
  - name: SourceBuildId
    displayName: 'Source standalone build ID'
    type: string
    default: ''
  - name: SourcePipelineDefinition
    displayName: 'Source pipeline definition'
    type: string
    default: 'naga_mac-and-linux-standalone-release'
  - name: GitHubRepo
    displayName: 'GitHub release repository'
    type: string
    default: 'Azure/azclips'
  - name: ReleaseTagPrefix
    displayName: 'GitHub release tag prefix'
    type: string
    default: 'standalone-publish-test'
  - name: UpdateHomebrew
    displayName: 'Update Homebrew Cask after release'
    type: boolean
    default: false

resources:
  repositories:
  - repository: homebrewtap
    type: github
    endpoint: 'Azure'
    name: Azure/homebrew-azure-cli
    ref: main

variables:
- ${{ if eq(variables['System.TeamProject'], 'release') }}:
  - group: 'get-github-pat-token'

name: standalone-publish-recovery-$(Build.BuildId)

jobs:
- job: CreateGitHubRelease
  displayName: 'Standalone | Create GitHub Release'
  pool:
    vmImage: 'ubuntu-latest'

  steps:
  - checkout: none

  - template: templates/standalone/get-github-pat-token.yml
    parameters:
      azureSubscription: $(AzureSubscription)
      keyVaultName: $(GitHubPatKeyVault)
      secretName: $(GitHubPatSecretName)

  - task: DownloadPipelineArtifact@2
    displayName: 'Download macOS ARM64 release files'
    inputs:
      buildType: 'specific'
      project: 'release'
      definition: '${{ parameters.SourcePipelineDefinition }}'
      buildVersionToDownload: 'specific'
      buildId: '${{ parameters.SourceBuildId }}'
      artifactName: 'macos-cli-signed-notarized-arm64'
      targetPath: '$(Pipeline.Workspace)/macos-cli-signed-notarized-arm64'

  - task: DownloadPipelineArtifact@2
    displayName: 'Download macOS x86_64 release files'
    inputs:
      buildType: 'specific'
      project: 'release'
      definition: '${{ parameters.SourcePipelineDefinition }}'
      buildVersionToDownload: 'specific'
      buildId: '${{ parameters.SourceBuildId }}'
      artifactName: 'macos-cli-signed-notarized-x86_64'
      targetPath: '$(Pipeline.Workspace)/macos-cli-signed-notarized-x86_64'

  - task: DownloadPipelineArtifact@2
    displayName: 'Download Linux ARM64 release files'
    inputs:
      buildType: 'specific'
      project: 'release'
      definition: '${{ parameters.SourcePipelineDefinition }}'
      buildVersionToDownload: 'specific'
      buildId: '${{ parameters.SourceBuildId }}'
      artifactName: 'linux-cli-final-arm64'
      targetPath: '$(Pipeline.Workspace)/linux-cli-final-arm64'

  - task: DownloadPipelineArtifact@2
    displayName: 'Download Linux x86_64 release files'
    inputs:
      buildType: 'specific'
      project: 'release'
      definition: '${{ parameters.SourcePipelineDefinition }}'
      buildVersionToDownload: 'specific'
      buildId: '${{ parameters.SourceBuildId }}'
      artifactName: 'linux-cli-final-x86_64'
      targetPath: '$(Pipeline.Workspace)/linux-cli-final-x86_64'

  - task: CopyFiles@2
    displayName: 'Collect release files'
    inputs:
      SourceFolder: '$(Pipeline.Workspace)'
      Contents: |
        macos-cli-signed-notarized-arm64/azure-cli-*.tar.gz
        macos-cli-signed-notarized-arm64/azure-cli-*.tar.gz.sha256
        macos-cli-signed-notarized-x86_64/azure-cli-*.tar.gz
        macos-cli-signed-notarized-x86_64/azure-cli-*.tar.gz.sha256
        linux-cli-final-arm64/azure-cli-*.tar.gz
        linux-cli-final-arm64/azure-cli-*.tar.gz.sha256
        linux-cli-final-x86_64/azure-cli-*.tar.gz
        linux-cli-final-x86_64/azure-cli-*.tar.gz.sha256
      TargetFolder: '$(Build.ArtifactStagingDirectory)/release'
      flattenFolders: true

  - bash: |
      set -euo pipefail

      ARM64_TARBALL=$(find "$(Build.ArtifactStagingDirectory)/release" -name 'azure-cli-*-macos-arm64.tar.gz' -print -quit)
      VERSION=$(basename "$ARM64_TARBALL" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+([a-z0-9]+)?' | head -1)

      echo "Source build: ${{ parameters.SourceBuildId }}"
      echo "Release version: $VERSION"
      ls -lh "$(Build.ArtifactStagingDirectory)/release"
      echo "##vso[task.setvariable variable=ReleaseTag]${{ parameters.ReleaseTagPrefix }}-$(Build.BuildId)"
      echo "##vso[task.setvariable variable=AzureCliVersion]$VERSION"
    displayName: 'Prepare release files'

  - bash: |
      set -euo pipefail

      release_tag='$(ReleaseTag)'
      repository='${{ parameters.GitHubRepo }}'

      gh release create "$release_tag" "$(Build.ArtifactStagingDirectory)/release/"* \
        --repo "$repository" \
        --target main \
        --latest=false \
        --title "Standalone publish test $(Build.BuildId)" \
        --notes "Temporary standalone publishing test using artifacts from build ${{ parameters.SourceBuildId }}."
    displayName: 'Create GitHub Release with PAT'
    env:
      GH_TOKEN: $(GH_TOKEN)

- job: UpdateHomebrewCask
  displayName: 'Standalone | Update Homebrew Cask'
  dependsOn: CreateGitHubRelease
  condition: and(succeeded(), eq('${{ parameters.UpdateHomebrew }}', true))
  pool:
    vmImage: 'ubuntu-latest'

  steps:
  - checkout: homebrewtap
    persistCredentials: true
    path: homebrew-tap

  - task: DownloadPipelineArtifact@2
    displayName: 'Download generated Cask definition'
    inputs:
      buildType: 'specific'
      project: 'release'
      definition: '${{ parameters.SourcePipelineDefinition }}'
      buildVersionToDownload: 'specific'
      buildId: '${{ parameters.SourceBuildId }}'
      artifactName: 'cask-definition'
      targetPath: '$(Pipeline.Workspace)/cask-definition'

  - bash: |
      set -euo pipefail

      cd "$(Pipeline.Workspace)/homebrew-tap"
      git fetch origin main
      git reset --hard origin/main

      CASK_DIR='Casks/a'
      mkdir -p "$CASK_DIR"
      cp "$(Pipeline.Workspace)/cask-definition/azure-cli.rb" "$CASK_DIR/azure-cli.rb"

      VERSION=$(grep -oP 'version "\K[^"]+' "$CASK_DIR/azure-cli.rb" | head -1)
      git config user.name 'Azure Pipeline'
      git config user.email 'azure-pipeline@microsoft.com'
      git add "$CASK_DIR/azure-cli.rb"
      git commit -m "Update azure-cli to $VERSION" || echo 'No Cask changes'
      git push origin HEAD:main
    displayName: 'Push Cask to Homebrew tap'
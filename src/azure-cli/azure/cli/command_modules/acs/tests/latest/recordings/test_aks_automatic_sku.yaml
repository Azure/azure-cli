        \               \"input\": {\r\n                  \"actiongroupId\": \"[parameters('actionGroupIds')[copyIndex('actionsForPrometheusRuleGroups')]]\"\r\n
        \               }\r\n              }\r\n            ]\r\n          },\r\n
        \         \"resources\": [\r\n            {\r\n              \"name\": \"[parameters('alertName')]\",\r\n

        for new domain name registrations, you will not need to complete this step
        again during the checkout process.   \\r</p>\\n<p><u>Azure\u2019s Default
        Settings.</u>  If you do not direct your domain name away from Azure\u2019s
        name servers as described above, Azure will direct your domain name to a \u201C<u>Parked
        Page</u>\u201D (\u201C<u>Default Setting</u>\u201D).  You acknowledge and
        agree that Azure has the right to set the Default Setting. </p>\\n<p><u>Parked
        Page Default Setting.</u>  Azure's Parked Page service is an online domain

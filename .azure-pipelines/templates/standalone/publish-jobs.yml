# Standalone Publish Jobs Template
#
# Purpose: Publish signed tarballs to GitHub and update Homebrew cask
# Usage: Called after test jobs pass
#
# Parameters:
#   - PublishToGitHub: Whether to create GitHub release
#   - UpdateHomebrew: Whether to update Homebrew cask
#   - TestAfterPublish: Whether to test installation after publishing
#   - GitHubRepo: GitHub repository (owner/repo)
#   - HomebrewTapRepo: Homebrew tap repository
#   - MacosArm64Image: VM image for ARM64 tests
#   - MacosIntelImage: VM image for Intel tests
#   - LinuxArm64Pool: pool for ARM64 Linux tests
#   - LinuxX64Pool: pool for x86_64 Linux tests
#   - PythonVersion: Homebrew Python version for testing
#   - Debug: Enable debug diagnostics
#   - dependsOn: Jobs this depends on (typically test jobs)
#
# Requires:
#   - Artifacts: macos-cli-signed-notarized-arm64, macos-cli-signed-notarized-x86_64,
#     linux-cli-final-arm64, linux-cli-final-x86_64, cask-definition
#   - Repository resource: homebrewtap (for Homebrew cask updates)

parameters:
  - name: PublishToGitHub
    type: boolean
    default: true
  - name: UpdateHomebrew
    type: boolean
    default: true
  - name: TestAfterPublish
    type: boolean
    default: true
  - name: GitHubRepo
    type: string
    default: 'Azure/homebrew-azure-cli'
    values:
      - 'Azure/homebrew-azure-cli'
  - name: HomebrewTapRepo
    type: string
    default: 'Azure/homebrew-azure-cli'
    values:
      - 'Azure/homebrew-azure-cli'
  - name: MacosArm64Image
    type: string
    default: 'macos-15-arm64'
  - name: MacosIntelImage
    type: string
    default: 'macos-15'
  - name: LinuxArm64Pool
    type: string
    default: 'pool-ubuntu-latest-arm64'
  - name: LinuxX64Pool
    type: string
    default: 'pool-ubuntu-2204'
  - name: PythonVersion
    type: string
    default: '3.14'
  - name: Debug
    type: boolean
    default: false
  - name: condition
    type: string
    default: 'succeeded()'
  - name: dependsOn
    type: object
    default: ['TestMacOSTempTapCask', 'TestLinuxTempTapCask', 'TestMacOSOfflineInstall', 'TestLinuxOfflineInstall']

jobs:
# ============================================================================
# JOB: GITHUB RELEASE
# ============================================================================
- ${{ if eq(parameters.PublishToGitHub, true) }}:
  - job: CreateGitHubRelease
    displayName: 'Standalone | Create GitHub Release'
    dependsOn: ${{ parameters.dependsOn }}
    condition: succeeded()
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - checkout: none

    - template: get-github-pat-token.yml
      parameters:
        azureSubscription: $(AzureSubscription)
        keyVaultName: $(GitHubPatKeyVault)
        secretName: $(GitHubPatSecretName)
    
    - download: current
      artifact: 'macos-cli-signed-notarized-arm64'
      displayName: 'Download signed tarball (ARM64)'
    
    - download: current
      artifact: 'macos-cli-signed-notarized-x86_64'
      displayName: 'Download signed tarball (Intel)'

    - download: current
      artifact: 'linux-cli-final-arm64'
      displayName: 'Download Linux tarball (ARM64)'

    - download: current
      artifact: 'linux-cli-final-x86_64'
      displayName: 'Download Linux tarball (x86_64)'
    
    - task: CopyFiles@2
      displayName: 'Copy ARM64 release files'
      inputs:
        SourceFolder: '$(Pipeline.Workspace)/macos-cli-signed-notarized-arm64'
        Contents: |
          azure-cli-*.tar.gz
          azure-cli-*.tar.gz.sha256
        TargetFolder: '$(Build.ArtifactStagingDirectory)/release'
        flattenFolders: true
    
    - task: CopyFiles@2
      displayName: 'Copy Intel release files'
      inputs:
        SourceFolder: '$(Pipeline.Workspace)/macos-cli-signed-notarized-x86_64'
        Contents: |
          azure-cli-*.tar.gz
          azure-cli-*.tar.gz.sha256
        TargetFolder: '$(Build.ArtifactStagingDirectory)/release'
        flattenFolders: true

    - task: CopyFiles@2
      displayName: 'Copy Linux ARM64 release files'
      inputs:
        SourceFolder: '$(Pipeline.Workspace)/linux-cli-final-arm64'
        Contents: |
          azure-cli-*.tar.gz
          azure-cli-*.tar.gz.sha256
        TargetFolder: '$(Build.ArtifactStagingDirectory)/release'
        flattenFolders: true

    - task: CopyFiles@2
      displayName: 'Copy Linux x86_64 release files'
      inputs:
        SourceFolder: '$(Pipeline.Workspace)/linux-cli-final-x86_64'
        Contents: |
          azure-cli-*.tar.gz
          azure-cli-*.tar.gz.sha256
        TargetFolder: '$(Build.ArtifactStagingDirectory)/release'
        flattenFolders: true
    
    - bash: |
        ARM64_TARBALL=$(find "$(Build.ArtifactStagingDirectory)/release" -name "azure-cli-*-macos-arm64.tar.gz" | head -1)
        VERSION=$(basename "$ARM64_TARBALL" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+([a-z0-9]+)?' | head -1)
        
        echo "=== GitHub Release ==="
        echo "Version: $VERSION"
        ls -lh "$(Build.ArtifactStagingDirectory)/release/"
        
        echo "##vso[task.setvariable variable=ReleaseTag]azure-cli-${VERSION}"
        echo "##vso[task.setvariable variable=AzureCliVersion]${VERSION}"
        
      displayName: 'Prepare release files'
    
    - bash: |
        set -euo pipefail

        notes_file="$RELEASE_TEMP_DIRECTORY/release-notes.md"

        printf '## Azure CLI %s - Homebrew Cask\n\n' "$RELEASE_VERSION" > "$notes_file"
        printf '### Available Architectures\n' >> "$notes_file"
        printf -- '- **%s**: azure-cli-%s-%s.tar.gz\n' \
          'Apple Silicon (arm64)' "$RELEASE_VERSION" 'macos-arm64' \
          'Intel (x86_64)' "$RELEASE_VERSION" 'macos-x86_64' \
          'Linux ARM64' "$RELEASE_VERSION" 'linux-arm64' \
          'Linux x86_64' "$RELEASE_VERSION" 'linux-x86_64' >> "$notes_file"
        printf '\n### Requirements\n- Homebrew Python %s on macOS or Linux\n' \
          "$RELEASE_PYTHON_VERSION" >> "$notes_file"
        printf '\n### Installation via Homebrew Cask\n```bash\nbrew tap %s\nbrew install --cask azure-cli\n```\n' \
          "$RELEASE_HOMEBREW_TAP" >> "$notes_file"

        gh release delete "$RELEASE_TAG" --repo "$RELEASE_GITHUB_REPO" --yes || true
        gh release create "$RELEASE_TAG" "$RELEASE_DIRECTORY/"* \
          --repo "$RELEASE_GITHUB_REPO" \
          --target main \
          --title "Azure CLI $RELEASE_VERSION - Homebrew Cask" \
          --notes-file "$notes_file"
      displayName: 'Create GitHub Release with PAT'
      env:
        GH_TOKEN: $(GH_TOKEN)
        RELEASE_TAG: $(ReleaseTag)
        RELEASE_VERSION: $(AzureCliVersion)
        RELEASE_TEMP_DIRECTORY: $(Agent.TempDirectory)
        RELEASE_DIRECTORY: $(Build.ArtifactStagingDirectory)/release
        RELEASE_GITHUB_REPO: ${{ parameters.GitHubRepo }}
        RELEASE_HOMEBREW_TAP: ${{ parameters.HomebrewTapRepo }}
        RELEASE_PYTHON_VERSION: ${{ parameters.PythonVersion }}

# ============================================================================
# JOB: UPDATE HOMEBREW CASK
# ============================================================================
- ${{ if eq(parameters.UpdateHomebrew, true) }}:
  - job: UpdateHomebrewCask
    displayName: 'Standalone | Update Homebrew Cask'
    dependsOn:
    - ${{ parameters.dependsOn }}
    - ${{ if eq(parameters.PublishToGitHub, true) }}:
      - CreateGitHubRelease
    condition: succeeded()
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - checkout: self
      fetchDepth: 1
      path: azure-cli
    
    - download: current
      artifact: 'cask-definition'
      displayName: 'Download cask definition'

    - bash: |
        set -euo pipefail
        python3 "$RELEASE_SOURCE_DIRECTORY/scripts/release/standalone/cask_generate.py" \
          --validate "$CASK_PATH" \
          --github-repo "$RELEASE_GITHUB_REPO" \
          --python-version "$RELEASE_PYTHON_VERSION" \
          --template "$RELEASE_SOURCE_DIRECTORY/scripts/release/standalone/templates/azure-cli.rb.in"
      displayName: 'Validate unchanged publication cask before tap checkout'
      env:
        RELEASE_SOURCE_DIRECTORY: $(Pipeline.Workspace)/azure-cli
        CASK_PATH: $(Pipeline.Workspace)/cask-definition/azure-cli.rb
        RELEASE_GITHUB_REPO: ${{ parameters.GitHubRepo }}
        RELEASE_PYTHON_VERSION: ${{ parameters.PythonVersion }}

    - checkout: homebrewtap
      persistCredentials: true
      path: homebrew-tap
    
    - bash: |
        set -e
        
        echo "=== Updating Homebrew Cask from artifact ==="
        
        cd $(Pipeline.Workspace)/homebrew-tap
        
        # Always start from the latest origin/main to avoid rebase conflicts
        git fetch origin main
        git reset --hard origin/main
        
        # Homebrew uses sharded cask layout: Casks/<first-letter>/<name>.rb
        CASK_DIR="Casks/a"
        mkdir -p "$CASK_DIR"
        
        # Copy the pre-generated cask from artifact
        cp "$(Pipeline.Workspace)/cask-definition/azure-cli.rb" "$CASK_DIR/azure-cli.rb"
        cmp "$(Pipeline.Workspace)/cask-definition/azure-cli.rb" "$CASK_DIR/azure-cli.rb"
        
        echo "=== Cask Definition ==="
        cat "$CASK_DIR/azure-cli.rb"
        
        # Extract version from cask for commit message
        VERSION=$(grep -oP 'version "\K[^"]+' "$CASK_DIR/azure-cli.rb" | head -1)
        echo "Version: $VERSION"
        
        git config user.name "Azure Pipeline"
        git config user.email "azure-pipeline@microsoft.com"
        git add "$CASK_DIR/azure-cli.rb"
        git commit -m "Update azure-cli to $VERSION" || echo "No changes"
        git push origin HEAD:main
        
        echo "Homebrew cask updated successfully"
        
      displayName: 'Push cask to Homebrew tap'

# ============================================================================
# JOB: TEST PUBLISHED CASK (Optional)
# ============================================================================
- ${{ if and(eq(parameters.TestAfterPublish, true), eq(parameters.UpdateHomebrew, true)) }}:
  - job: TestPublishedCask
    displayName: 'macOS | Test Published Cask'
    dependsOn: UpdateHomebrewCask
    condition: succeeded()
    strategy:
      matrix:
        ARM64:
          Architecture: 'arm64'
          vmImageName: ${{ parameters.MacosArm64Image }}
        Intel:
          Architecture: 'x86_64'
          vmImageName: ${{ parameters.MacosIntelImage }}
    pool:
      vmImage: $(vmImageName)
    
    steps:
    - checkout: none
    
    - bash: |
        echo "=== Cleanup: Remove pre-installed Azure CLI ($(Architecture)) ==="
        
        if command -v az &> /dev/null; then
          echo "Pre-installed Azure CLI detected: $(which az)"
          
          brew uninstall azure-cli 2>/dev/null || true
          brew uninstall --cask azure-cli 2>/dev/null || true
          
          sudo rm -f /usr/local/bin/az
          sudo rm -f /opt/homebrew/bin/az
          
          hash -r
        fi
        echo "Cleanup complete"
      displayName: 'Remove pre-installed Azure CLI'
    
    - bash: |
        set -e
        
        echo "=== Testing Published Homebrew Cask ($(Architecture)) ==="
        
        if ! brew list "python@$RELEASE_PYTHON_VERSION" &>/dev/null; then
          echo "Installing Python $RELEASE_PYTHON_VERSION..."
          brew install "python@$RELEASE_PYTHON_VERSION"
        fi
        
        brew tap "$RELEASE_HOMEBREW_TAP"
        brew install --cask azure-cli
        
        which az
        az version
        
        INSTALLED_VERSION=$(az version -o tsv --query '"azure-cli"' 2>/dev/null || echo "unknown")
        
        echo ""
        echo "Installed version: $INSTALLED_VERSION"
        echo "Published cask installation successful ($(Architecture))"
        
        brew uninstall --cask azure-cli
      displayName: 'Test published cask install'
      env:
        RELEASE_PYTHON_VERSION: ${{ parameters.PythonVersion }}
        RELEASE_HOMEBREW_TAP: ${{ parameters.HomebrewTapRepo }}

  - job: TestPublishedLinuxCask
    displayName: 'Linux | Test Published Cask'
    dependsOn: UpdateHomebrewCask
    condition: succeeded()
    strategy:
      matrix:
        ARM64:
          Architecture: 'arm64'
          PoolName: ${{ parameters.LinuxArm64Pool }}
        X64:
          Architecture: 'x86_64'
          PoolName: ${{ parameters.LinuxX64Pool }}
    pool:
      name: $(PoolName)

    steps:
    - checkout: none

    - template: ../linux/setup-homebrew.yml

    - bash: |
        set -euo pipefail

        brew uninstall azure-cli 2>/dev/null || true
        brew uninstall --cask azure-cli 2>/dev/null || true
        brew install "python@$RELEASE_PYTHON_VERSION"
        brew tap "$RELEASE_HOMEBREW_TAP"
        brew install --cask azure-cli
        az version
        brew uninstall --cask azure-cli
      displayName: 'Test published Linux cask install'
      env:
        RELEASE_PYTHON_VERSION: ${{ parameters.PythonVersion }}
        RELEASE_HOMEBREW_TAP: ${{ parameters.HomebrewTapRepo }}

# ============================================================================
# JOB: PRINT SUMMARY
# ============================================================================
- job: PrintSummary
  displayName: 'Standalone | Print Summary'
  dependsOn:
  - ${{ parameters.dependsOn }}
  - ${{ if eq(parameters.PublishToGitHub, true) }}:
    - CreateGitHubRelease
  - ${{ if eq(parameters.UpdateHomebrew, true) }}:
    - UpdateHomebrewCask
  - ${{ if and(eq(parameters.TestAfterPublish, true), eq(parameters.UpdateHomebrew, true)) }}:
    - TestPublishedCask
    - TestPublishedLinuxCask
  condition: always()
  pool:
    vmImage: 'ubuntu-latest'
  
  steps:
  - checkout: none
  
  - bash: |
      echo "╔══════════════════════════════════════════════════════════════════╗"
      echo "║    AZURE CLI STANDALONE PUBLISH SUMMARY                          ║"
      echo "╠══════════════════════════════════════════════════════════════════╣"
      echo "║ Architectures:  ARM64 (Apple Silicon) + x86_64 (Intel)           ║"
      echo "║ GitHub Release: ${{ parameters.PublishToGitHub }}                                           ║"
      echo "║ Homebrew Update: ${{ parameters.UpdateHomebrew }}                                          ║"
      echo "║ Test After Publish: ${{ parameters.TestAfterPublish }}                                       ║"
      echo "╠══════════════════════════════════════════════════════════════════╣"
      echo "║ ARTIFACTS CONSUMED                                               ║"
      echo "╠══════════════════════════════════════════════════════════════════╣"
      echo "║ • macos-cli-signed-notarized-arm64 (tarballs)                          ║"
      echo "║ • macos-cli-signed-notarized-x86_64 (tarballs)                         ║"
      echo "║ • linux-cli-final-arm64 (tarballs)                                     ║"
      echo "║ • linux-cli-final-x86_64 (tarballs)                                    ║"
      echo "║ • cask-definition (azure-cli.rb)                                       ║"
      echo "╚══════════════════════════════════════════════════════════════════╝"
    displayName: 'Print Summary'
